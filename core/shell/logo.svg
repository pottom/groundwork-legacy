      <stop class="gwl-t26" offset="1"/>
    </linearGradient>
    <linearGradient id="gwl-codeHeader" x1="0" y1="0" x2="1" y2="1">
      <stop class="gwl-t27"/>
      <stop class="gwl-t25" offset="1"/>
    </linearGradient>
    <linearGradient id="gwl-blueCode" x1="0" y1="0" x2="1" y2="0">
