: #121317 } :root[data-theme="dark"] .gwl-f35 { fill: #ee7a6c } :root[data-theme="dark"] .gwl-f36 { fill: #f0b45d } :root[data-theme="dark"] .gwl-f37 { fill: #5cc58a } :root[data-theme="dark"] .gwl-s38 { stroke: #2f3238 } :root[data-theme="dark"] .gwl-f39 { fill: #8fa8f5 } :root[data-theme="dark"] .gwl-f40 { fill: #c9b8fb }
