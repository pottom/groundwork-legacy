      <path d="M451 583 L523 572" fill="none" stroke="url(#gwl-greenCode)" stroke-width="26" stroke-linecap="round"/>
      <path d="M567 565 L754 538" fill="none" stroke="url(#gwl-mutedCode)" stroke-width="27" stroke-linecap="round"/>
