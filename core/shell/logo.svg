      <stop class="gwl-t19" offset=".34"/>
      <stop class="gwl-t20" offset=".78"/>
      <stop class="gwl-t21" offset="1"/>
    </linearGradient>
    <linearGradient id="gwl-barTop" x1="0" y1="1" x2="1" y2="0">
