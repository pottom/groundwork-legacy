<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page.title">Development status</title>
<link rel="icon" href="data:,">
<!-- The Build module's dashboard: where the work stands, read from the project's Markdown tickets,
     specs and ADRs, its GitHub issues and its git history. What it reads, how it opens without the
     server and its history: README.md beside this file. -->
<link rel="stylesheet" href="/shell/theme.css">
<script>
// Inside the shell (an iframe of /) the shell's header shows the project, the live state and the
// version. Opened by double click (file://) there is no /shell/: the theme comes from the package's
// own copy beside this folder, and the :where(:root) values below stand in for its tokens.
try { if (window.self !== window.top) document.documentElement.classList.add('in-shell'); } catch (e) { document.documentElement.classList.add('in-shell'); }
if (location.protocol === 'file:') document.write('<link rel="stylesheet" href="../../core/shell/theme.css">');
</script>
<style>
/* The look is the shell's design system (/shell/theme.css): the --gw-* tokens and the .gw-*
   components (badge, tag, dot, buttons, field, card, section header, tabs, progress, empty state,
   callout, toast). This sheet only lays out Build's own views with them.

   Opened by double click there may be no theme at all: the :where(:root) blocks repeat its tokens
   as a fallback. :where() has no specificity, so when theme.css is there its :root wins. Keep them
   equal to core/shell/theme.css (module.test.mjs checks it). */
:where(:root) {
  color-scheme: light dark;

  --gw-bg: #fbfaf7;
  --gw-surface: #ffffff;
  --gw-sunken: #f3f1ec;
  --gw-fg: #1d1c1a;
  --gw-fg-2: #4a4843;
  --gw-muted: #6b6860;
  --gw-line: #e4e0d7;
  --gw-line-strong: #cfcac0;
  --gw-accent: #2f5bd3;
  --gw-accent-2: #8b5cf6;
  --gw-accent-fg: #ffffff;
  --gw-focus: #2f5bd3;
  --gw-ok: #1f8a4c;
  --gw-warn: #b45309;
  --gw-bad: #c0392b;
  --gw-info: #0284c7;
  --gw-violet: #8b5cf6;
  --gw-shadow: 0 1px 2px rgb(0 0 0 / .04), 0 4px 16px rgb(0 0 0 / .05);
  --gw-shadow-lg: 0 2px 6px rgb(0 0 0 / .06), 0 12px 32px rgb(0 0 0 / .10);

  --gw-ok-text: #17703d;
  --gw-warn-text: #9a4a08;
  --gw-bad-text: #a93226;
  --gw-info-text: #075a8c;
  --gw-violet-text: #6d3fd8;
  --gw-accent-text: #2a52c4;

  --gw-ok-soft: color-mix(in srgb, var(--gw-ok) 12%, transparent);
  --gw-warn-soft: color-mix(in srgb, var(--gw-warn) 12%, transparent);
  --gw-bad-soft: color-mix(in srgb, var(--gw-bad) 12%, transparent);
  --gw-info-soft: color-mix(in srgb, var(--gw-info) 12%, transparent);
  --gw-violet-soft: color-mix(in srgb, var(--gw-violet) 12%, transparent);
  --gw-accent-soft: color-mix(in srgb, var(--gw-accent) 12%, transparent);

  --gw-gradient: linear-gradient(90deg, var(--gw-accent), var(--gw-accent-2));
  --gw-gradient-fill: linear-gradient(135deg, #2f5bd3, #7547e6);

  --gw-font: Inter, 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
  --gw-font-serif: 'Source Serif 4', Georgia, serif;
  --gw-font-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
  --gw-text-xs: 11.5px/1.4;
  --gw-text: 15px/1.5;
  --gw-text-small: 13px/1.4;
  --gw-title: 650 19px/1.3;
  --gw-display: 680 28px/1.1;
  --gw-radius-sm: 6px;
  --gw-radius: 10px;
  --gw-radius-lg: 14px;
  --gw-radius-pill: 999px;
  --gw-space: 8px;
  --gw-header-height: 48px;
}

@media (prefers-color-scheme: dark) {
  :where(:root) {
    --gw-bg: #15161a;
    --gw-surface: #1c1e23;
    --gw-sunken: #24262c;
    --gw-fg: #ecebe8;
    --gw-fg-2: #c3c1bb;
    --gw-muted: #9a978f;
    --gw-line: #2f3238;
    --gw-line-strong: #464a52;
    --gw-accent: #7d9cf0;
    --gw-accent-2: #b48cf8;
    --gw-accent-fg: #15161a;
    --gw-focus: #7d9cf0;
    --gw-ok: #5cc58a;
    --gw-warn: #f0b45d;
    --gw-bad: #ee7a6c;
    --gw-info: #5ab8e8;
    --gw-violet: #b48cf8;
    --gw-shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .22);
    --gw-shadow-lg: 0 2px 8px rgb(0 0 0 / .35), 0 16px 40px rgb(0 0 0 / .4);
    --gw-ok-text: #6fd49b;
    --gw-warn-text: #f5c27a;
    --gw-bad-text: #f48f82;
    --gw-info-text: #7cc8f0;
    --gw-violet-text: #c4a3fa;
    --gw-accent-text: #97b0f5;
    --gw-gradient-fill: linear-gradient(135deg, var(--gw-accent), var(--gw-accent-2));
  }
}

/* Build's own colours: the lanes of the branch graph. */
:root { --g0: #2f5bd3; --g1: #c2410c; --g2: #1f8a4c; --g3: #7c3aed; --g4: #0b7269; --g5: #b4235a; --g6: #8a6d00; --g7: #4a6fa5; }
@media (prefers-color-scheme: dark) {
  :root { --g0: #7d9cf0; --g1: #f08a5d; --g2: #5cc58a; --g3: #b294f5; --g4: #5cc7bb; --g5: #f07aa8; --g6: #d9b44a; --g7: #8fb0dd; }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--gw-bg); color: var(--gw-fg); font: var(--gw-text-small) var(--gw-font); overflow-x: hidden; }
a { color: var(--gw-accent-text); text-decoration: none; text-underline-offset: 2px; }
a:hover { text-decoration: underline; }
a.gw-tag:hover, a.gw-btn:hover { text-decoration: none; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--gw-focus); outline-offset: 2px; border-radius: 4px; }
button, select, input { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; }
[hidden] { display: none !important; }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 8px; top: 8px; z-index: 50; background: var(--gw-surface); padding: 6px 10px; border-radius: var(--gw-radius-sm); box-shadow: var(--gw-shadow); }
.mono { font-family: var(--gw-font-mono); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--gw-muted); }
code { font-family: var(--gw-font-mono); font-size: .9em; background: var(--gw-sunken); padding: 1px 5px; border-radius: 4px; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* inside the shared components the icon takes their size */
.gw-empty__icon svg.i { width: 28px; height: 28px; stroke-width: 1.6; }
.gw-btn--icon svg.i { width: 18px; height: 18px; }
dl.meta .gw-progress { background: var(--gw-line); }

/* ---- The page's own bar: only when opened alone (the shell has its header) ---- */
#top {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--gw-surface) 86%, transparent);
  -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4);
  border-bottom: 1px solid var(--gw-line);
}
.in-shell #top { display: none; }
.bar { max-width: 1280px; margin: 0 auto; padding: 10px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-height: var(--gw-header-height); }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; font: 650 15px/1.25 var(--gw-font); letter-spacing: -.01em; }
.brand::before { content: ''; flex: none; width: 22px; height: 22px; border-radius: 7px; background: var(--gw-gradient-fill); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .15); }
.brand span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand small { font: 450 13px var(--gw-font); color: var(--gw-muted); white-space: nowrap; }
.live-state { display: inline-flex; align-items: center; gap: 8px; color: var(--gw-fg-2); white-space: nowrap; }
.live-state .when { color: var(--gw-muted); }
#lang { width: auto; }

/* ---- Layout ---- */
.wrap { max-width: 1280px; margin: 0 auto; padding: 20px 24px 96px; }
.stack-y > * + * { margin-top: 12px; }

/* ---- Start screen (no server: choose a folder) ---- */
#start { max-width: 640px; margin: 8vh auto 40px; padding: 0 16px; }
.in-shell #start { margin-top: 4vh; }
#start .gw-card__body { padding: 28px 30px; }
#start h2 { font: var(--gw-display) var(--gw-font); letter-spacing: -.02em; margin: 0 0 10px; }
#start p { margin: 8px 0; color: var(--gw-fg-2); font: var(--gw-text) var(--gw-font); }
#start p.muted { color: var(--gw-muted); font: var(--gw-text-small) var(--gw-font); }
.choices { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 20px 0 10px; }
.drop { border: 1.5px dashed var(--gw-line-strong); border-radius: var(--gw-radius); padding: 20px; color: var(--gw-muted); margin-top: 16px; text-align: center; transition: background-color .15s, border-color .15s; }
body.dragging .drop { border-color: var(--gw-accent); background: var(--gw-accent-soft); color: var(--gw-fg); }
.rules { color: var(--gw-muted); margin-top: 24px; border-top: 1px solid var(--gw-line); padding-top: 14px; }
.rules p { font: var(--gw-text-small) var(--gw-font) !important; color: var(--gw-muted) !important; }

/* ---- Overview: one strip of four numbers, progress along its bottom edge ---- */
.summary { overflow: hidden; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tile { display: grid; align-content: start; gap: 2px; padding: 14px 18px 14px; min-width: 0; border-left: 1px solid var(--gw-line); }
.tile:first-child { border-left: 0; }
.tile__label { display: flex; align-items: center; gap: 8px; color: var(--gw-fg-2); font: 500 var(--gw-text-small) var(--gw-font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile__value { font: var(--gw-display) var(--gw-font); font-variant-numeric: tabular-nums; letter-spacing: -.02em; margin-top: 4px; }
.tile__sub { color: var(--gw-muted); font: var(--gw-text-xs) var(--gw-font); min-height: 16px; }
.tile.is-zero .tile__value { color: var(--gw-muted); }
.tile.is-good .tile__sub { color: var(--gw-ok-text); font-weight: 600; }
a.tile { color: inherit; transition: background .15s; }
a.tile:hover { text-decoration: none; background: color-mix(in srgb, var(--gw-sunken) 55%, transparent); }
.summary__foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 10px 10px 18px; border-top: 1px solid var(--gw-line); background: color-mix(in srgb, var(--gw-sunken) 45%, transparent); }
.summary__foot .gw-progress { flex: 1 1 200px; height: 8px; }
.summary__pct { font: 650 var(--gw-text-small) var(--gw-font); font-variant-numeric: tabular-nums; white-space: nowrap; }
.summary__pct span { color: var(--gw-muted); font-weight: 450; margin-left: 6px; }
.changes { color: var(--gw-fg-2); padding: 0 4px; }
.changes summary { cursor: pointer; display: flex; align-items: center; gap: 8px; list-style: none; border-radius: var(--gw-radius-sm); }
.changes summary::-webkit-details-marker { display: none; }
.changes summary .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.changes ul { margin: 6px 0 0; padding-left: 26px; color: var(--gw-fg-2); }
.changes .older { margin: 8px 0 0 16px; color: var(--gw-muted); }
.changes li b { color: var(--gw-fg); font-weight: 600; }

/* ---- Tabs and filters: they stay in sight while the view scrolls ---- */
.nav { position: sticky; top: var(--top-h, 0px); z-index: 6; background: var(--gw-bg); margin-top: 16px; }
.nav .gw-tabs { margin: 0 -4px; padding: 0 4px; }
.nav .gw-tabs > a:hover { text-decoration: none; }
.filters { padding: 12px 0 10px; }
.search { position: relative; flex: 1 1 260px; max-width: 380px; display: flex; }
.search .gw-field { width: 100%; padding-left: 32px; }
.search svg { position: absolute; left: 10px; top: 8px; color: var(--gw-muted); pointer-events: none; }
.filter-more { display: contents; }
.filters select.gw-field { max-width: 220px; }
label.check { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; color: var(--gw-fg-2); white-space: nowrap; height: 32px; padding: 0 4px; }
label.check input { accent-color: var(--gw-accent); width: 15px; height: 15px; margin: 0; }
.f-summary { color: var(--gw-muted); white-space: nowrap; }
.f-summary button { padding: 0 2px; border: 0; background: none; color: var(--gw-accent-text); cursor: pointer; }
.f-summary button:hover { text-decoration: underline; }
#f-toggle { display: none; }
.active { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: -2px 0 10px; color: var(--gw-muted); }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 4px 0 10px; border-radius: var(--gw-radius-pill); background: var(--gw-accent-soft); color: var(--gw-accent-text); font: 500 var(--gw-text-xs) var(--gw-font); white-space: nowrap; }
.pill b { font-weight: 650; }
.pill button { display: grid; place-items: center; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: inherit; cursor: pointer; }
.pill button:hover { background: color-mix(in srgb, var(--gw-accent) 18%, transparent); }
.pill button svg { width: 12px; height: 12px; }
.active > button.link { border: 0; background: none; padding: 0 4px; color: var(--gw-accent-text); cursor: pointer; font: inherit; }
.active > button.link:hover { text-decoration: underline; }

/* ---- Sections, tables ---- */
.view { padding-top: 6px; }
.lead { margin: 4px 0 18px; max-width: 86ch; color: var(--gw-muted); }
.group { margin: 0 0 28px; scroll-margin-top: calc(var(--top-h, 0px) + 112px); }
.group .gw-section-head { margin-bottom: 10px; }
.group.is-empty { margin-bottom: 14px; padding: 12px 16px; border: 1px dashed var(--gw-line); border-radius: var(--gw-radius-lg); }
.group.is-empty .gw-section-head { margin: 0; }
.group.is-empty .gw-section-head__title { font-size: 15px; color: var(--gw-fg-2); }
.none-yet { display: inline-flex; align-items: center; gap: 6px; color: var(--gw-ok-text); font: 500 var(--gw-text-small) var(--gw-font); }
.group.info .gw-section-head__title { color: var(--gw-fg-2); }
.tablewrap { overflow-x: auto; }
table.grid { width: 100%; border-collapse: collapse; }
table.grid th { text-align: left; font: 600 var(--gw-text-xs) var(--gw-font); color: var(--gw-muted); padding: 9px 14px; border-bottom: 1px solid var(--gw-line); white-space: nowrap; background: color-mix(in srgb, var(--gw-sunken) 50%, var(--gw-surface)); }
table.grid td { padding: 11px 14px; border-bottom: 1px solid var(--gw-line); vertical-align: top; }
table.grid tr:last-child td { border-bottom: 0; }
table.grid tbody tr[data-doc] { cursor: pointer; transition: background .12s; }
table.grid tbody tr[data-doc]:hover { background: color-mix(in srgb, var(--gw-accent) 5%, transparent); }
table.grid tbody tr.is-blocked .c-title a.open { color: var(--gw-fg-2); }
td.c-num { white-space: nowrap; font-family: var(--gw-font-mono); font-variant-numeric: tabular-nums; color: var(--gw-muted); width: 1%; font-size: 12.5px; padding-top: 12px; }
td.c-title { overflow-wrap: anywhere; min-width: 240px; }
td.c-title a.open { color: var(--gw-fg); font: 560 14px/1.45 var(--gw-font); }
td.c-title .gw-badge { margin-left: 4px; vertical-align: 1px; }
td.c-title .note { color: var(--gw-muted); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.refs-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 6px; color: var(--gw-muted); font: var(--gw-text-xs) var(--gw-font); }
.refs-line .gw-tag { font-size: 11.5px; }
td.c-title .sub { display: none; flex-wrap: wrap; align-items: center; gap: 4px 8px; color: var(--gw-muted); margin-top: 6px; }
td.c-area, td.c-last, td.c-st, td.c-chk { white-space: nowrap; }
th.c-area { width: 160px; } th.c-st { width: 170px; } th.c-chk { width: 110px; } th.c-last { width: 110px; } th.c-blk { width: 14%; }
td.c-area { color: var(--gw-fg-2); }
td.c-last { color: var(--gw-muted); font-variant-numeric: tabular-nums; }
.tref.is-closed { color: var(--gw-muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--gw-muted) 60%, transparent); }
.tref.is-missing { color: var(--gw-bad-text); background: var(--gw-bad-soft); }
.meter { display: inline-flex; align-items: center; gap: 8px; color: var(--gw-fg-2); font-variant-numeric: tabular-nums; }
.meter .gw-progress { width: 44px; height: 5px; }
.dash { color: var(--gw-muted); }

/* ---- Areas ---- */
details.area { margin-bottom: 8px; }
details.area > summary { display: grid; grid-template-columns: 16px minmax(150px, 1.2fr) minmax(0, 2fr) minmax(120px, 1fr) 150px; gap: 14px; align-items: center; padding: 12px 16px; cursor: pointer; list-style: none; border-radius: var(--gw-radius-lg); }
details.area.no-specs > summary { grid-template-columns: 16px minmax(150px, 2fr) minmax(120px, 1.4fr) 150px; }
details.area > summary::-webkit-details-marker { display: none; }
details.area > summary::before { content: ''; width: 7px; height: 7px; border-right: 1.5px solid var(--gw-muted); border-bottom: 1.5px solid var(--gw-muted); transform: rotate(-45deg); justify-self: center; transition: transform .15s; }
details.area[open] > summary::before { transform: rotate(45deg); }
details.area > summary:hover { background: color-mix(in srgb, var(--gw-sunken) 50%, transparent); }
details.area[open] > summary { border-radius: var(--gw-radius-lg) var(--gw-radius-lg) 0 0; }
.area__name { font: 600 14px/1.4 var(--gw-font); overflow-wrap: anywhere; }
.area__spec { color: var(--gw-fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.area__spec .gw-badge { margin-right: 6px; }
.area__cnt { text-align: right; white-space: nowrap; color: var(--gw-muted); font-variant-numeric: tabular-nums; }
.area__cnt b { color: var(--gw-fg); font-weight: 650; }
details.area .inner { padding: 4px 16px 16px; border-top: 1px solid var(--gw-line); }
details.area .inner .gw-card { box-shadow: none; }
.doclist { margin: 10px 0 14px; padding: 0; list-style: none; display: grid; gap: 6px; }
.doclist li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.doclist .path { color: var(--gw-muted); font: 12px var(--gw-font-mono); overflow-wrap: anywhere; }

/* ---- Dependency tree ---- */
ul.tree, ul.tree ul { list-style: none; margin: 0; padding: 0; }
ul.tree > li { padding: 12px 16px; margin-bottom: 10px; }
ul.tree ul { margin: 2px 0 0 14px; padding-left: 22px; }
ul.tree ul > li { position: relative; padding: 6px 0 0; }
ul.tree ul > li::before { content: ''; position: absolute; left: -22px; top: 0; width: 16px; height: 23px; border-left: 1.5px solid var(--gw-line-strong); border-bottom: 1.5px solid var(--gw-line-strong); border-bottom-left-radius: 8px; }
ul.tree ul > li::after { content: ''; position: absolute; left: -22px; top: 23px; bottom: 0; border-left: 1.5px solid var(--gw-line-strong); }
ul.tree ul > li:last-child::after { display: none; }
.node { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; min-height: 30px; }
ul.tree ul .node { display: inline-flex; max-width: 100%; background: var(--gw-surface); border: 1px solid var(--gw-line); border-radius: var(--gw-radius); padding: 4px 10px; }
.node .ttl { overflow-wrap: anywhere; font-weight: 560; min-width: 0; color: var(--gw-fg); }
.node.ctx { opacity: .68; }
.node.ctx .ttl { font-weight: 450; }
.rel { color: var(--gw-muted); }
.unlocks { display: block; margin: 8px 0 0 2px; color: var(--gw-muted); font: 500 var(--gw-text-xs) var(--gw-font); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--gw-muted); margin: -6px 0 16px; align-items: center; }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }

/* ---- Activity ---- */
.day { margin: 0 0 18px; }
.day__head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px; }
.day__head h3 { font: 600 14px/1.3 var(--gw-font); }
.day__head span { color: var(--gw-muted); }
.day ul { margin: 0; padding: 0; list-style: none; }
.day li { padding: 11px 16px; border-bottom: 1px solid var(--gw-line); }
.day li:last-child { border-bottom: 0; }
.day .notes { margin: 4px 0 0; color: var(--gw-fg-2); display: grid; gap: 2px; }
.day .notes div { padding-left: 16px; position: relative; }
.day .notes div::before { content: ''; position: absolute; left: 3px; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--gw-line-strong); }
.day .notes div.event { color: var(--gw-muted); }
.view-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: -6px 0 16px; }

/* ---- Git branches ---- */
.ref { --c: var(--gw-muted); display: inline-flex; align-items: center; gap: 6px; padding: 0 7px; border: 1px solid transparent; border-radius: var(--gw-radius-sm); background: var(--gw-sunken); color: var(--gw-fg-2); font: 500 12px/1.6 var(--gw-font-mono); white-space: nowrap; }
.ref::before { content: ''; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.ref.remote { background: transparent; border: 1px dashed var(--gw-line-strong); }
.ref.tag::before { border-radius: 1px; transform: rotate(45deg); width: 6px; height: 6px; background: var(--gw-muted); }
.ref.head { border: 1.5px solid transparent; background: linear-gradient(var(--gw-surface), var(--gw-surface)) padding-box, var(--gw-gradient) border-box; color: var(--gw-fg); font-weight: 600; }
.lane0 { --c: var(--g0); } .lane1 { --c: var(--g1); } .lane2 { --c: var(--g2); } .lane3 { --c: var(--g3); }
.lane4 { --c: var(--g4); } .lane5 { --c: var(--g5); } .lane6 { --c: var(--g6); } .lane7 { --c: var(--g7); }
button.ref { cursor: pointer; }
button.ref:hover { color: var(--gw-fg); border-color: var(--c); }
td.c-branch { white-space: nowrap; }
td.c-branch .muted { margin-left: 6px; }
.graph { position: relative; overflow-x: auto; padding: 4px 0; }
.graph svg { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.graph svg path { fill: none; stroke-width: 2; stroke-linecap: round; }
.graph svg circle { stroke-width: 2; }
.graph .rows { position: relative; min-width: 560px; }
.graph .row { height: var(--row-h); display: flex; align-items: center; gap: 8px; padding-right: 14px; cursor: pointer; white-space: nowrap; border-radius: var(--gw-radius-sm); }
.graph .row:hover { background: color-mix(in srgb, var(--gw-fg) 4%, transparent); }
.graph .row.hit { background: var(--gw-accent-soft); }
.graph .row .h { font: 12px var(--gw-font-mono); color: var(--gw-muted); flex: none; }
.graph .row .s { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; color: var(--gw-fg); }
.graph .row.merge .s { color: var(--gw-fg-2); }
.graph .row .who { color: var(--gw-muted); flex: none; }
.graph .row .when { color: var(--gw-muted); flex: none; width: 84px; text-align: right; font-variant-numeric: tabular-nums; }
.graph .refs { display: inline-flex; gap: 4px; flex: none; }
.graph .refs .ref { font-size: 11.5px; }
.graph .detail { padding: 10px 12px; margin: 0 10px 6px 0; background: var(--gw-sunken); border-radius: var(--gw-radius); white-space: normal; display: grid; gap: 2px; }
.graph .detail .mono { overflow-wrap: anywhere; }
.graph-foot { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 12px; color: var(--gw-muted); }
.graph-foot .legend-refs { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* ---- Drawer: a panel inside the module, under the shell's header ---- */
#shade { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--gw-bg) 40%, rgb(10 10 14 / .35)); }
#drawer {
  position: fixed; top: 12px; right: 12px; bottom: 12px; z-index: 21; width: min(860px, calc(100% - 24px));
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--gw-surface); border: 1px solid var(--gw-line); border-radius: var(--gw-radius-lg); box-shadow: var(--gw-shadow-lg);
}
@media (prefers-reduced-motion: no-preference) {
  #shade:not([hidden]) { animation: fade .15s ease-out; }
  #drawer:not([hidden]) { animation: slide .2s cubic-bezier(.2, .8, .2, 1); }
}
@keyframes fade { from { opacity: 0; } }
@keyframes slide { from { transform: translateX(28px); opacity: .4; } }
#drawer > header { display: flex; gap: 12px; align-items: flex-start; padding: 16px 14px 14px 22px; border-bottom: 1px solid var(--gw-line); }
#drawer > header > div { flex: 1; min-width: 0; }

#drawer .scroll { overflow: auto; padding: 0 22px 64px; flex: 1; overscroll-behavior: contain; }
dl.meta { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 18px; margin: 16px 0 6px; padding: 14px 16px; background: var(--gw-sunken); border-radius: var(--gw-radius); align-items: center; }
dl.meta dt { color: var(--gw-muted); }
dl.meta dd { margin: 0; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.md { max-width: 76ch; overflow-wrap: anywhere; font: 14.5px/1.65 var(--gw-font); color: var(--gw-fg); }
.md h1 { font: var(--gw-title) var(--gw-font); margin: 24px 0 8px; }
.md h2 { font: 650 16.5px/1.35 var(--gw-font); border-bottom: 1px solid var(--gw-line); padding-bottom: 5px; margin: 28px 0 8px; }
.md h3 { font: 650 14.5px/1.4 var(--gw-font); margin: 22px 0 6px; }
.md h4, .md h5, .md h6 { font: 650 13.5px/1.4 var(--gw-font); margin: 18px 0 6px; }
.md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: 9px 0; }
.md ul, .md ol { padding-left: 22px; }
.md li { margin: 3px 0; }
.md li.task { list-style: none; margin-left: -20px; }
.md li.task input { margin: 0 8px 0 0; vertical-align: -1px; accent-color: var(--gw-ok); }
.md li.task.done > span.t { color: var(--gw-muted); }
.md pre { background: var(--gw-sunken); padding: 11px 13px; border-radius: var(--gw-radius); overflow: auto; font: 12.5px/1.55 var(--gw-font-mono); }
.md pre code { background: none; padding: 0; font-size: inherit; }
.md blockquote { box-shadow: inset 3px 0 0 var(--gw-accent); background: var(--gw-accent-soft); padding: 4px 14px; color: var(--gw-fg-2); margin-left: 0; border-radius: 0 var(--gw-radius-sm) var(--gw-radius-sm) 0; }
.md .tw { overflow-x: auto; }
.md table { border-collapse: collapse; font-size: 13px; }
.md th, .md td { border: 1px solid var(--gw-line); padding: 5px 9px; vertical-align: top; text-align: left; }
.md th { background: var(--gw-sunken); }
.md hr { border: 0; border-top: 1px solid var(--gw-line-strong); margin: 20px 0; }
.md .dead { border-bottom: 1px dotted var(--gw-muted); }
.md del { color: var(--gw-muted); }

/* ---- Narrow: its own layout, not a shrunk desktop ---- */
@media (max-width: 860px) {
  .bar { padding-left: 16px; padding-right: 16px; }
  .wrap { padding: 14px 16px 80px; }
  table.grid th.c-area, table.grid td.c-area, table.grid th.c-blk, table.grid td.c-blk, table.grid th.c-last, table.grid td.c-last { display: none; }
  td.c-title .sub { display: flex; }

  details.area > summary, details.area.no-specs > summary { grid-template-columns: 14px 1fr auto; gap: 6px 10px; padding: 12px 14px; }
  details.area > summary .area__spec { grid-column: 2 / -1; order: 3; }
  details.area > summary .gw-progress { grid-column: 2 / -1; order: 4; }

  #drawer { top: 8px; right: 8px; bottom: 8px; width: calc(100% - 16px); }

  .graph .rows { min-width: 0; }
}
@media (max-width: 760px) {
  .nav { position: static; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  .tile__value { font-size: 24px; margin-top: 2px; }
  .summary__foot { padding-left: 14px; }
  .filters { gap: 8px; }

  #f-toggle { display: inline-flex; }
  .filter-more { display: none; }
  .filters.is-open .filter-more { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; order: 3; }
  .filters.is-open .filter-more select.gw-field { flex: 1 1 40%; max-width: none; }

}
@media (max-width: 520px) {
  table.grid th.c-st, table.grid td.c-st, table.grid th.c-chk, table.grid td.c-chk { display: none; }
  td.c-num { padding-right: 0; }
  ul.tree > li { padding: 10px 12px; }

  ul.tree ul > li::before { left: -16px; width: 12px; }
  ul.tree ul > li::after { left: -16px; }
  dl.meta { grid-template-columns: 1fr; gap: 2px; }

  .graph .row .h, .graph .row .when { display: none; }
  .brand small { display: none; }
  td.c-branch { white-space: normal; }
  td.c-branch .ref { white-space: normal; overflow-wrap: anywhere; }
  td.c-branch .muted { display: block; margin: 4px 0 0; }
}
</style>

<body>
<a class="skip" href="#main" data-i18n="page.skip">Skip to content</a>

<!-- Opened alone only: inside the shell its header shows the project, the live state and the version. -->
<header id="top">
  <div class="bar">
    <h1 class="brand" id="project"><span data-i18n="page.title">Development status</span></h1>
    <span class="live-state" id="live" hidden><span class="gw-dot" id="dot"></span><span id="live-text" aria-live="polite"></span></span>
    <button type="button" class="gw-btn gw-btn--sm" id="change" data-i18n="live.change" hidden>Another folder</button>
    <span class="gw-tag" id="ver" hidden></span>
    <select id="lang" class="gw-lang gw-field" data-i18n-aria-label="page.lang"></select>
  </div>
</header>

<main id="main">
  <section id="start"><div class="gw-card"><div class="gw-card__body">
    <h2 data-i18n="page.title">Development status</h2>
    <p data-i18n="start.intro"></p>
    <div id="resume" hidden>
      <div class="choices">
        <button type="button" class="gw-btn gw-btn--primary" id="resume-btn"></button>
      </div>
      <p class="muted" data-i18n="start.resume-note"></p>
    </div>
    <div class="choices">
      <button type="button" class="gw-btn gw-btn--primary" id="pick" hidden></button>
      <button type="button" class="gw-btn" id="snapshot" data-i18n="start.snapshot"></button>
      <input type="file" id="dir-input" webkitdirectory multiple hidden>
    </div>
    <p id="mode-note" class="muted"></p>
    <div id="start-error" class="gw-callout gw-callout--bad" hidden></div>
    <div class="drop" data-i18n="start.drop"></div>
    <div class="rules"><p id="rules"></p></div>
  </div></div></section>

  <section id="app" class="wrap" hidden>
    <div id="notices" class="stack-y"></div>
    <div id="overview" class="stack-y"></div>
    <div class="nav" id="nav">
      <nav class="gw-tabs" id="tabs" data-i18n-aria-label="page.views"></nav>
      <div class="filters gw-toolbar" id="filters" role="search">
        <div class="search" data-f="q">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          <input type="search" class="gw-field" id="q" data-i18n-placeholder="filter.search" data-i18n-aria-label="filter.search-label">
        </div>
        <button type="button" class="gw-btn" id="f-toggle" aria-expanded="false" aria-controls="f-more"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span data-i18n="filter.toggle">Filters</span><span class="gw-badge gw-badge--accent" id="f-count" hidden></span></button>
        <div class="filter-more" id="f-more">
          <select class="gw-field" id="f-status" data-f="status" data-i18n-aria-label="filter.status"></select>
          <select class="gw-field" id="f-area" data-f="area" data-i18n-aria-label="filter.area"></select>
          <label class="check" data-f="closed"><input type="checkbox" id="f-closed"> <span data-i18n="filter.closed"></span></label>
        </div>
        <span class="gw-toolbar__spacer"></span>
        <span class="f-summary" id="f-summary" aria-live="polite"></span>
      </div>
      <div class="active" id="f-active" hidden></div>
    </div>
    <div class="view" id="view"></div>
  </section>
</main>

<div id="shade" hidden></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
  <header>
    <div><div class="kicker" id="drawer-kicker"></div><h2 id="drawer-title"></h2></div>
    <button type="button" class="gw-btn gw-btn--icon" id="drawer-close" data-i18n-title="drawer.close-label" data-i18n-aria-label="drawer.close-label"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <div class="scroll" id="drawer-body" tabindex="-1"></div>
</aside>

<div class="gw-toasts" id="toasts" aria-live="polite"></div>

<!-- The UI translation (i18n.js, a copy of core/shell/i18n.mjs without "export") and Build's
     strings (ui-strings.js, BUILD_STRINGS). Classic scripts, not modules: opened by double click
     (file://) there is no /shell/ and no module import, but a classic script beside the page loads.
     Do not edit i18n.js: change core/shell/i18n.mjs and copy it (ui-strings.test.mjs checks). -->
<script src="i18n.js"></script>
<script src="ui-strings.js"></script>
<script src="ticket-reader.js"></script>
<script>
(() => {
'use strict';

// The UI language: English by default, Hungarian too; the choice is shared with the shell.
const i18n = createI18n(BUILD_STRINGS);
const ui = i18n.t;
const IN_SHELL = document.documentElement.classList.contains('in-shell');

// ───────────────────────── Constants ─────────────────────────

// The Build module's endpoints on the core server, when the page is loaded
// from it. The same values are in modules/build/module.mjs.
const SERVER_ID = 'development-status';
const SERVER_API = '/api/build';
const SERVER_TIMEOUT_MS = 8000;

const POLL_MS = 3000;
const FRESH_MS = 90000;
const TOAST_MS = 3500;

// What a ticket is and how it is read (the model every view draws), where the tracker is and
// which folders are walked, the states and the links to Plan: ticket-reader.js, beside the page.
// The server reads the tickets for Plan's counts by the same rules (project-tickets.mjs).
const {
  readTickets, locateProject, keepsFolder, planLink, prdFilter, CLOSED, DONE, DROPPED, UNPARSED, README_FILE, GLOSSARY_FILE,
  DEFAULT_TRACKER_DIR, ALWAYS_SKIP, SKIP_DIRS, LOCATE_DEPTH, fold, plainInline, isClosed,
} = GroundworkTickets;
const HUMAN = new Set(['ready-for-human', 'needs-info', 'needs-triage']);
const TEST = /^needs-(.*)-test$/;
const GROUPS = [
  { id: 'agent', title: 'group.agent', hint: 'group.agent.hint', has: (s) => s === 'ready-for-agent' },
  { id: 'human', title: 'group.human', hint: 'group.human.hint', has: (s) => HUMAN.has(s) },
  { id: 'test', title: 'group.test', hint: 'group.test.hint', has: (s) => TEST.test(s) },
  { id: 'claimed', title: 'group.claimed', hint: 'group.claimed.hint', has: (s) => s === 'claimed' },
];
const VIEWS = [
  ['waiting', 'view.waiting'], ['areas', 'view.areas'], ['deps', 'view.deps'],
  ['activity', 'view.activity'], ['checks', 'view.checks'], ['docs', 'view.docs'], ['git', 'view.git'],
];
// The filters each view applies; only these show above it.
const TICKET_FILTERS = ['q', 'status', 'area', 'closed'];
const FILTERS = { waiting: TICKET_FILTERS, areas: TICKET_FILTERS, deps: TICKET_FILTERS, activity: ['q', 'area'], checks: ['q', 'area'], docs: ['q', 'area'], git: [] };
const GIT_PAGE = 400;     // commits asked for at once; "Earlier commits" asks for this many more
const GIT_ROW_H = 30;     // px, one commit
const GIT_LANE_W = 16;    // px, one lane of the graph
const GIT_COLORS = 8;     // --g0 … --g7
const NO_REPO = 'no-repo'; // gitState.error when the folder is not the top of a git repository

// ───────────────────────── Small helpers ─────────────────────────

const $ = (id) => document.getElementById(id);
// The one escaper of the page: every text from a file, an issue or git goes through it.
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const joinPath = (a, b) => (a ? a + '/' + b : b);
const clock = (d) => d.toLocaleTimeString(i18n.lang, { hour: '2-digit', minute: '2-digit' });
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const ICONS = {
  refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/>',
  x: '<path d="M7 7l10 10M17 7L7 17"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  doc: '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
  inbox: '<path d="M4 13l2.5-7h11L20 13v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/>',
  branch: '<circle cx="7" cy="6" r="2"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="8" r="2"/><path d="M7 8v8M17 10c0 4-10 2-10 6"/>',
};
const icon = (name) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;

// A status in the UI: its translated name; the label itself stays in the title.
function statusTone(status) {
  if (status === UNPARSED) return 'bad';
  if (status === 'ready-for-agent') return 'accent';
  if (HUMAN.has(status)) return 'warn';
  if (TEST.test(status)) return 'violet';
  if (status === 'claimed') return 'info';
  if (DONE.has(status)) return 'ok';
  return 'neutral';
}
const STATUS_NAMES = {
  'ready-for-agent': 'status.ready-for-agent', 'ready-for-human': 'status.ready-for-human', 'needs-info': 'status.needs-info',
  'needs-triage': 'status.needs-triage', claimed: 'status.claimed', done: 'status.done', resolved: 'status.resolved',
  closed: 'status.closed', wontfix: 'status.wontfix', legacy: 'status.legacy', open: 'status.open',
};
function statusName(status) {
  if (status === UNPARSED) return ui('status.unparsed');
  const test = TEST.exec(status);
  if (test) return ui('status.needs-test', { what: test[1].replace(/-/g, ' ') });
  return Object.prototype.hasOwnProperty.call(STATUS_NAMES, status) ? ui(STATUS_NAMES[status]) : status;
}
const statusTitle = (status) => (status === UNPARSED ? '' : ui('status.label', { label: status }));
const chip = (status) => `<span class="gw-badge gw-badge--dot gw-badge--${statusTone(status)}" title="${esc(statusTitle(status))}">${esc(statusName(status))}</span>`;
const badge = (tone, text, title) => `<span class="gw-badge gw-badge--${tone}"${title ? ` title="${esc(title)}"` : ''}>${text}</span>`;
const count = (n) => `<span class="gw-badge gw-badge--count">${n}</span>`;
const sectionHead = (title, extra, hint) => `<div class="gw-section-head"><h2 class="gw-section-head__title">${title}</h2>${extra || ''}${hint ? `<span class="gw-section-head__hint">${hint}</span>` : ''}</div>`;
const empty = (iconName, title, text) => `<div class="gw-empty"><span class="gw-empty__icon">${icon(iconName)}</span><p class="gw-empty__title">${title}</p>${text ? `<p class="gw-empty__text">${text}</p>` : ''}</div>`;
// A dated entry of a ticket: a heading of its own, or a GitHub issue's opening or closing.
const commentTitle = (c) => (c.event ? ui(c.event === 'closed' ? 'activity.closed' : 'activity.opened') : c.title || ui('activity.untitled'));

// A transient message (re-read, up to date): a toast that goes away by itself.
function toast(text, tone = 'info') {
  const el = document.createElement('div');
  el.className = 'gw-toast gw-toast--' + tone;
  el.textContent = text;
  $('toasts').append(el);
  setTimeout(() => el.remove(), TOAST_MS);
}

// ───────────────────────── Reading the folder ─────────────────────────
// Four ways to get at a folder share one small adapter: list a directory's
// children, and turn a file node into a File (or what stands for one: size,
// lastModified, text()).

const handleAdapter = {
  async children(dir) {
    const out = [];
    for await (const h of dir.values()) out.push({ name: h.name, isDir: h.kind === 'directory', node: h });
    return out;
  },
  file: (h) => h.getFile(),
};

// Dropped folders where the browser has no file system handles (Firefox, Safari).
const entryAdapter = {
  children(dir) {
    return new Promise((resolve, reject) => {
      const reader = dir.createReader();
      const all = [];
      const step = () => reader.readEntries((batch) => {
        if (!batch.length) return resolve(all.map((e) => ({ name: e.name, isDir: e.isDirectory, node: e })));
        all.push(...batch);
        step();
      }, reject);
      step();
    });
  },
  file: (e) => new Promise((resolve, reject) => e.file(resolve, reject)),
};

// A flat list of paths as a tree: the file list of <input webkitdirectory>,
// and the list the launcher's server sends.
const treeAdapter = {
  children: async (dir) => [...dir.children.values()],
  file: async (node) => node.file,
};

function treeDir(root, parts) {
  let dir = root;
  for (const part of parts) {
    let child = dir.children.get(part);
    if (!child) { child = { name: part, isDir: true, node: { children: new Map() } }; dir.children.set(part, child); }
    dir = child.node;
  }
  return dir;
}

function treeFromFiles(fileList) {
  const root = { children: new Map() };
  let name = '';
  for (const f of fileList) {
    const parts = (f.webkitRelativePath || f.name).split('/');
    if (parts.length > 1) name = parts.shift();
    const last = parts.pop();
    treeDir(root, parts).children.set(last, { name: last, isDir: false, node: { file: f } });
  }
  return { root, name };
}

// The launcher's server: one request lists every markdown file (path, size,
// time) and each folder's count of other files; a file's text is asked for
// only when it changed.
class ServerDownError extends Error {
  constructor(message) { super(message); this.name = 'ServerDownError'; }
}

async function serverFetch(path) {
  const stop = new AbortController();
  const timeout = setTimeout(() => stop.abort(), SERVER_TIMEOUT_MS);
  try {
    return await fetch(SERVER_API + path, { cache: 'no-store', signal: stop.signal });
  } catch (err) {
    throw new ServerDownError(ui('error.server-down'));
  } finally {
    clearTimeout(timeout);
  }
}

async function serverJson(path) {
  const res = await serverFetch(path);
  let data = null;
  try { data = res.ok ? await res.json() : null; } catch (err) { data = null; }
  // Anything else on this address is not the launcher: as good as stopped.
  if (!data || data.server !== SERVER_ID) throw new ServerDownError(ui('error.not-our-server'));
  return data;
}

async function serverText(path) {
  const res = await serverFetch('/file?path=' + encodeURIComponent(path));
  if (!res.ok) throw new Error(path + ': HTTP ' + res.status);
  return res.text();
}

function treeFromListing(listing) {
  const root = { children: new Map() };
  for (const [path, others] of Object.entries(listing.dirs || {})) {
    const dir = treeDir(root, path ? path.split('/') : []);
    // Stand-ins for the files that are not markdown: only their number is known.
    // No real file name holds a slash.
    for (let i = 0; i < others; i++) dir.children.set('/' + i, { name: '/' + i, isDir: false, node: {} });
  }
  for (const f of listing.files || []) {
    const parts = f.path.split('/');
    const last = parts.pop();
    treeDir(root, parts).children.set(last, { name: last, isDir: false, node: { file: { size: f.size, lastModified: f.mtime, text: () => serverText(f.path) } } });
  }
  return root;
}

// Is the page loaded from the launcher's server? Asked, not guessed from the
// protocol: served by anything else, the page falls back to the folder picker.
async function findServer() {
  if (!/^https?:$/.test(location.protocol)) return null;
  try { return await serverJson('/hello'); } catch (err) { return null; }
}

function serverSource(hello) {
  const src = { adapter: treeAdapter, root: { children: new Map() }, name: hello.name || '', live: true, server: location.host, launcher: hello.launcher || '', version: hello.version || '', git: !!hello.git, github: !!hello.github };
  src.reload = async () => {
    const listing = await serverJson('/list');
    src.root = treeFromListing(listing);
    src.name = listing.name || src.name;
    src.roots = null;   // the tree is new: find the tracker in it again
  };
  return src;
}

async function findChild(A, dir, path) {
  let node = dir;
  for (const part of path.split('/')) {
    const hit = (await A.children(node)).find((c) => c.isDir && c.name === part);
    if (!hit) return null;
    node = hit.node;
  }
  return node;
}

// The folders the reader's locateProject decides by, with their nodes: LOCATE_DEPTH levels
// down; a heavy folder (SKIP_DIRS) only with its own subfolders, as it may be an area.
async function listFolders(A, root) {
  const nodes = new Map([['', root]]);
  const visit = async (dir, path, depth, heavy) => {
    await Promise.all((await A.children(dir)).map(async (c) => {
      if (!c.isDir || ALWAYS_SKIP.has(c.name)) return;
      const p = joinPath(path, c.name);
      nodes.set(p, c.node);
      if (!heavy && depth + 1 < LOCATE_DEPTH) await visit(c.node, p, depth + 1, SKIP_DIRS.has(c.name));
    }));
  };
  await visit(root, '', 0, false);
  return nodes;
}

// The tracker and the ADR folder: the same rule as the server's (ticket-reader.js).
async function locate(src) {
  const nodes = await listFolders(src.adapter, src.root);
  const { trackerPath, adrPath } = locateProject([...nodes.keys()]);
  return {
    tracker: trackerPath == null ? null : { node: nodes.get(trackerPath), path: trackerPath },
    adr: adrPath == null ? null : { node: nodes.get(adrPath), path: adrPath },
  };
}

async function walk(A, dir, path, depth, skipFrom, out) {
  const kids = await A.children(dir);
  await Promise.all(kids.map(async (c) => {
    const p = joinPath(path, c.name);
    if (c.isDir) {
      if (!keepsFolder(c.name, depth, skipFrom === 0)) return;
      await walk(A, c.node, p, depth + 1, skipFrom, out);
    } else if (/\.(md|markdown)$/i.test(c.name)) {
      const f = await A.file(c.node);
      out.entries.push({ path: p, size: f.size, mtime: f.lastModified, file: f });
    } else {
      out.others.push(p);
    }
  }));
}

// One pass over the folder: every markdown file of the tracker and the ADR
// folder with its size and time, without reading any content.
async function scan(src) {
  const A = src.adapter;
  if (src.reload) await src.reload();
  if (!src.roots || (!src.roots.tracker && Date.now() - src.located > 15000)) {
    src.roots = await locate(src);
    src.located = Date.now();
  }
  const out = { entries: [], others: [] };
  const top = await A.children(src.root);
  for (const c of top) {
    if (c.isDir || !(README_FILE.test(c.name) || GLOSSARY_FILE.test(c.name))) continue;
    const f = await A.file(c.node);
    out.entries.push({ path: c.name, size: f.size, mtime: f.lastModified, file: f });
  }
  const { tracker, adr } = src.roots;
  if (tracker) await walk(A, tracker.node, tracker.path, 0, 1, out);
  if (adr && !(tracker && (adr.path + '/').startsWith(tracker.path + '/'))) await walk(A, adr.node, adr.path, 0, 0, out);
  const seen = new Set();
  out.entries = out.entries.filter((e) => !seen.has(e.path) && seen.add(e.path));
  out.trackerPath = tracker ? tracker.path : null;
  out.adrPath = adr ? adr.path : null;
  return out;
}

const PROBLEM_KINDS = [
  ['duplicate', 'problem.duplicate'],
  ['no-status', 'problem.no-status'],
  ['bad-status', 'problem.bad-status'],
  ['all-checked', 'problem.all-checked'],
  ['missing-blocker', 'problem.missing-blocker'],
  ['released', 'problem.released', true],
  ['mismatch', 'problem.mismatch'],
  ['no-number', 'problem.no-number'],
  ['no-prd', 'problem.no-prd'],
  ['unknown-prd', 'problem.unknown-prd'],
];

// Kinds that are worth knowing but are not a contradiction: not counted as a warning.
const INFO_KINDS = new Set(PROBLEM_KINDS.filter((k) => k[2]).map((k) => k[0]));

// ───────────────────────── Markdown ─────────────────────────
// A small renderer for what the tickets use. Every piece of source text goes
// through esc() before it becomes HTML; raw HTML in the markdown is shown as text.

const LIST_ITEM = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const lead = (l) => l.length - l.trimStart().length;
const isOrdered = (m) => /\d/.test(m[2]);
const isBlockStart = (l) => /^\s*(#{1,6}\s|```|~~~|>)/.test(l) || /^\s*([-*_])(\s*\1){2,}\s*$/.test(l);
const TABLE_RULE = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;

function splitRow(line) {
  const cells = [];
  let cur = '', code = false;
  const s = line.trim().replace(/^\|/, '').replace(/\|\s*$/, (m0, off, str) => (str[off - 1] === '\\' ? m0 : ''));
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '`') code = !code;
    if (ch === '\\' && s[i + 1] === '|') { cur += '|'; i++; continue; }
    if (ch === '|' && !code) { cells.push(cur.trim()); cur = ''; } else cur += ch;
  }
  cells.push(cur.trim());
  return cells;
}

function renderMarkdown(text, ctx) {
  return renderBlocks(text.replace(/\r\n?/g, '\n').replace(/[\u0001\u0002]/g, '').replace(/\t/g, '    ').split('\n'), ctx);
}

function renderBlocks(lines, ctx) {
  const out = [];
  let para = [];
  const flush = () => {
    if (!para.length) return;
    // A line that starts a "**Field:** value" pair keeps its own line.
    const joined = para.map((l, i) => (i && (/^\*\*[^*]+:\*\*/.test(l.trim()) || /( {2}|\\)$/.test(para[i - 1])) ? '\u0001br\u0002' : i ? ' ' : '') + l.trim().replace(/\\$/, '')).join('');
    out.push('<p>' + renderInline(joined.replace(/\u0001br\u0002/g, '\n'), ctx).replace(/\n/g, '<br>') + '</p>');
    para = [];
  };
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { flush(); i++; continue; }

    const fence = /^(\s*)(```+|~~~+)(.*)$/.exec(line);
    if (fence) {
      flush();
      const body = [];
      i++;
      while (i < lines.length && !new RegExp('^\\s*' + fence[2][0] + '{' + fence[2].length + ',}\\s*$').test(lines[i])) body.push(lines[i++].slice(Math.min(fence[1].length, lead(lines[i - 1]))));
      i++;
      out.push('<pre><code>' + esc(body.join('\n')) + '</code></pre>');
      continue;
    }
    const h = /^(#{1,6})\s+(.*?)\s*#*\s*$/.exec(line);
    if (h) { flush(); out.push(`<h${h[1].length}>${renderInline(h[2], ctx)}</h${h[1].length}>`); i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flush(); out.push('<hr>'); i++; continue; }
    if (/^\s*>/.test(line)) {
      flush();
      const body = [];
      while (i < lines.length && (/^\s*>/.test(lines[i]) || (lines[i].trim() && body.length && !isBlockStart(lines[i]) && !LIST_ITEM.test(lines[i])))) body.push(lines[i++].replace(/^\s*>\s?/, ''));
      out.push('<blockquote>' + renderBlocks(body, ctx) + '</blockquote>');
      continue;
    }
    if (line.includes('|') && i + 1 < lines.length && TABLE_RULE.test(lines[i + 1]) && lines[i + 1].includes('-') && lines[i + 1].includes('|')) {
      flush();
      const head = splitRow(line);
      const align = splitRow(lines[i + 1]).map((c) => (/^:-+:$/.test(c) ? 'center' : /-:$/.test(c) ? 'right' : ''));
      const cell = (tag, c, k) => `<${tag}${align[k] ? ` style="text-align:${align[k]}"` : ''}>${renderInline(c, ctx)}</${tag}>`;
      let html = '<div class="tw"><table><thead><tr>' + head.map((c, k) => cell('th', c, k)).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && lines[i].trim() && lines[i].includes('|')) html += '<tr>' + splitRow(lines[i++]).map((c, k) => cell('td', c, k)).join('') + '</tr>';
      out.push(html + '</tbody></table></div>');
      continue;
    }
    const li = LIST_ITEM.exec(line);
    if (li) {
      flush();
      const base = li[1].length, ordered = isOrdered(li);
      const start = ordered ? parseInt(li[2], 10) : 1;
      const items = [];
      while (i < lines.length) {
        const m = LIST_ITEM.exec(lines[i]);
        if (!m || m[1].length < base || m[1].length >= base + 2 || isOrdered(m) !== ordered) break;
        const inner = m[1].length + m[2].length + 1;
        const body = [m[3]];
        i++;
        while (i < lines.length) {
          const l = lines[i];
          if (!l.trim()) {
            let j = i + 1;
            while (j < lines.length && !lines[j].trim()) j++;
            if (j < lines.length && lead(lines[j]) >= base + 2) { body.push(''); i++; continue; }
            break;
          }
          if (lead(l) >= base + 2) { body.push(l.slice(Math.min(lead(l), inner))); i++; continue; }
          if (LIST_ITEM.test(l) || isBlockStart(l)) break;
          body.push(l.trim());
          i++;
        }
        items.push(body);
        let j = i;
        while (j < lines.length && !lines[j].trim()) j++;
        const next = j > i && j < lines.length ? LIST_ITEM.exec(lines[j]) : null;
        if (next && next[1].length >= base && next[1].length < base + 2 && isOrdered(next) === ordered) i = j;
      }
      const tag = ordered ? 'ol' : 'ul';
      out.push(`<${tag}${ordered && start !== 1 ? ` start="${start}"` : ''}>` + items.map((body) => {
        const task = /^\[( |x|X)\]\s+(.*)$/.exec(body[0]);
        if (task) body = [task[2], ...body.slice(1)];
        let html = renderBlocks(body, ctx);
        const single = /^<p>([\s\S]*?)<\/p>/.exec(html);
        if (single) html = single[1] + html.slice(single[0].length);
        if (!task) return '<li>' + html + '</li>';
        const checked = task[1] !== ' ';
        return `<li class="task${checked ? ' done' : ''}"><input type="checkbox" disabled${checked ? ' checked' : ''} aria-label="${esc(ui(checked ? 'md.done' : 'md.not-done'))}"><span class="t">${html}</span></li>`;
      }).join('') + `</${tag}>`);
      continue;
    }
    para.push(line);
    i++;
    if (i < lines.length && (isBlockStart(lines[i]) || LIST_ITEM.test(lines[i]))) flush();
  }
  flush();
  return out.join('\n');
}

function resolvePath(from, href) {
  const parts = from.split('/').slice(0, -1);
  for (const seg of href.split('/')) {
    if (seg === '..') { if (!parts.length) return null; parts.pop(); } else if (seg && seg !== '.') parts.push(seg);
  }
  return parts.join('/');
}

function renderLink(url, html, ctx) {
  if (/^(https?:|mailto:)/i.test(url)) return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${html}</a>`;
  if (/^[a-z][a-z0-9+.-]*:/i.test(url) || url.startsWith('#') || url.startsWith('//')) return html;
  let target = url.replace(/[#?].*$/, '');
  try { target = decodeURIComponent(target); } catch (e) { /* keep as written */ }
  const path = target.startsWith('/') ? target.slice(1) : resolvePath(ctx.path, target);
  if (path && ctx.model.byPath.has(path)) return `<a href="${docHref(path)}" data-doc="${esc(path)}">${html}</a>`;
  return `<span class="dead" title="${esc(ui('md.dead-link', { url }))}">${html}</span>`;
}

function emphasis(s) {
  return s
    .replace(/\*\*(?=\S)([\s\S]+?)(?<=\S)\*\*/g, '<strong>$1</strong>')
    .replace(/(?<![\w\\])__(?=\S)([\s\S]+?)(?<=\S)__(?!\w)/g, '<strong>$1</strong>')
    .replace(/\*(?=[^\s*])([^*\n]+?)(?<=\S)\*/g, '<em>$1</em>')
    .replace(/(?<![\w\\])_(?=[^\s_])([^_\n]+?)(?<=\S)_(?!\w)/g, '<em>$1</em>')
    .replace(/~~(?=\S)([^~\n]+?)(?<=\S)~~/g, '<del>$1</del>');
}

function ticketRefs(s, ctx) {
  const m = ctx.model;
  s = s.replace(/(^|[^\w&/#])#(\d{1,6})(?![\w#])/g, (all, pre, num) => {
    const t = m.resolveIssue(+num);
    return t && t.path !== ctx.path ? pre + ticketLink(t) : all;
  });
  if (m.areaRef) s = s.replace(m.areaRef, (all, pre, whole, areaName, num) => {
    const t = m.resolveLocal(areaName, +num);
    return t && t.path !== ctx.path ? pre + ticketLink(t, whole) : all;
  });
  return s;
}

function renderInline(src, ctx, noLinks) {
  const stash = [];
  const keep = (html) => '\u0001' + (stash.push(html) - 1) + '\u0002';
  let s = src;
  s = s.replace(/(`+)([\s\S]*?[^`])\1(?!`)/g, (m, ticks, code) => keep('<code>' + esc(code.trim() || code) + '</code>'));
  s = s.replace(/\\([\\`*_{}[\]()#+\-.!|>~])/g, (m, ch) => keep(esc(ch)));
  s = s.replace(/!\[([^\]]*)\]\([^)]*\)/g, (m, alt) => keep('<span class="dead">' + esc(ui('md.image', { alt: alt || ui('md.image-unnamed') })) + '</span>'));
  if (!noLinks) {
    s = s.replace(/\[([^\]\n]+)\]\(\s*<?((?:[^()\s<>]|\([^()\s]*\))+)>?(?:\s+"[^"]*")?\s*\)/g, (m, label, url) => keep(renderLink(url, renderInline(label, ctx, true), ctx)));
    s = s.replace(/<(https?:\/\/[^>\s]+)>/g, (m, url) => keep(renderLink(url, esc(url), ctx)));
    s = s.replace(/\bhttps?:\/\/[^\s<>()\u0001]*[^\s<>().,;:!?"'\u0001„”]/g, (url) => keep(renderLink(url, esc(url), ctx)));
  }
  s = emphasis(esc(s));
  if (!noLinks) s = ticketRefs(s, ctx);
  for (let guard = 0; guard < 6 && s.includes('\u0001'); guard++) s = s.replace(/\u0001(\d+)\u0002/g, (m, k) => stash[+k] ?? '');
  return s;
}

// ───────────────────────── State ─────────────────────────

const STORE_KEY = 'development-status:' + location.pathname;
// prd: only the tickets naming this PRD item (Plan's link "/?module=build&prd=<id>"), closed ones too.
// The filters are not kept across reloads: a forgotten filter would contradict the overview.
const state = { view: 'waiting', doc: null, q: '', status: '', area: '', prd: '', showClosed: false, activityDays: 14, githubEvents: null };
try { state.prd = prdFilter(location.search); } catch (e) { /* no query */ }
try { localStorage.removeItem(STORE_KEY); } catch (e) { /* storage is optional */ }
const openDetails = new Set();
let source = null;       // { adapter, root, name, live, roots }; from the launcher's server also { server, launcher, reload }
let cache = new Map();   // path → { size, mtime, text }
let model = null;
let changeLog = [];      // newest first: { at, items: [{ path, label, text }] }
let recent = new Map();  // path → time of the last change seen in this session
let lastChecked = null;
let listing = null;      // the last scan of the files
let busy = false;
let pending = new Set(); // the parts asked for while a refresh ran
let announce = false;    // a refresh the user asked for: say when nothing changed
let timer = null;
let liveStop = null;     // stops the live updates (subscribe from /shell/live.mjs)
let liveToken = 0;
let liveState = '';      // the stream's state when the page runs without the shell
let lostAccess = false;
let serverDown = false;
let lastOpener = null;
// The git history from the launcher: { data, error, limit, open: Set of hashes, hit }.
let gitState = { data: null, error: '', limit: GIT_PAGE, open: new Set(), hit: '' };
// The GitHub issues the server sent: the source of the GitHub tickets.
const NO_ISSUES = () => ({ fingerprint: '', repo: null, issues: [], byNumber: new Map() });
let issueState = NO_ISSUES();

// The folder handle survives a reload in IndexedDB (the permission does not).
function idb(mode, run) {
  return new Promise((resolve) => {
    try {
      const open = indexedDB.open('development-status', 1);
      open.onupgradeneeded = () => open.result.createObjectStore('handles');
      open.onerror = () => resolve(null);
      open.onsuccess = () => {
        try {
          const tx = open.result.transaction('handles', mode);
          const req = run(tx.objectStore('handles'));
          tx.oncomplete = () => resolve(req ? req.result : null);
          tx.onerror = tx.onabort = () => resolve(null);
        } catch (e) { resolve(null); }
      };
    } catch (e) { resolve(null); }
  });
}
const rememberHandle = (h) => idb('readwrite', (s) => s.put(h, STORE_KEY));
const forgetHandle = () => idb('readwrite', (s) => s.delete(STORE_KEY));
const recallHandle = () => idb('readonly', (s) => s.get(STORE_KEY));

// ───────────────────────── Refresh ─────────────────────────

function describeChange(path, before, after) {
  if (after && after.kind === 'ticket') {
    if (!before) return { label: after.label, text: () => ui('change.new-ticket', { title: after.title, status: statusName(after.status) }) };
    const parts = [];
    if (before.status !== after.status) parts.push(() => ui('change.status', { from: statusName(before.status), to: statusName(after.status) }));
    if (before.checks.done !== after.checks.done || before.checks.total !== after.checks.total) parts.push(() => ui('change.checks', { from: `${before.checks.done}/${before.checks.total}`, to: `${after.checks.done}/${after.checks.total}` }));
    if (after.comments.length > before.comments.length) { const c = after.comments[after.comments.length - 1]; parts.push(() => ui('change.comment', { title: commentTitle(c) })); }
    if (before.title !== after.title) parts.push(() => ui('change.title', { title: after.title }));
    if (before.fields['blocked by'] !== after.fields['blocked by']) parts.push(() => ui('change.blocked-by', { list: after.fields['blocked by'] || ui('change.none') }));
    return { label: after.label, text: () => parts.map((f) => f()).join('; ') || ui('change.text') };
  }
  const name = path.split('/').slice(-2).join('/');
  if (!after) return { label: before && before.label ? before.label : name, text: () => ui('change.deleted') };
  return { label: name, text: () => ui(before ? 'change.modified' : 'change.new-file') };
}

// What a refresh reads: the Markdown files, the GitHub issues, Plan's map ids, the git history.
// A live update names what changed, and only that is asked again; every (re)connect reads all.
const ALL_PARTS = ['files', 'issues', 'map', 'git'];
const TOPIC_PART = { 'build.files': 'files', 'build.issues': 'issues', 'build.git': 'git', 'plan.map': 'map' };
function partsOf(topics) {
  const parts = new Set();
  for (const t of topics) {
    if (TOPIC_PART[t]) parts.add(TOPIC_PART[t]);
    else if (t.startsWith('build.')) ALL_PARTS.forEach((p) => parts.add(p));
  }
  return [...parts];
}

async function refresh(parts = ALL_PARTS) {
  if (!source) return;
  for (const p of parts) pending.add(p);
  if (busy) return;
  busy = true;
  try {
    while (pending.size && source) {
      const want = pending;
      pending = new Set();
      await refreshOnce(want);
    }
  } finally {
    busy = false;
    renderLive();
  }
}

// The files of the folder that changed since the last round (read again), and the gone ones.
async function readFiles() {
  const next = await scan(source);
  const seen = new Set();
  const touched = [];
  await Promise.all(next.entries.map(async (e) => {
    seen.add(e.path);
    const old = cache.get(e.path);
    if (old && old.size === e.size && old.mtime === e.mtime) return;
    // A file caught mid-write is read again in the next round.
    try { cache.set(e.path, { size: e.size, mtime: e.mtime, text: await e.file.text() }); touched.push(e.path); } catch (err) { if (err.name === 'NotAllowedError' || err.name === 'ServerDownError') throw err; }
  }));
  for (const path of [...cache.keys()]) if (!seen.has(path)) { cache.delete(path); touched.push(path); }
  listing = next;
  return touched;
}

async function refreshOnce(want) {
  const src = source;
  const wasDown = serverDown;
  try {
    const [files, issues, , gitChanged] = await Promise.all([
      want.has('files') || !listing ? readFiles() : [],
      want.has('issues') ? refreshIssues() : [],
      want.has('map') ? refreshMap() : null,
      want.has('git') ? refreshGit() : false,
    ]);
    if (src !== source) return;
    const touched = [...files, ...issues];
    const shape = listing.trackerPath + '|' + listing.adrPath + '|' + listing.others.length + '|' + (mapState.ids ? mapState.key : '-');
    const first = !model;
    let changed = 0;
    if (first || touched.length || shape !== source.shape) {
      source.shape = shape;
      const next = readTickets({
        name: source.name,
        files: { entries: cache, others: listing.others, trackerPath: listing.trackerPath, adrPath: listing.adrPath },
        github: issueState.repo ? { repo: issueState.repo, issues: issueState.issues } : null,
        mapIds: mapState.ids,
      });
      if (!first && touched.length) {
        const now = Date.now();
        const items = touched.map((path) => ({ path, ...describeChange(path, model.byPath.get(path), next.byPath.get(path)) }));
        changeLog.unshift({ at: new Date(), items });
        changeLog = changeLog.slice(0, 40);
        for (const path of touched) recent.set(path, now);
        changed = items.length;
        setTimeout(() => { if (model) renderView(); }, FRESH_MS + 500);
      }
      model = next;
      renderAll();
    } else if (gitChanged && model) { renderTabs(); if (state.view === 'git') renderView(); }
    lastChecked = new Date();
    lostAccess = false;
    serverDown = false;
    if (wasDown) renderNotices();
    if (changed) toast(ui('toast.changed', { n: changed, time: clock(lastChecked) }), 'ok');
    else if (announce) toast(ui('toast.same', { time: clock(lastChecked) }), 'info');
  } catch (err) {
    // The server stopped: keep what was read, keep asking; it may come back.
    if (err && err.name === 'ServerDownError') serverDown = true;
    else if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')) lostAccess = true;
    else if (err && err.name === 'NotFoundError') source.roots = null;
    else console.error(err);
    if (!model) showStart(ui('error.read', { error: err && err.message ? err.message : err }));
    else renderNotices();
  } finally {
    announce = false;
  }
}

// The project's GitHub issues, which the server fetches (the page never talks to GitHub);
// the paths of the tickets that changed. The server is told what the page has, and answers
// "unchanged" while the issues are the same.
async function refreshIssues() {
  if (!source || !source.server || !source.github) return [];
  const known = issueState.fingerprint ? '?known=' + encodeURIComponent(issueState.fingerprint) : '';
  let data;
  try { data = await serverJson('/issues' + known); } catch (err) { if (err.name === 'ServerDownError') throw err; return []; }
  if (data.unchanged) return [];
  const issues = data.available ? data.issues : [];
  const repo = data.available ? data.repo : null;
  const next = new Map(issues.map((i) => [i.number, JSON.stringify(i)]));
  const touched = [];
  const path = (r, n) => r + '#' + n;
  for (const [n, json] of next) if (issueState.byNumber.get(n) !== json) touched.push(path(repo, n));
  for (const n of issueState.byNumber.keys()) if (!next.has(n)) touched.push(path(issueState.repo, n));
  issueState = { fingerprint: data.fingerprint || '', repo, issues, byNumber: next };
  return touched;
}

// The ids of Plan's map (docs/product/mindmap.json), which the reader checks the tickets'
// PRD lines against. On the server Plan sends only the ids (GET /api/plan/ids, "same" while
// unchanged); from a picked folder the file is read when its size or time changed. No map (none
// in the project, Plan not running, an unreadable file): ids null, and no PRD id counts as unknown.
const MAP_PATH = 'docs/product/mindmap.json';
let mapState = { key: '', ids: null };

async function refreshMap() {
  if (!source) return;
  try {
    if (source.server) {
      const known = mapState.key ? '?v=' + encodeURIComponent(mapState.key) : '';
      const res = await fetch('/api/plan/ids' + known, { cache: 'no-store' });
      const data = res.ok ? await res.json() : null;
      if (data && data.same) return;
      const ids = data && Array.isArray(data.ids) ? data.ids.map(String) : null;
      mapState = { key: ids && data.v ? String(data.v) : '', ids };
      return;
    }
    const A = source.adapter;
    const dir = await findChild(A, source.root, MAP_PATH.split('/').slice(0, -1).join('/'));
    const hit = dir && (await A.children(dir)).find((c) => !c.isDir && c.name === MAP_PATH.split('/').pop());
    if (!hit) { mapState = { key: '', ids: null }; return; }
    const f = await A.file(hit.node);
    const key = f.size + '@' + f.lastModified;
    if (key === mapState.key) return;
    mapState = { key, ids: GroundworkTickets.mapIds(JSON.parse(await f.text())) };
  } catch (err) {
    if (err && (err.name === 'NotAllowedError' || err.name === 'NotFoundError')) throw err;
    mapState = { key: '', ids: null };   // a map caught mid-write, or no Plan: try again next round
  }
}

// The launcher's git history; true when it changed. The server is told what
// the page has, and answers "unchanged" while no ref moved.
async function refreshGit() {
  if (!source || !source.server || !source.git) return false;
  const known = gitState.data && gitState.data.limit === gitState.limit ? '&known=' + gitState.data.fingerprint : '';
  let data;
  try { data = await serverJson('/git?limit=' + gitState.limit + known); } catch (err) { return false; }
  if (data.unchanged) return false;
  if (!data.available) {
    const error = data.error || NO_REPO;
    const changed = gitState.data !== null || gitState.error !== error;
    gitState.data = null;
    gitState.error = error;
    return changed;
  }
  gitState.data = data;
  gitState.error = '';
  return true;
}

// How the page follows the project. From the core server: its live updates (subscribe from
// /shell/live.mjs: the shell's one stream inside the shell, the page's own when opened alone) say
// what changed, and the page reads that again; every (re)connect reads everything, so nothing
// missed meanwhile is lost. A folder chosen in the browser (file://) is read every POLL_MS instead.
function startLive() {
  stopLive();
  if (!source || !source.live) return;
  if (source.server) {
    const token = liveToken;
    import('/shell/live.mjs').then(({ subscribe }) => {
      if (token !== liveToken) return;
      liveStop = subscribe({
        onHello: () => refresh(),
        onChange: (topics) => { const parts = partsOf(topics); if (parts.length) refresh(parts); },
        onState: (s) => {
          liveState = s;
          if (s === 'off' && !serverDown) { serverDown = true; renderNotices(); }
          renderLive();
        },
      });
    }).catch((err) => console.error(err));
    return;
  }
  timer = setInterval(() => { if (!document.hidden) refresh(); }, POLL_MS);
}

function stopLive() {
  liveToken++;
  clearInterval(timer);
  timer = null;
  if (liveStop) { liveStop(); liveStop = null; }
}

async function start(src) {
  stopLive();
  source = src;
  cache = new Map();
  listing = null;
  model = null;
  changeLog = [];
  recent = new Map();
  lostAccess = false;
  serverDown = false;
  gitState = { data: null, error: '', limit: GIT_PAGE, open: new Set(), hit: '' };
  issueState = NO_ISSUES();
  mapState = { key: '', ids: null };
  $('start-error').hidden = true;
  await refresh();
  if (model) startLive();
}

function showStart(error) {
  stopLive();
  source = null;
  model = null;
  $('app').hidden = true;
  $('live').hidden = true;
  $('start').hidden = false;
  renderBrand();
  document.title = ui('page.title');
  closeDrawerNow();
  if (error) { $('start-error').textContent = error; $('start-error').hidden = false; }
}

// ───────────────────────── Filtering ─────────────────────────

// Is filter f (q, status, area, closed) in force on the current view?
const applies = (f) => (FILTERS[state.view] || []).includes(f);

function matches(t, ignoreClosed) {
  if (state.prd && !t.prd.includes(state.prd)) return false;
  if (state.area && t.area !== state.area) return false;
  if (state.status && applies('status') && t.status !== state.status) return false;
  if (state.q && !t.hay.includes(fold(state.q.trim()))) return false;
  if (!ignoreClosed && !state.showClosed && !state.status && !state.prd && isClosed(t)) return false;
  return true;
}
const visibleTickets = () => model.tickets.filter((t) => matches(t, false));

// ───────────────────────── Rendering ─────────────────────────

const docHref = (path) => '#/' + state.view + '/' + encodeURIComponent(path);
function ticketLink(t, text) {
  return `<a class="gw-tag tref${isClosed(t) ? ' is-closed' : ''}" href="${docHref(t.path)}" data-doc="${esc(t.path)}" title="${esc(t.title + ' · ' + statusName(t.status))}">${esc(text || t.label)}</a>`;
}
const blockerLinks = (t) => t.blockers.map((b) => (b.ticket ? ticketLink(b.ticket) : `<span class="gw-tag tref is-missing" title="${esc(ui('table.no-such-ticket'))}">${esc(b.raw)}?</span>`)).join(' ');
// The PRD items a ticket came from (its "**PRD:**" line): each opens Plan focused on that map
// node (Plan's deep link, planLink in ticket-reader.js, in the whole window). Opened as a file
// (file://) there is no Plan to open: the ids show as text.
const prdLinks = (t) => t.prd.map((id) => (source && source.server
  ? `<a class="gw-tag" href="${esc(planLink(id))}" target="_top" title="${esc(ui('prd.open', { id }))}">${esc(id)}</a>`
  : `<span class="gw-tag" title="${esc(ui('prd.no-plan'))}">${esc(id)}</span>`)).join(' ');
const meter = (c) => (c.total ? `<span class="meter" title="${esc(ui('table.meter', { done: c.done, total: c.total }))}"><span class="gw-progress" style="--value:${pct(c.done, c.total)}%"></span>${c.done}/${c.total}</span>` : '<span class="dash">–</span>');
const dateText = (iso) => {
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  return isNaN(d) ? iso : d.toLocaleDateString(i18n.lang, { month: 'short', day: 'numeric' });
};

// Blocked by an open ticket, or freed: every blocker it names is closed.
const isFree = (t) => !isClosed(t) && !t.blocked && t.blockers.length > 0 && t.blockers.every((b) => b.ticket);
const flags = (t) => (t.blocked ? ' ' + badge('bad', ui('flag.blocked')) : isFree(t) ? ' ' + badge('ok', ui('flag.free'), ui('flag.free-title')) : '');

function ticketRow(t) {
  const fresh = recent.has(t.path) && Date.now() - recent.get(t.path) < FRESH_MS;
  const blockers = blockerLinks(t);
  const sub = [chip(t.status), t.area ? `<span>${esc(t.area)}</span>` : '', t.blockers.length ? `<span>${ui('table.blocked-by-sub', { list: blockers })}</span>` : ''].filter(Boolean).join('');
  return `<tr data-doc="${esc(t.path)}"${t.blocked ? ' class="is-blocked"' : ''}>
<td class="c-num">${esc(t.label)}</td>
<td class="c-title"><a class="open" href="${docHref(t.path)}" data-doc="${esc(t.path)}">${esc(t.title)}</a>${flags(t)}${fresh ? ' ' + badge('info', ui('flag.fresh')) : ''}
${t.statusNote ? `<div class="note" title="${esc(t.statusNote)}">${esc(t.statusNote)}</div>` : ''}${t.prd.length ? `<div class="refs-line"><span>${ui('table.prd-sub')}</span>${prdLinks(t)}</div>` : ''}<div class="sub">${sub}</div></td>
<td class="c-area">${t.area ? esc(t.area) : '<span class="dash">–</span>'}</td>
<td class="c-st">${chip(t.status)}</td>
<td class="c-chk">${meter(t.checks)}</td>
<td class="c-blk">${blockers || '<span class="dash">–</span>'}</td>
<td class="c-last">${t.lastComment ? esc(dateText(t.lastComment)) : '<span class="dash">–</span>'}</td>
</tr>`;
}

function ticketTable(list) {
  if (!list.length) return empty('inbox', ui('table.empty'), '');
  return `<div class="gw-card tablewrap"><table class="grid"><thead><tr><th class="c-num">${ui('table.num')}</th><th>${ui('table.ticket')}</th><th class="c-area">${ui('table.area')}</th><th class="c-st">${ui('table.status')}</th><th class="c-chk">${ui('table.checks')}</th><th class="c-blk">${ui('table.blocked-by')}</th><th class="c-last">${ui('table.last-comment')}</th></tr></thead><tbody>${list.map(ticketRow).join('')}</tbody></table></div>`;
}

function renderBrand() {
  const name = model ? model.projectName || ui('page.project') : '';
  $('project').innerHTML = name ? `<span>${esc(name)}</span><small>${ui('page.subtitle')}</small>` : `<span>${esc(ui('page.title'))}</span>`;
}

// The page's own bar, only when it runs without the shell: whether it is live, and the version.
function renderLive() {
  if (!source || IN_SHELL) return;
  $('live').hidden = false;
  $('change').hidden = !!source.server;
  const at = lastChecked ? clock(lastChecked) : '–';
  let tone, text;
  if (serverDown || (source.server && liveState === 'off')) { tone = 'warn'; text = ui('live.down-short'); }
  else if (lostAccess) { tone = 'warn'; text = ui('live.lost-short'); }
  else if (source.server) { tone = liveState === 'on' ? 'ok' : 'neutral'; text = ui(liveState === 'on' ? 'live.on' : 'live.connecting'); }
  else if (source.live) { tone = 'ok'; text = ui('live.polling', { sec: POLL_MS / 1000 }); }
  else { tone = 'neutral'; text = ui('live.snapshot'); }
  $('dot').className = 'gw-dot gw-dot--' + tone + (tone === 'ok' ? ' gw-dot--pulse' : '');
  $('live-text').innerHTML = `${esc(text)} <span class="when">· ${esc(ui('live.read', { at }))}</span>`;
  const version = source.server ? source.version : '';
  $('ver').textContent = version ? `v${version}` : '';
  $('ver').hidden = !version;
  $('ver').title = version ? `Groundwork ${version}` : '';
}

// Notices above the overview: what the page cannot do right now, and why.
function renderNotices() {
  if (!model) return;
  const callout = (tone, body, action) => `<div class="gw-callout gw-callout--${tone}" role="status"><div class="gw-callout__body">${body}</div>${action || ''}</div>`;
  const out = [];
  const at = lastChecked ? clock(lastChecked) : '–';
  if (serverDown && !IN_SHELL) out.push(callout('warn', ui('live.down', { at, launcher: source && source.launcher ? ' (' + esc(source.launcher) + ')' : '' })));
  if (lostAccess) out.push(callout('warn', ui('live.lost'), `<button type="button" class="gw-btn gw-btn--sm" data-act="renew">${ui('live.renew')}</button>`));
  if (model.trackerPath == null && !model.repo) out.push(callout('info', ui('overview.no-tracker', { dir: esc(DEFAULT_TRACKER_DIR) }) + (source && source.live ? '' : ' ' + ui('overview.no-tracker-snapshot', { dir: esc(DEFAULT_TRACKER_DIR) }))));
  $('notices').innerHTML = out.join('');
  $('notices').hidden = !out.length;
}

// The overview: four numbers and the progress under them, on the "Waiting on" view; the change
// log only once something changed.
function renderOverview() {
  const m = model;
  const box = $('overview');
  if (state.view !== 'waiting') { box.innerHTML = ''; box.hidden = true; return; }
  box.hidden = false;
  const total = m.tickets.length, open = m.open.length, done = total - open;
  const inGroup = (id) => m.open.filter((t) => GROUPS.find((g) => g.id === id).has(t.status));
  const agentAll = inGroup('agent');
  const agentFree = agentAll.filter((t) => !t.blocked).length;
  const human = inGroup('human').length;
  const blocked = m.open.filter((t) => t.blocked).length;
  const tile = (tone, value, label, sub, good, href) => {
    const tag = href ? 'a' : 'div';
    return `<${tag} class="tile${value === 0 ? ' is-zero' : ''}${good ? ' is-good' : ''}"${href ? ` href="#/waiting" data-jump="${href}"` : ''}><span class="tile__label"><span class="gw-dot gw-dot--${tone}"></span>${label}</span><span class="tile__value">${value}</span><span class="tile__sub">${sub}</span></${tag}>`;
  };
  const none = `${ui('kpi.none')}`;
  const tiles = [
    tile('neutral', open, ui('kpi.open'), ui('kpi.open-sub', { total })),
    tile('accent', agentFree, ui('kpi.agent'), agentAll.length > agentFree ? ui('kpi.agent-sub-blocked', { n: agentAll.length - agentFree }) : agentFree ? ui('kpi.agent-sub') : '', false, agentFree ? 'group-agent' : ''),
    tile('warn', human, ui('kpi.human'), human ? ui('kpi.human-sub') : none, !human, human ? 'group-human' : ''),
    tile('bad', blocked, ui('kpi.blocked'), blocked ? ui('kpi.blocked-sub') : none, !blocked),
  ].join('');
  const p = pct(done, total);
  const foot = `<div class="summary__foot"><span class="gw-progress" style="--value:${p}%" role="img" aria-label="${esc(ui('overview.bar-label', { open, done }))}"></span><span class="summary__pct">${total ? ui('overview.done', { p }) : '–'}<span>${ui('overview.closed', { done, total })}</span></span><button type="button" class="gw-btn gw-btn--icon gw-btn--sm" data-act="refresh" title="${esc(ui(refreshKey()))}" aria-label="${esc(ui(refreshKey()))}">${icon('refresh')}</button></div>`;

  let changes = '';
  if (changeLog.length) {
    const item = (it) => `<li>${m.byPath.has(it.path) ? `<a href="${docHref(it.path)}" data-doc="${esc(it.path)}"><b>${esc(it.label)}</b></a>` : `<b>${esc(it.label)}</b>`}: ${esc(it.text())}</li>`;
    const [latest, ...older] = changeLog;
    changes = `<details class="changes" data-key="changes"${openDetails.has('changes') ? ' open' : ''}><summary><span class="gw-dot gw-dot--info"></span><span class="txt">${ui('overview.latest-change', { time: clock(latest.at) })} ${latest.items.slice(0, 3).map((it) => `<b>${esc(it.label)}</b> ${esc(it.text())}`).join('; ')}${latest.items.length > 3 ? ui('overview.and-more', { n: latest.items.length - 3 }) : ''}</span></summary>
<ul>${latest.items.map(item).join('')}</ul>${older.map((b) => `<div class="older">${clock(b.at)}</div><ul>${b.items.map(item).join('')}</ul>`).join('')}</details>`;
  }
  box.innerHTML = `<section class="gw-card summary" aria-label="${esc(ui('overview.label'))}"><div class="tiles">${tiles}</div>${total ? foot : ''}</section>${changes}`;
