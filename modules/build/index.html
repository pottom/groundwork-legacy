}
// The refresh button's words: from the server or a live folder it reads again; a snapshot
// asks for the folder again.
const refreshKey = () => (source && !source.live ? 'live.reread' : lostAccess ? 'live.renew' : 'live.refresh');

function renderTabs() {
  const real = model.problems.filter((p) => !INFO_KINDS.has(p.kind)).length;
  const branches = gitState.data ? gitState.data.refs.filter((r) => r.kind !== 'tag').length : 0;
  $('tabs').innerHTML = VIEWS.map(([id, label]) => {
    let b = '';
    if (id === 'waiting') b = count(model.open.length);
    if (id === 'git' && gitState.data) b = count(branches);
    if (id === 'checks' && real) b = `<span class="gw-badge gw-badge--warn" title="${esc(ui('checks.real', { n: real }))}">${real}</span>`;
    else if (id === 'checks' && model.problems.length) b = count(model.problems.length);
    return `<a href="#/${id}"${state.view === id ? ' aria-current="page"' : ''}>${ui(label)}${b}</a>`;
  }).join('');
  // On a narrow screen the tabs scroll sideways: keep the current one in sight.
  const nav = $('tabs'), cur = nav.querySelector('[aria-current]');
  if (cur && (cur.offsetLeft < nav.scrollLeft || cur.offsetLeft + cur.offsetWidth > nav.scrollLeft + nav.clientWidth)) nav.scrollLeft = cur.offsetLeft - 16;
}

function renderFilters() {
  const m = model;
  if (state.status && !m.statusCounts.has(state.status)) state.status = '';
  if (state.area && !m.areas.has(state.area)) state.area = '';
  const statuses = [...m.statusCounts.keys()].sort((a, b) => CLOSED.has(a) - CLOSED.has(b) || statusName(a).localeCompare(statusName(b), i18n.lang));
  $('f-status').innerHTML = `<option value="">${ui('filter.all-statuses')}</option>` + statuses.map((s) => `<option value="${esc(s)}"${s === state.status ? ' selected' : ''}>${esc(statusName(s))} (${m.statusCounts.get(s)})</option>`).join('');
  const areas = [...m.areas.values()].filter((a) => a.name).sort((a, b) => a.name.localeCompare(b.name));
  $('f-area').innerHTML = `<option value="">${ui('filter.all-areas')}</option>` + areas.map((a) => `<option value="${esc(a.name)}"${a.name === state.area ? ' selected' : ''}>${esc(a.name)} (${a.open}/${a.tickets.length})</option>`).join('');
  $('f-area').hidden = !areas.length;
  $('f-closed').checked = state.showClosed;
  if ($('q').value !== state.q) $('q').value = state.q;
  const fs = FILTERS[state.view] || [];
  $('filters').hidden = !fs.length;
  for (const el of $('filters').querySelectorAll('[data-f]')) el.hidden = !fs.includes(el.dataset.f) || (el.dataset.f === 'area' && !areas.length);
  $('f-toggle').hidden = !fs.some((f) => f !== 'q');
}

// Under the filters: the ones in force, each with its ✕, and how many tickets they hide.
function renderSummary() {
  const pills = [];
  const pill = (label, value, act) => `<span class="pill">${label} <b>${value}</b><button type="button" data-act="${act}" title="${esc(ui('filter.remove'))}" aria-label="${esc(ui('filter.remove-label', { what: label }))}">${icon('x')}</button></span>`;
  if (state.prd) pills.push(pill(ui('filter.prd'), esc(state.prd), 'clear-prd'));
  if (state.q.trim() && applies('q')) pills.push(pill(ui('filter.search-pill'), '“' + esc(state.q.trim()) + '”', 'clear-q'));
  if (state.status && applies('status')) pills.push(pill(ui('filter.status'), esc(statusName(state.status)), 'clear-status'));
  if (state.area && applies('area')) pills.push(pill(ui('filter.area'), esc(state.area), 'clear-area'));
  if (state.showClosed && applies('closed')) pills.push(pill(ui('filter.closed-pill'), ui('filter.shown-yes'), 'clear-closed'));
  $('f-active').innerHTML = pills.length ? `<span>${ui('filter.active')}</span>${pills.join('')}${pills.length > 1 ? `<button type="button" class="link" data-act="clear">${ui('filter.clear')}</button>` : ''}` : '';
  $('f-active').hidden = !pills.length;
  const n = pills.length - (state.prd ? 1 : 0) - (state.q.trim() && applies('q') ? 1 : 0);
  $('f-count').textContent = n;
  $('f-count').hidden = !n;
  if (!applies('closed')) { $('f-summary').innerHTML = ''; return; }
  const shown = visibleTickets().length;
  const hidden = model.tickets.filter((t) => matches(t, true)).length - shown;
  $('f-summary').innerHTML = ui('filter.shown', { n: shown }) + (hidden ? ` · ${ui('filter.hidden', { n: hidden })} <button type="button" data-act="show-closed">${ui('filter.show')}</button>` : '');
}

const VIEW_RENDERERS = {
  waiting() {
    const list = visibleTickets();
    const used = new Set();
    // A group with nothing in it is one quiet line; with a status filter on, only what it lets through shows.
    const section = (id, title, hint, items, always) => {
      items.forEach((t) => used.add(t));
      if (!items.length && !(always && !state.status && !state.q.trim())) return '';
      if (!items.length) return `<section class="group is-empty" id="group-${id}">${sectionHead(esc(title), count(0), `<span class="none-yet">${icon('check')}${ui('group.none')}</span>`)}</section>`;
      items = [...items].sort((a, b) => a.blocked - b.blocked);
      const blocked = items.filter((t) => t.blocked).length;
      return `<section class="group" id="group-${id}">${sectionHead(esc(title), count(items.length) + (blocked ? badge('bad', ui('flag.blocked-n', { n: blocked })) : ''), esc(hint))}${ticketTable(items)}</section>`;
    };
    let html = GROUPS.map((g) => section(g.id, ui(g.title), ui(g.hint), list.filter((t) => g.has(t.status)), g.id === 'agent' || g.id === 'human')).join('');
    const rest = list.filter((t) => !used.has(t) && !isClosed(t) && t.status !== UNPARSED);
    for (const s of [...new Set(rest.map((t) => t.status))].sort()) html += section('s-' + s, statusName(s), ui('group.unknown.hint'), rest.filter((t) => t.status === s));
    html += section('unparsed', ui('group.unparsed'), ui('group.unparsed.hint'), list.filter((t) => t.status === UNPARSED));
    html += section('closed', ui('group.closed'), ui('group.closed.hint'), list.filter(isClosed));
    return html || empty('inbox', ui('table.empty'), ui('filter.nothing'));
  },

  areas() {
    const q = fold(state.q.trim());
    const anySpec = model.areaList.some((a) => a.spec);
    const rows = model.areaList.filter((a) => (!state.area || a.name === state.area)).map((a) => {
      const tickets = a.tickets.filter((t) => matches(t, false));
      if ((q || state.status) && !tickets.length && !(q && !state.status && fold(a.name + ' ' + (a.spec ? a.spec.title : '')).includes(q))) return '';
      const key = 'area:' + a.name;
      const specBadge = badge('neutral', ui('area.spec'));
      const docs = a.docs.map((d) => `<li>${badge('neutral', esc(d.rel.split('/').length > 1 ? d.rel.split('/')[0] : ui('area.doc')))}<a href="${docHref(d.path)}" data-doc="${esc(d.path)}">${esc(d.title)}</a><span class="path">${esc(d.rel)}</span></li>`).join('');
      return `<details class="area gw-card${anySpec ? '' : ' no-specs'}" data-key="${esc(key)}"${openDetails.has(key) ? ' open' : ''}>
<summary><span class="area__name">${esc(a.name || ui('area.root'))}</span>
${anySpec ? `<span class="area__spec">${a.spec ? specBadge + esc(a.spec.title) : `<span class="muted">${ui('area.no-spec')}</span>`}</span>` : ''}
<span class="gw-progress" style="--value:${pct(a.closed, a.tickets.length)}%" title="${esc(ui('area.bar-title', { closed: a.closed, total: a.tickets.length }))}"></span>
<span class="area__cnt">${a.tickets.length ? ui('area.count', { open: `<b>${a.open}</b>`, closed: a.closed }) : ui('area.no-tickets')}</span></summary>
<div class="inner">${a.spec || docs || a.extras ? `<ul class="doclist">
${a.spec ? `<li>${specBadge}<a href="${docHref(a.spec.path)}" data-doc="${esc(a.spec.path)}">${esc(a.spec.title)}</a><span class="path">${esc(a.spec.rel)}</span></li>` : ''}
${docs}${a.extras ? `<li class="muted">${badge('neutral', ui('area.other'))}${ui('area.extras', { n: a.extras })}</li>` : ''}</ul>` : '<div style="height:12px"></div>'}
${a.tickets.length ? ticketTable(tickets) : ''}${tickets.length < a.tickets.length ? `<p class="muted">${ui('area.hidden', { n: a.tickets.length - tickets.length })}</p>` : ''}</div></details>`;
    }).join('');
    return `<p class="lead">${ui('area.lead')}</p>${rows || empty('inbox', ui('area.empty'), '')}`;
  },

  deps() {
    const visible = new Set(visibleTickets());
    // The closed blockers of the visible tickets stay in the picture, dimmed:
    // they show what has already been unlocked.
    const nodes = new Set(visible);
    for (const t of visible) for (const b of t.blockers) if (b.ticket && !visible.has(b.ticket) && matches(b.ticket, true)) nodes.add(b.ticket);
    const children = (t) => t.dependents.filter((d) => nodes.has(d));
    const parents = (t) => t.blockers.map((b) => b.ticket).filter((b) => b && nodes.has(b));
    const linked = [...nodes].filter((t) => children(t).length || parents(t).length);
    const placed = new Set();
    const node = (t, path, top) => {
      placed.add(t);
      const loop = path.includes(t);
      const kids = loop ? [] : children(t);
      const others = parents(t).filter((p) => p !== path[path.length - 1]);
      const ctx = !visible.has(t);
      return `<li${top ? ' class="gw-card"' : ''}><div class="node${ctx ? ' ctx' : ''}">${ticketLink(t)} <a class="ttl" href="${docHref(t.path)}" data-doc="${esc(t.path)}">${esc(t.title)}</a> ${chip(t.status)}${flags(t)}${loop ? ' ' + badge('bad', ui('deps.loop')) : ''}${path.length && others.length ? `<span class="rel">${ui('deps.also-waits', { list: others.map((p) => ticketLink(p)).join(' ') })}</span>` : ''}</div>${kids.length ? `<span class="unlocks">${ui('deps.unlocks')}</span><ul>${kids.map((k) => node(k, [...path, t])).join('')}</ul>` : ''}</li>`;
    };
    let html = '';
    for (const t of linked) if (!parents(t).length) html += node(t, [], true);
    for (const t of linked) if (!placed.has(t)) html += node(t, [], true);
    const waiting = linked.filter((t) => visible.has(t) && t.blocked).length;
    const free = linked.filter((t) => visible.has(t) && isFree(t)).length;
    const legend = html ? `<div class="legend"><span>${badge('bad', ui('flag.blocked'))} ${ui('deps.legend-blocked')}</span><span>${badge('ok', ui('flag.free'))} ${ui('deps.legend-free')}</span><span>${ui('deps.legend-dim')}</span></div>` : '';
    return `<p class="lead">${ui('deps.lead')} ${state.showClosed || state.status ? '' : ui('deps.lead-closed') + ' '}${waiting ? ui('deps.waiting', { n: waiting }) : ui('deps.none-waiting')}${free ? ' ' + ui('deps.free', { n: free }) : ''}</p>${legend}${html ? `<ul class="tree">${html}</ul>` : empty('branch', ui('deps.empty'), '')}`;
  },

  // The dated comments, by day. A GitHub issue's opening and closing are not comments: hidden
  // unless asked for, and then one line per ticket and day ("Opened and closed on GitHub").
  activity() {
    const q = fold(state.q.trim());
    const ok = (t) => (!state.area || t.area === state.area) && (!q || t.hay.includes(q)) && (!state.prd || t.prd.includes(state.prd));
    const days = new Map();
    const mine = model.comments.filter((c) => ok(c.ticket));
    const events = mine.filter((c) => c.event).length;
    // Until asked, the events show only where there is nothing else to show.
    const showEvents = state.githubEvents == null ? events === mine.length : state.githubEvents;
    for (const c of mine) {
      if (c.event && !showEvents) continue;
      if (!days.has(c.date)) days.set(c.date, new Map());
      const byTicket = days.get(c.date);
      if (!byTicket.has(c.ticket)) byTicket.set(c.ticket, []);
      byTicket.get(c.ticket).push(c);
    }
    const notes = (list) => {
      const real = list.filter((c) => !c.event);
      const ev = list.filter((c) => c.event).map((c) => c.event);
      const evLine = ev.length ? `<div class="event">${ui(ev.includes('opened') && ev.includes('closed') ? 'activity.opened-closed' : ev.includes('closed') ? 'activity.closed' : 'activity.opened')}</div>` : '';
      return real.map((c) => `<div>${esc(commentTitle(c))}</div>`).join('') + evLine;
    };
    const all = [...days.entries()];
    const html = all.slice(0, state.activityDays).map(([date, byTicket]) => `<section class="day"><div class="day__head"><h3>${esc(dateText(date))}</h3><span>${ui('activity.tickets', { n: byTicket.size })}</span></div><ul class="gw-card">${[...byTicket.entries()].map(([t, list]) => `<li><div class="node">${ticketLink(t)} <a class="ttl" href="${docHref(t.path)}" data-doc="${esc(t.path)}">${esc(t.title)}</a> ${chip(t.status)}${t.area ? ` <span class="rel">${esc(t.area)}</span>` : ''}</div><div class="notes">${notes(list)}</div></li>`).join('')}</ul></section>`).join('');
    const toggle = events ? `<div class="view-actions"><button type="button" class="gw-btn gw-btn--sm" data-act="github-events" aria-pressed="${showEvents}">${ui('activity.github-events', { n: events })}</button></div>` : '';
    return `<p class="lead">${ui('activity.lead')}</p>${toggle}${html || empty('inbox', ui('activity.empty'), events && !showEvents ? ui('activity.empty-events', { n: events }) : '')}${all.length > state.activityDays ? `<button type="button" class="gw-btn" data-act="more-days">${ui('activity.more', { n: all.length - state.activityDays })}</button>` : ''}`;
  },

  checks() {
    const q = fold(state.q.trim());
    const list = model.problems.filter((p) => p.tickets.some((t) => (!state.area || t.area === state.area) && (!q || t.hay.includes(q))));
    const html = PROBLEM_KINDS.map(([kind, title, info]) => {
      const items = list.filter((p) => p.kind === kind);
      if (!items.length) return '';
      const openOnes = items.filter((p) => p.tickets.some((t) => !isClosed(t))).length;
      return `<section class="group${info ? ' info' : ''}">${sectionHead(ui(title), count(items.length) + (info ? badge('info', ui('checks.info')) : ''), ui('checks.affects', { n: openOnes }))}<div class="gw-card tablewrap"><table class="grid"><thead><tr><th>${ui('table.ticket')}</th><th class="c-st">${ui('table.status')}</th><th>${ui('checks.problem')}</th></tr></thead><tbody>${items.map((p) => `<tr><td class="c-title">${p.tickets.map((t) => `${ticketLink(t)} <a class="open" href="${docHref(t.path)}" data-doc="${esc(t.path)}">${esc(t.title)}</a><div class="note">${esc(t.path)}</div>`).join('')}</td><td class="c-st">${p.tickets.map((t) => chip(t.status)).join('<br>')}</td><td>${esc(ui(p.key, p.params))}</td></tr>`).join('')}</tbody></table></div></section>`;
    }).join('');
    return `<p class="lead">${ui('checks.lead')}</p>${html || empty('check', ui('checks.empty'), '')}`;
  },

  git: renderGitView,

  // Only the kinds of document the project has; one line at the end names the missing ones.
  docs() {
    const q = fold(state.q.trim());
    const ok = (d) => (!state.area || d.area === state.area) && (!q || d.hay.includes(q));
    const link = (d) => `<a class="open" href="${docHref(d.path)}" data-doc="${esc(d.path)}">${esc(d.title)}</a>`;
    const table = (head, rows) => `<div class="gw-card tablewrap"><table class="grid"><thead><tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
    const specs = model.docs.filter((d) => d.kind === 'spec' && ok(d));
    const other = model.docs.filter((d) => d.kind === 'doc' && ok(d));
    const adrs = state.area ? [] : model.adrs.filter((d) => !q || d.hay.includes(q));
    const row = (d) => `<tr data-doc="${esc(d.path)}"><td class="c-area">${esc(d.area || '–')}</td><td class="c-title">${link(d)}<div class="note mono">${esc(d.path)}</div></td></tr>`;
    const own = state.area ? [] : [model.readme, ...model.glossaries].filter((d) => d && (!q || d.hay.includes(q)));
    const parts = [];
    if (own.length) parts.push(`<section class="group">${sectionHead(ui('docs.own'), count(own.length), ui('docs.own.hint'))}${table([ui('docs.title'), ui('docs.file')], own.map((d) => `<tr data-doc="${esc(d.path)}"><td class="c-title">${link(d)}</td><td>${badge('neutral', ui(d.kind === 'readme' ? 'docs.readme' : 'docs.glossary'))} <span class="mono muted">${esc(d.path)}</span></td></tr>`))}</section>`);
    if (specs.length) parts.push(`<section class="group">${sectionHead(ui('docs.specs'), count(specs.length), '')}${table([ui('table.area'), ui('docs.spec')], specs.map(row))}</section>`);
    if (adrs.length) parts.push(`<section class="group">${sectionHead(ui('docs.adrs'), count(adrs.length), model.adrPath ? `<span class="mono">${esc(model.adrPath)}/</span>` : '')}${table([ui('table.num'), ui('docs.decision'), ui('docs.adr-status')], adrs.map((d) => `<tr data-doc="${esc(d.path)}"><td class="c-num">${esc(d.num || '–')}</td><td class="c-title">${link(d)}</td><td>${d.status ? esc(d.status) : '<span class="dash">–</span>'}</td></tr>`))}</section>`);
    if (other.length) parts.push(`<section class="group">${sectionHead(ui('docs.other'), count(other.length), ui('docs.other.hint'))}${table([ui('table.area'), ui('docs.document')], other.map(row))}</section>`);
    if (q || state.area) return parts.join('') || empty('doc', ui('docs.empty'), '');
    const missing = [!specs.length && ui('docs.missing-specs'), !adrs.length && ui('docs.missing-adrs')].filter(Boolean);
    return parts.join('') + (missing.length ? empty('doc', ui(missing.length === 2 ? 'docs.none-both' : 'docs.none-one', { what: missing[0] }), ui('docs.none-text')) : '');
  },
};

// ───────────────────────── Git branches ─────────────────────────

const shortHash = (h) => h.slice(0, 7);
const relTime = (sec) => {
  const d = Date.now() / 1000 - sec;
  if (d < 90) return ui('git.now');
  if (d < 3600) return ui('git.minutes', { n: Math.round(d / 60) });
  if (d < 86400) return ui('git.hours', { n: Math.round(d / 3600) });
  if (d < 86400 * 45) return ui('git.days', { n: Math.round(d / 86400) });
  return new Date(sec * 1000).toLocaleDateString(i18n.lang);
};
const fullTime = (sec) => new Date(sec * 1000).toLocaleString(i18n.lang);

// The branch a merge commit brought in, when its subject is git's own wording.
function mergedName(subject) {
  const m = /^Merge (?:remote-tracking )?branch '([^']+)'/.exec(subject) || /^Merge pull request #\d+ from \S+?\/(\S+)/.exec(subject) || /^Merge branch (\S+)/.exec(subject);
  return m ? m[1] : '';
}

// Lanes: each commit gets a column. A lane holds the commit it waits for next
// (the first parent of the one above); a merge opens or joins a lane for each
// further parent; lanes that wait for the same commit end in it (where a
// branch forked). The base branch keeps lane 0, so its line runs straight.
function layoutGit(g) {
  const index = new Map(g.commits.map((c, i) => [c.hash, i]));
  const base = g.refs.find((r) => r.kind === 'branch' && r.name === g.base);
  const lanes = [];
  let color = 1;
  // Held for the base until its tip comes; nothing is drawn in it before.
  if (base && index.has(base.hash)) lanes[0] = { hash: base.hash, color: 0, held: true };
  const free = () => { let k = 0; while (lanes[k]) k++; return k; };
  let width = 1;
  const rows = g.commits.map((c) => {
    const before = lanes.map((l) => (l ? { ...l } : null));
    let at = lanes.findIndex((l) => l && l.hash === c.hash);
    if (at < 0) { at = free(); lanes[at] = { hash: c.hash, color: color++ % GIT_COLORS }; }
    const own = lanes[at].color;
    const ends = [];
    lanes.forEach((l, k) => { if (l && k !== at && l.hash === c.hash) { ends.push({ k, color: l.color }); lanes[k] = null; } });
    const outs = [];
    if (c.parents.length) { lanes[at] = { hash: c.parents[0], color: own }; outs.push({ k: at, color: own }); } else lanes[at] = null;
    for (const p of c.parents.slice(1)) {
      let k = lanes.findIndex((l) => l && l.hash === p);
      if (k < 0) { k = free(); lanes[k] = { hash: p, color: color++ % GIT_COLORS }; }
      outs.push({ k, color: lanes[k].color });
    }
    while (lanes.length && !lanes[lanes.length - 1]) lanes.pop();
    width = Math.max(width, lanes.length, at + 1);
    // Lanes that only pass by this row.
    const through = [];
    before.forEach((l, k) => { if (l && !l.held && l.hash !== c.hash && lanes[k] && lanes[k].hash === l.hash) through.push({ k, color: l.color }); });
    return { c, at, color: own, ends, outs, through, start: !before[at] || before[at].hash !== c.hash || !!before[at].held };
  });
  return { rows, width };
}

function gitSvg(layout) {
  const x = (k) => 10 + k * GIT_LANE_W, H = GIT_ROW_H;
  const paths = [], dots = [];
  const curve = (x1, y1, x2, y2) => (x1 === x2 ? `M${x1} ${y1}V${y2}` : `M${x1} ${y1}C${x1} ${(y1 + y2) / 2} ${x2} ${(y1 + y2) / 2} ${x2} ${y2}`);
  layout.rows.forEach((r, i) => {
    const top = i * H, mid = top + H / 2, bottom = top + H, cx = x(r.at);
    for (const t of r.through) paths.push(`<path class="lane${t.color}" d="M${x(t.k)} ${top}V${bottom}" stroke="var(--c)"/>`);
    if (!r.start) paths.push(`<path class="lane${r.color}" d="M${cx} ${top}V${mid}" stroke="var(--c)"/>`);
    for (const e of r.ends) paths.push(`<path class="lane${e.color}" d="${curve(x(e.k), top, cx, mid)}" stroke="var(--c)"/>`);
    for (const o of r.outs) paths.push(`<path class="lane${o.color}" d="${curve(cx, mid, x(o.k), bottom)}" stroke="var(--c)"/>`);
    const merge = r.c.parents.length > 1;
    dots.push(`<circle class="lane${r.color}" cx="${cx}" cy="${mid}" r="${merge ? 3.5 : 4.5}" stroke="var(--c)" fill="${merge ? 'var(--gw-surface)' : 'var(--c)'}"/>`);
  });
  const w = x(layout.width) + 2;
  return { w, svg: `<svg width="${w}" height="${layout.rows.length * H}" aria-hidden="true">${paths.join('')}${dots.join('')}</svg>` };
}

function refPill(r, color, asButton) {
  const cls = `ref ${r.kind === 'tag' ? 'tag' : r.kind === 'remote' ? 'remote lane' + color : 'lane' + color}${r.head ? ' head' : ''}`;
  const title = ui(r.kind === 'tag' ? 'git.tag' : r.kind === 'remote' ? 'git.remote' : r.head ? 'git.head' : 'git.local');
  return asButton
    ? `<button type="button" class="${cls}" data-git-jump="${esc(r.hash)}" title="${esc(ui('git.jump', { what: title }))}">${esc(r.name)}</button>`
    : `<span class="${cls}" title="${esc(title)}">${esc(r.name)}</span>`;
}

function branchState(r, g) {
  if (r.kind === 'branch' && r.name === g.base) return badge('accent', ui('git.base'));
  if (r.ahead == null) return '<span class="dash">–</span>';
  // The base's own remote: not merged into it, only behind or ahead of it.
  const baseRef = g.refs.find((b) => b.kind === 'branch' && b.name === g.base);
  if (r.kind === 'remote' && baseRef && baseRef.upstream === r.name) {
    if (!r.ahead && !r.behind) return badge('ok', ui('git.same', { base: esc(g.base) }));
    return [r.behind ? badge('info', ui('git.not-pushed', { n: r.behind })) : '', r.ahead ? badge('info', ui('git.not-pulled', { n: r.ahead })) : ''].filter(Boolean).join(' ');
  }
  if (r.ahead === 0) return `${badge('ok', ui('git.merged', { base: esc(g.base) }))}${r.behind ? ` <span class="muted">${ui('git.behind-merged', { n: r.behind, base: esc(g.base) })}</span>` : ''}`;
  return `${badge('info', ui('git.ahead', { n: r.ahead, base: esc(g.base) }))}${r.behind ? ` <span class="muted">${ui('git.behind', { n: r.behind })}</span>` : ''}`;
}

function renderGitView() {
  if (!source || !source.server) return empty('branch', ui('git.no-server-title'), ui('git.no-server'));
  if (!source.git) return `<div class="gw-callout gw-callout--warn"><div class="gw-callout__body">${ui('git.old-server')}</div></div>`;
  const g = gitState.data;
  if (!g) {
    return gitState.error
      ? empty('branch', gitState.error === NO_REPO ? ui('git.no-repo') : ui('git.error', { error: esc(gitState.error) }), '')
      : empty('branch', ui('git.loading'), '');
  }
  const layout = layoutGit(g);
  const color = new Map(layout.rows.map((r) => [r.c.hash, r.color]));
  const refsAt = new Map();
  for (const r of g.refs) { if (!refsAt.has(r.hash)) refsAt.set(r.hash, []); refsAt.get(r.hash).push(r); }
  const order = { branch: 0, remote: 1, tag: 2 };
  for (const list of refsAt.values()) list.sort((a, b) => b.head - a.head || order[a.kind] - order[b.kind] || a.name.localeCompare(b.name));

  // The branches, local and remote, the newest first; the base on top. The tab counts the same.
  const branches = g.refs.filter((r) => r.kind !== 'tag').sort((a, b) => (b.name === g.base && b.kind === 'branch') - (a.name === g.base && a.kind === 'branch') || b.date - a.date);
  const local = branches.filter((r) => r.kind === 'branch').length;
  const baseUp = (g.refs.find((r) => r.kind === 'branch' && r.name === g.base) || {}).upstream;
  const merged = branches.filter((r) => r.ahead === 0 && !(r.kind === 'remote' && r.name === baseUp)).length;
  const merges = g.commits.filter((c) => c.parents.length > 1).length;
  const table = `<div class="gw-card tablewrap"><table class="grid"><thead><tr><th>${ui('git.branch')}</th><th>${ui('git.relation', { base: g.base ? esc(g.base) : ui('git.base-branch') })}</th><th class="c-last">${ui('git.last-commit')}</th></tr></thead><tbody>${branches.map((r) => `<tr><td class="c-branch">${refPill(r, color.get(r.hash) ?? 7, true)}${r.worktree && !r.head ? ' ' + badge('violet', ui('git.worktree'), ui('git.worktree-title')) : ''}${r.upstream ? `<span class="muted">→ ${esc(r.upstream)}</span>` : ''}</td><td>${branchState(r, g)}</td><td class="c-last" title="${esc(fullTime(r.date))}">${esc(relTime(r.date))}</td></tr>`).join('')}</tbody></table></div>`;

  const w = 10 + layout.width * GIT_LANE_W + 2;   // as gitSvg draws it
  const rows = layout.rows.map((r) => {
    const c = r.c, merge = c.parents.length > 1;
    const into = merge ? mergedName(c.subject) : '';
    const pills = (refsAt.get(c.hash) || []).map((ref) => refPill(ref, r.color, false)).join('');
    const open = gitState.open.has(c.hash);
    const detail = open ? `<div class="detail"><div class="mono">${esc(c.hash)}</div><div>${esc(c.subject)}</div><div class="muted">${esc(c.author)} · ${esc(fullTime(c.date))}${merge ? ' · ' + ui('git.merge-parents', { n: c.parents.length, list: c.parents.map((p) => `<span class="mono">${esc(shortHash(p))}</span>`).join(', ') }) : c.parents.length ? '' : ' · ' + ui('git.first')}${into ? ' · ' + ui('git.merged-branch', { name: `<b>${esc(into)}</b>` }) : ''}</div></div>` : '';
    return `<div class="row${merge ? ' merge' : ''}${gitState.hit === c.hash ? ' hit' : ''}" data-commit="${esc(c.hash)}" title="${esc(c.subject)}"><span class="h">${esc(shortHash(c.hash))}</span>${pills ? `<span class="refs">${pills}</span>` : ''}<span class="s">${esc(c.subject)}</span><span class="who">${esc(c.author)}</span><span class="when" title="${esc(fullTime(c.date))}">${esc(relTime(c.date))}</span></div>${detail}`;
  });
  // A detail line pushes the rows below it down: the graph is drawn per block.
  let html = '', block = [], blockRows = [];
  const flush = () => {
    if (!blockRows.length) return;
    const part = gitSvg({ rows: blockRows, width: layout.width });
    html += `<div class="block" style="position:relative;padding-left:${part.w}px">${part.svg}${block.join('')}</div>`;
    block = []; blockRows = [];
  };
  layout.rows.forEach((r, i) => {
    const opened = gitState.open.has(r.c.hash);
    const [line, detail] = opened ? [rows[i].slice(0, rows[i].indexOf('<div class="detail">')), rows[i].slice(rows[i].indexOf('<div class="detail">'))] : [rows[i], ''];
    block.push(line); blockRows.push(r);
    if (opened) { flush(); html += `<div style="padding-left:${w}px">${detail}</div>`; }
  });
  flush();
  const shown = g.commits.length;
  const tags = g.refs.filter((r) => r.kind === 'tag').length;
  const legend = `<span class="legend-refs">${ui('git.legend')} ${refPill({ kind: 'branch', name: ui('git.local'), hash: '' }, 0, false)} ${refPill({ kind: 'remote', name: ui('git.remote'), hash: '' }, 0, false)} ${refPill({ kind: 'tag', name: ui('git.tag'), hash: '' }, 0, false)} ${refPill({ kind: 'branch', name: ui('git.checked-out-branch'), hash: '', head: true }, 0, false)}</span>`;
  return `<p class="lead">${ui('git.lead')}</p>
<section class="group">${sectionHead(ui('git.branches'), count(branches.length), [ui('git.local-remote', { local, remote: branches.length - local }), ui('git.merged-n', { merged, base: esc(g.base) }), tags ? ui('git.tags', { n: tags }) : '', g.headBranch ? ui('git.checked-out', { name: esc(g.headBranch) }) : ui('git.detached')].filter(Boolean).join(' · '))}${table}</section>
<section class="group">${sectionHead(ui('git.graph'), count(shown), (shown < g.total ? ui('git.newest', { shown, total: g.total }) : ui('git.all')) + ' · ' + ui('git.merges', { n: merges }))}
<div class="gw-card graph" style="--row-h:${GIT_ROW_H}px"><div class="rows">${html}</div></div>
<div class="graph-foot">${shown < g.total ? `<button type="button" class="gw-btn" data-act="more-commits">${ui('git.more', { n: Math.min(GIT_PAGE, g.total - shown) })}</button>` : ''}${legend}</div></section>`;
}

function renderView() {
  if (!model) return;
  const y = window.scrollY;
  $('view').innerHTML = (VIEW_RENDERERS[state.view] || VIEW_RENDERERS.waiting)();
  renderSummary();
  window.scrollTo(0, y);
}

// The text without its first heading when that only repeats the title shown above it.
function withoutTitle(text, title) {
  const lines = text.split(/\r?\n/);
  const at = lines.findIndex((l) => /^#\s+/.test(l));
  if (at < 0 || lines.slice(0, at).some((l) => l.trim())) return text;
  const h1 = plainInline(lines[at].replace(/^#\s+/, ''));
  return fold(h1).includes(fold(title)) ? lines.slice(at + 1).join('\n') : text;
}

function renderDrawer() {
  const doc = model && state.doc ? model.byPath.get(state.doc) : null;
  const drawer = $('drawer');
  if (!doc) {
    if (!drawer.hidden) closeDrawerNow();
    return;
  }
  const body = $('drawer-body');
  const keepScroll = drawer.dataset.path === doc.path ? body.scrollTop : 0;
  let meta = '';
  if (doc.kind === 'ticket') {
    const t = doc;
    const area = model.areas.get(t.area);
    const row = (k, v) => (v ? `<dt>${k}</dt><dd>${v}</dd>` : '');
    meta = `<dl class="meta">
${row(ui('table.area'), esc(t.area) + (area && area.spec ? ` · ${badge('neutral', ui('area.spec'))} <a href="${docHref(area.spec.path)}" data-doc="${esc(area.spec.path)}">${esc(area.spec.title)}</a>` : ''))}
${t.statusNote ? row(ui('drawer.note'), esc(t.statusNote)) : ''}
${row(ui('drawer.prd'), t.prd.length ? prdLinks(t) : t.prdNone ? `<span class="muted">${ui('drawer.prd-none')}</span>` : '')}
${row(ui('table.checks'), t.checks.total ? meter(t.checks) : '')}
${row(ui('table.blocked-by'), blockerLinks(t) + (t.notes.length ? ' <span class="muted">' + esc(t.notes.join('; ')) + '</span>' : ''))}
${row(ui('drawer.unlocks'), t.dependents.map((d) => ticketLink(d)).join(' '))}
${row(ui('drawer.earlier'), esc(t.earlier))}${row(ui('drawer.type'), esc(t.type))}
${row(ui('table.last-comment'), t.lastComment ? `${esc(dateText(t.lastComment))} · ${ui('drawer.comments', { n: t.comments.filter((c) => !c.event).length })}` : '')}
${row(ui('drawer.labels'), (t.labels || []).map((l) => `<span class="gw-tag">${esc(l)}</span>`).join(' '))}
${t.source === 'github' ? row(ui('drawer.github'), `<a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer" class="gw-tag">${esc(t.path)} ↗</a>`) : row(ui('docs.file'), `<span class="gw-tag">${esc(t.path)}</span>`)}</dl>`;
    $('drawer-kicker').innerHTML = `<span class="gw-tag">${esc(t.label)}</span>${chip(t.status)}${flags(t)}`;
  } else {
    meta = `<dl class="meta"><dt>${ui('docs.file')}</dt><dd><span class="gw-tag">${esc(doc.path)}</span></dd>${doc.kind === 'adr' && doc.status ? `<dt>${ui('docs.adr-status')}</dt><dd>${esc(doc.status)}</dd>` : ''}</dl>`;
    const kind = { adr: 'docs.adr', spec: 'area.spec', readme: 'docs.readme', glossary: 'docs.glossary' }[doc.kind] || 'area.doc';
    $('drawer-kicker').innerHTML = badge('neutral', ui(kind)) + (doc.area ? `<span class="muted">${esc(doc.area)}</span>` : '');
  }
  $('drawer-title').textContent = doc.title;
  body.innerHTML = meta + '<div class="md">' + renderMarkdown(withoutTitle(doc.text, doc.title), { path: doc.path, model }) + '</div>';
  const wasHidden = drawer.hidden;
  drawer.hidden = false;
  $('shade').hidden = false;
  $('top').inert = true;
  $('main').inert = true;
  document.body.style.overflow = 'hidden';
  body.scrollTop = keepScroll;
  if (wasHidden || drawer.dataset.path !== doc.path) $('drawer-close').focus();
  drawer.dataset.path = doc.path;
}

function closeDrawerNow() {
  $('drawer').hidden = true;
  $('shade').hidden = true;
  $('top').inert = false;
  $('main').inert = false;
  document.body.style.overflow = '';
  delete $('drawer').dataset.path;
}

function closeDrawer() {
  const back = lastOpener;
  location.hash = '#/' + state.view;
  requestAnimationFrame(() => {
    const el = back && [...document.querySelectorAll('#main a[data-doc]')].find((a) => a.dataset.doc === back);
    if (el) el.focus();
  });
}

function renderAll() {
  $('start').hidden = true;
  $('app').hidden = false;
  renderBrand();
  document.title = ui('page.title-open', { n: model.open.length, name: model.projectName || ui('page.project') });
  renderNotices();
  renderOverview();
  renderTabs();
  renderFilters();
  renderView();
  renderDrawer();
  renderLive();
}

// ───────────────────────── Routing and events ─────────────────────────

function readHash() {
  const m = /^#\/([a-z]+)(?:\/(.+))?$/.exec(location.hash);
  const view = m && VIEW_RENDERERS[m[1]] ? m[1] : 'waiting';
  let doc = null;
  if (m && m[2]) { try { doc = decodeURIComponent(m[2]); } catch (e) { doc = null; } }
  const viewChanged = view !== state.view;
  state.view = view;
  state.doc = doc;
  if (!model) return;
  if (viewChanged) { renderTabs(); renderOverview(); renderFilters(); renderView(); window.scrollTo(0, 0); }
  renderDrawer();
}
window.addEventListener('hashchange', readHash);

// The PRD filter came in the address (?prd=): it goes from there too, so a reload shows everything.
function clearPrd() {
  state.prd = '';
  try {
    const url = new URL(location.href);
    url.searchParams.delete('prd');
    history.replaceState(history.state, '', url.pathname + url.search + url.hash);
  } catch (e) { /* the filter is gone anyway */ }
}

function filtersChanged() {
  renderFilters();
  renderView();
}

let typing = null;
$('q').addEventListener('input', () => {
  state.q = $('q').value;
  clearTimeout(typing);
  typing = setTimeout(renderView, 120);
});
$('f-status').addEventListener('change', (e) => { state.status = e.target.value; filtersChanged(); });
$('f-area').addEventListener('change', (e) => { state.area = e.target.value; filtersChanged(); });
$('f-closed').addEventListener('change', (e) => { state.showClosed = e.target.checked; filtersChanged(); });
$('f-toggle').addEventListener('click', () => {
  const open = !$('filters').classList.contains('is-open');
  $('filters').classList.toggle('is-open', open);
  $('f-toggle').setAttribute('aria-expanded', String(open));
});

// Read again now: from the server or a live folder; a snapshot asks for the folder again; a
// folder the browser stopped letting the page read asks for the permission first.
async function readAgain() {
  if (!source) return;
  if (!source.live) { $('dir-input').click(); return; }
  if (lostAccess) {
    try { if (await source.root.requestPermission({ mode: 'read' }) !== 'granted') return; } catch (e) { return; }
  }
  announce = true;
  refresh();
}

document.addEventListener('click', (e) => {
  const act = e.target.closest('[data-act]');
  if (act) {
    const what = act.dataset.act;
    if (what === 'refresh' || what === 'renew') { readAgain(); return; }
    if (what === 'more-days') { state.activityDays += 30; renderView(); return; }
    if (what === 'github-events') { state.githubEvents = act.getAttribute('aria-pressed') !== 'true'; renderView(); return; }
    if (what === 'more-commits') { gitState.limit += GIT_PAGE; act.disabled = true; refreshGit().then(() => { renderTabs(); renderView(); }); return; }
    if (what === 'show-closed') state.showClosed = true;
    if (what === 'clear') { state.q = ''; state.status = ''; state.area = ''; state.showClosed = false; clearPrd(); }
    if (what === 'clear-prd') clearPrd();
    if (what === 'clear-q') state.q = '';
    if (what === 'clear-status') state.status = '';
    if (what === 'clear-area') state.area = '';
    if (what === 'clear-closed') state.showClosed = false;
    filtersChanged();
    return;
  }
  const jumpTo = e.target.closest('[data-jump]');
  if (jumpTo) {
    const el = $(jumpTo.dataset.jump);
    if (el) { e.preventDefault(); el.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
    return;
  }
  const jump = e.target.closest('[data-git-jump]');
  if (jump) {
    gitState.hit = jump.dataset.gitJump;
    renderView();
    const row = document.querySelector(`.graph .row[data-commit="${CSS.escape(gitState.hit)}"]`);
    if (row) row.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    else { gitState.hit = ''; }
    return;
  }
  const commitRow = e.target.closest('.graph .row[data-commit]');
  if (commitRow && !String(window.getSelection())) {
    const h = commitRow.dataset.commit;
    if (gitState.open.has(h)) gitState.open.delete(h); else gitState.open.add(h);
    renderView();
    return;
  }
  const link = e.target.closest('a[data-doc]');
  if (link) { if (!$('drawer').contains(link)) lastOpener = link.dataset.doc; return; }
  const row = e.target.closest('tr[data-doc]');
  if (row && !e.target.closest('a, button') && !String(window.getSelection())) {
    lastOpener = row.dataset.doc;
    location.hash = docHref(row.dataset.doc);
  }
});
document.addEventListener('toggle', (e) => {
  const key = e.target.dataset && e.target.dataset.key;
  if (key) { if (e.target.open) openDetails.add(key); else openDetails.delete(key); }
}, true);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('drawer').hidden) { e.preventDefault(); closeDrawer(); return; }
  if (e.key === '/' && !$('app').hidden && $('drawer').hidden && applies('q') && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) { e.preventDefault(); $('q').focus(); }
});
$('drawer-close').addEventListener('click', closeDrawer);
$('shade').addEventListener('click', closeDrawer);

// ───────────────────────── Choosing the folder ─────────────────────────

const canPick = typeof window.showDirectoryPicker === 'function';

async function useHandle(handle) {
  await rememberHandle(handle);
  await start({ adapter: handleAdapter, root: handle, name: handle.name, live: true });
}

async function pickFolder() {
  try {
    await useHandle(await window.showDirectoryPicker({ mode: 'read', id: 'development-status' }));
  } catch (err) {
    if (err && err.name === 'AbortError') return;
    $('start-error').textContent = ui('error.open', { error: err && err.message ? err.message : err });
    $('start-error').hidden = false;
  }
}

$('pick').addEventListener('click', pickFolder);
$('snapshot').addEventListener('click', () => $('dir-input').click());
$('dir-input').addEventListener('change', async (e) => {
  const files = [...e.target.files];
  e.target.value = '';
  if (!files.length) return;
  const tree = treeFromFiles(files);
  await start({ adapter: treeAdapter, root: tree.root, name: tree.name, live: false });
});
$('change').addEventListener('click', async () => {
  await forgetHandle();
  showStart();
  if (canPick) pickFolder();
});
// From the server the live updates say what changed; a folder read in the browser is read again
// when the page comes back into sight.
document.addEventListener('visibilitychange', () => { if (!document.hidden && source && source.live && !source.server) refresh(); });

// A dropped folder: live where the browser hands out a handle, a snapshot elsewhere.
let dragDepth = 0;
const hasFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
document.addEventListener('dragenter', (e) => { if (hasFiles(e)) { dragDepth++; document.body.classList.add('dragging'); } });
document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
document.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
document.addEventListener('drop', async (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('dragging');
  const item = [...e.dataTransfer.items].find((it) => it.kind === 'file');
  if (!item) return;
  // Both calls must happen before the handler yields.
  const handlePromise = typeof item.getAsFileSystemHandle === 'function' ? item.getAsFileSystemHandle() : null;
  const entry = typeof item.webkitGetAsEntry === 'function' ? item.webkitGetAsEntry() : null;
  let handle = null;
  try { handle = handlePromise ? await handlePromise : null; } catch (err) { handle = null; }
  if (handle && handle.kind === 'directory') return useHandle(handle);
  if (entry && entry.isDirectory) return start({ adapter: entryAdapter, root: entry, name: entry.name, live: false });
  $('start-error').textContent = ui('error.drop-file');
  $('start-error').hidden = false;
});

// ───────────────────────── Layout ─────────────────────────
// Light or dark follows the operating system (the shell's theme); there is no switch here.

// The tabs stick right under the page's own bar (none inside the shell), whatever its height.
const topHeight = () => document.documentElement.style.setProperty('--top-h', (getComputedStyle($('top')).display !== 'none' ? $('top').offsetHeight : 0) + 'px');
if (typeof ResizeObserver === 'function') new ResizeObserver(topHeight).observe($('top'));
window.addEventListener('resize', topHeight);
topHeight();

// ───────────────────────── Language ─────────────────────────
// Inside the shell the shell's picker sets the language and this page follows it (i18n listens);
// alone, the page shows its own picker (in its own bar, which the shell hides).

let resumeName = '';   // the remembered folder, offered on the start screen

function relabelStart() {
  $('mode-note').textContent = canPick ? ui('start.mode-live', { sec: POLL_MS / 1000 }) : ui('start.mode-snapshot');
  $('pick').textContent = ui(resumeName ? 'start.pick-other' : 'start.pick');
  $('resume-btn').textContent = ui('start.resume', { name: resumeName });
  $('rules').innerHTML = ui('start.rules');
}

function relabel() {
  i18n.apply(document);
  relabelStart();
  if (model) renderAll();
  else { renderBrand(); document.title = ui('page.title'); renderLive(); }
}

const langPicker = $('lang');
langPicker.innerHTML = Object.entries(LANGS).map(([code, name]) => `<option value="${code}">${esc(name)}</option>`).join('');
langPicker.addEventListener('change', () => i18n.set(langPicker.value));
i18n.onChange(() => { langPicker.value = i18n.lang; relabel(); });
langPicker.value = i18n.lang;
relabel();

// ───────────────────────── Boot ─────────────────────────

async function boot() {
  $('pick').hidden = !canPick;
  readHash();
  const hello = await findServer();
  if (hello) { await start(serverSource(hello)); return; }
  if (!canPick) return;
  const saved = await recallHandle();
  if (!saved || typeof saved.queryPermission !== 'function') return;
  let permission = 'prompt';
  try { permission = await saved.queryPermission({ mode: 'read' }); } catch (e) { /* ask again */ }
  if (permission === 'granted') { await start({ adapter: handleAdapter, root: saved, name: saved.name, live: true }); return; }
  $('resume').hidden = false;
  resumeName = saved.name;
  relabelStart();
  $('pick').classList.remove('gw-btn--primary');
  $('resume-btn').onclick = async () => {
    try {
      if (await saved.requestPermission({ mode: 'read' }) === 'granted') await start({ adapter: handleAdapter, root: saved, name: saved.name, live: true });
    } catch (err) {
      $('start-error').textContent = ui('error.gone', { error: err && err.message ? err.message : err });
      $('start-error').hidden = false;
    }
  };
}

// For checks from the console or a test: the parsed state, read only.
window.developmentStatus = { get model() { return model; }, get source() { return source; }, get changes() { return changeLog; }, refresh, renderMarkdown };

boot();
})();
</script>
</body>
