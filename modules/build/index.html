<title data-i18n="page.title">Development status</title>
<link rel="icon" href="data:,">
<!--
  The Build module's dashboard (index.html): a self-contained status page for
  a project whose tickets, specs and decisions live in markdown files.

  No build, no dependencies. Two ways to open it:
    - from the Groundwork core server (npx @pottom/groundwork, at /build/):
      the Build module's read-only endpoints (/api/build/, module.mjs) hand
      the page the markdown files, so it goes live at once, in every browser;
    - or open this file by double click: it asks once for the project folder
      (read only), which needs a Chromium browser to stay live.
  Either way it re-reads the markdown files every few seconds. Nothing about
  any particular project is baked in: copy the file into
  another project that keeps the same conventions and it works there.

  Conventions it reads (all relative to the chosen folder):
    <tracker>/<area>/issues/<number>-<slug>.md   one ticket per file
    <tracker>/<area>/spec.md                     the area's spec
    <tracker>/<area>/**/*.md                     other documents
    docs/adr/*.md                                decision records
    README.md                                    the project's name (first heading)
    GLOSSARY.md (or the older CONTEXT.md), GLOSSARY-MAP.md
                                                 the domain glossary, listed under Documents
  <tracker> is ".scratch" by default (DEFAULT_TRACKER_DIR in ticket-reader.js); without it,
  the first folder whose subfolders hold "issues/" folders.

  A ticket's fields are read near the top of the file, in any of these forms:
    **Status:** ready-for-agent        Status: ready-for-agent      - **Status:** …
  (the local format of Matt Pocock's /to-tickets skill puts **Blocked by:**
  before **Status:**; the order does not matter). "Blocked by" may also be a
  "## Blocked by" heading with a list under it (the issue template's form),
  and it may name tickets by number ("01", "#12", "area 3"), by file name
  ("01-some-slug") or by title; "None (can start immediately)" means none.
  Comments go under "## Comments"; a heading with a date (### 2026-10-14 …)
  is one comment.

  Reading the tickets is ticket-reader.js beside this page (a classic script:
  GroundworkTickets.readTickets(source) → the model every view draws). On the
  core server the page also gets the project's GitHub issues (/api/build/issues;
  the server asks GitHub, no token reaches the page): each is a ticket with its
  state, labels, milestone (its area) and "Blocked by" links.

  The Branches view draws the git history: every branch and tag, the
  commits in date order, and where each branch was merged. Git is asked by the
  server (read only), so this view needs it; opened by double click, the
  page cannot run git.

  Version: since the npm package, Build has no version of its own: it ships
  with Groundwork and carries the package's (package.json, core/version.mjs),
  which the page shows from /api/build/hello. The history before that:
    1.0.0  2026-10-18  the first numbered version: tickets, areas, dependencies,
                       activity, inconsistencies, documents, and the git branch
                       graph; the version is shown in the header, and a
                       page and launcher of different versions say so
    2.0.0  2026-10-19  served by the Groundwork core server: the endpoints moved
                       to /api/build/, development-status.mjs is gone
    2.1.0  2026-10-19  the shared look: colours and fonts from the shell's theme
                       (/shell/theme.css, with a fallback when opened alone);
                       light or dark follows the system, the switch is gone;
                       inside the shell the bar drops the project name
    2.2.0  2026-10-19  English UI with a Hungarian translation (the shell's
                       i18n.mjs, inline below, kept equal by ui-strings.test.mjs);
                       it follows the shell's language, and alone it has its own
                       language picker
    2.3.0  2026-10-19  GitHub issues as tickets (/api/build/issues); reading the
                       tickets moved into ticket-reader.js
    2.4.0  2026-10-19  a ticket's "**PRD:**" line shows as links that open Plan on
                       those map nodes (Plan's deep link /?module=plan&node=<id>)
    2.5.0  2026-10-19  checks: a ticket without a PRD line, or naming an id that is
                       not on Plan's map (docs/product/mindmap.json)
    2.6.0  2026-10-19  from the server the page follows the core's live updates
                       (Server-Sent Events, /api/events) instead of polling;
                       ?prd=<id> shows only the tickets of that PRD item (Plan
                       links here); /api/build/prd counts them for Plan
    (Groundwork 0.1.0, 2026-10-19: the last own version, 2.6.0, is followed by
    the package's; the header shows it, and the page/launcher check is gone)
-->

/* Colours carry the ticket states:
   ready-for-agent = blue, waiting for a human = orange,
   needs-…-test = purple, done = green. */
/* The shared look comes from the shell's theme (/shell/theme.css, linked above): every
   colour, font and radius the shell and the other modules share is a --gw-* variable.
   Light or dark follows the operating system.

   Opened by double click there is no server, so no theme: the :where(:root) blocks
   below repeat the theme's values as a fallback. :where() has no specificity, so
   when theme.css is there its :root wins. Keep them equal to core/shell/theme.css
   (module.test.mjs checks it). */
:where(:root) {
  color-scheme: light dark;
  --gw-bg: #fbfaf7;
  --gw-surface: #ffffff;
  --gw-sunken: #f3f1ec;
  --gw-fg: #1d1c1a;
  --gw-fg-2: #4a4843;
  --gw-muted: #6b6860;
  --gw-line: #e4e0d7;
  --gw-line-strong: #cfcac0;
  --gw-accent: #2f5bd3;
  --gw-accent-fg: #ffffff;
  --gw-focus: #2f5bd3;
  --gw-ok: #1f8a4c;
  --gw-bad: #c0392b;
  --gw-shadow: 0 1px 2px rgb(0 0 0 / .04), 0 4px 16px rgb(0 0 0 / .05);
  --gw-font: Inter, 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
  --gw-font-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
  --gw-radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :where(:root) {
    --gw-bg: #15161a;
    --gw-surface: #1c1e23;
    --gw-sunken: #24262c;
    --gw-fg: #ecebe8;
    --gw-fg-2: #c3c1bb;
    --gw-muted: #9a978f;
    --gw-line: #2f3238;
    --gw-line-strong: #464a52;
    --gw-accent: #7d9cf0;
    --gw-accent-fg: #15161a;
    --gw-focus: #7d9cf0;
    --gw-ok: #5cc58a;
    --gw-bad: #ee7a6c;
    --gw-shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .22);
  }
}

/* Build's own colours: the ticket kinds (--c-*), the branch lanes (--g*), and two
   surfaces the shell has no name for. Done and missing are the shell's ok and bad. */
:root {
  --raised: #ffffff;
  --c-agent: #2f5bd3; --c-human: #c2410c; --c-test: #7c3aed; --c-claimed: #0b7269;
  --c-done: var(--gw-ok); --c-dropped: #7a776f; --c-neutral: #55524a; --c-bad: var(--gw-bad);
  --shadow-lg: 0 10px 40px rgb(0 0 0 / .16);
  --g0: #2f5bd3; --g1: #c2410c; --g2: #1f8a4c; --g3: #7c3aed; --g4: #0b7269; --g5: #b4235a; --g6: #8a6d00; --g7: #4a6fa5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --raised: #22242a;
    --c-agent: #7d9cf0; --c-human: #f08a5d; --c-test: #b294f5; --c-claimed: #5cc7bb;
    --c-dropped: #8f8c85; --c-neutral: #b4b1a8;
    --g0: #7d9cf0; --g1: #f08a5d; --g2: #5cc58a; --g3: #b294f5; --g4: #5cc7bb; --g5: #f07aa8; --g6: #d9b44a; --g7: #8fb0dd;
    --shadow-lg: 0 10px 40px rgb(0 0 0 / .5);
  }
}

/* Inside the shell (an iframe of /), the shell's header already names the project:
   Build's bar keeps only the live state and the version. */
.in-shell .bar h1 { display: none; }
.in-shell .bar { justify-content: flex-end; padding-top: 6px; padding-bottom: 6px; }
.in-shell #start { margin-top: 4vh; }
/* Alone, the page picks its own UI language; inside the shell the shell's picker does it. */
.in-shell #lang { display: none; }
#lang { padding: 2px 6px; border: 1px solid var(--gw-line-strong); border-radius: 7px; background: var(--gw-surface); font-size: 12.5px; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--gw-bg); color: var(--gw-fg); font: 14px/1.5 var(--gw-font); overflow-x: hidden; }
a { color: var(--gw-accent); text-decoration: none; text-underline-offset: 2px; }
a:hover { text-decoration: underline; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--gw-focus); outline-offset: 2px; border-radius: 4px; }
button, select, input { font: inherit; color: inherit; }
button, .btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid var(--gw-line-strong);
  background: var(--gw-surface); border-radius: 7px; cursor: pointer; white-space: nowrap; line-height: 1.4;
  transition: border-color .12s, background-color .12s;
}
button:hover, .btn:hover { border-color: var(--gw-fg-2); text-decoration: none; }
button.primary { background: var(--gw-accent); border-color: var(--gw-accent); color: var(--gw-accent-fg); font-weight: 600; padding: 9px 18px; }
button.primary:hover { background: color-mix(in srgb, var(--gw-accent) 88%, var(--gw-fg)); }
button.quiet { border-color: transparent; background: none; color: var(--gw-accent); padding: 2px 4px; }
button.quiet:hover { text-decoration: underline; }
button.icon { padding: 5px 8px; color: var(--gw-fg-2); }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 8px; top: 8px; z-index: 50; background: var(--gw-surface); padding: 6px 10px; border-radius: 6px; box-shadow: var(--gw-shadow); }
.num, .mono { font-family: var(--gw-font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--gw-muted); }
[hidden] { display: none !important; }
code { font-family: var(--gw-font-mono); font-size: .9em; background: var(--gw-sunken); padding: 1px 5px; border-radius: 4px; }

/* Top bar */
#top {
  position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--gw-line);
  background: color-mix(in srgb, var(--gw-bg) 90%, transparent); -webkit-backdrop-filter: saturate(1.4) blur(10px); backdrop-filter: saturate(1.4) blur(10px);
}
.bar { max-width: 1440px; margin: 0 auto; padding: 10px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.bar h1 { font-size: 16px; margin: 0 auto 0 0; font-weight: 680; letter-spacing: -.005em; display: flex; align-items: center; gap: 10px; min-width: 0; overflow-wrap: anywhere; }
.bar h1::before {
  content: ""; flex: none; width: 14px; height: 14px; border-radius: 4px;
  background: linear-gradient(135deg, var(--c-agent) 0 50%, var(--c-done) 50% 100%);
}
.bar h1 small { font-weight: 450; color: var(--gw-muted); font-size: 13px; }

.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-dropped); flex: none; }

@media (prefers-reduced-motion: no-preference) { .dot.on.tick { animation: tick .9s ease-out; } }

.wrap { max-width: 1440px; margin: 0 auto; padding: 0 24px 96px; }

/* Start screen */
#start { max-width: 660px; margin: 8vh auto 40px; padding: 0 20px; }

/* Overview: big numbers and the segmented progress bar */
.overview { padding: 20px 0 6px; display: grid; gap: 14px; }

.kpi {

}
.kpi::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--c); }
.kpi .v { font: 680 30px/1.05 var(--gw-font); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }

.stack span.closed { background: repeating-linear-gradient(135deg, var(--c) 0 5px, color-mix(in srgb, var(--c) 72%, var(--gw-surface)) 5px 8px); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.chip {
  --c: var(--c-neutral); display: inline-flex; align-items: center; gap: 6px; padding: 1px 9px 1px 8px; border-radius: 999px; white-space: nowrap;
  font: 500 12px/1.65 var(--gw-font-mono); color: color-mix(in srgb, var(--c) 82%, var(--gw-fg)); background: color-mix(in srgb, var(--c) 11%, transparent);
  border: 1px solid color-mix(in srgb, var(--c) 28%, transparent);
}
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }
.chip.closed { background: transparent; }
.chip.closed::before { background: none; border: 1.5px solid var(--c); width: 6px; height: 6px; }
button.chip { cursor: pointer; padding-top: 2px; padding-bottom: 2px; }
button.chip:hover, button.chip[aria-pressed="true"] { border-color: var(--c); }

/* Navigation and filters */
nav.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--gw-line); overflow-x: auto; margin-top: 8px; scrollbar-width: thin; }

.tref.is-missing { color: var(--c-bad); background: color-mix(in srgb, var(--c-bad) 9%, transparent); }
.flag { display: inline-block; font: 650 10.5px/1.6 var(--gw-font-mono); padding: 0 6px; border-radius: 5px; border: 1px solid; white-space: nowrap; vertical-align: 1px; text-transform: lowercase; }

/* Areas */
details.area { background: var(--gw-surface); border: 1px solid var(--gw-line); border-radius: var(--gw-radius); margin-bottom: 8px; box-shadow: var(--gw-shadow); }
details.area > summary { display: grid; grid-template-columns: 18px minmax(150px, 1.1fr) minmax(0, 2.2fr) 160px 170px; gap: 12px; align-items: center; padding: 10px 14px; cursor: pointer; list-style: none; border-radius: var(--gw-radius); }

.bar2 { display: block; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--c-agent) 22%, var(--gw-sunken)); overflow: hidden; }

details.area .inner { padding: 6px 14px 14px; border-top: 1px solid var(--gw-line); }
.doclist { margin: 8px 0 12px; padding: 0; list-style: none; display: grid; gap: 4px; }
.doclist li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 0; }
.doclist .path { color: var(--gw-muted); font: 12px var(--gw-font-mono); margin-left: 8px; overflow-wrap: anywhere; }
.kind { font: 600 10.5px/1.6 var(--gw-font-mono); color: var(--gw-fg-2); background: var(--gw-sunken); border-radius: 4px; padding: 0 6px; margin-right: 7px; text-transform: lowercase; }

/* Dependency tree */
ul.tree, ul.tree ul { list-style: none; margin: 0; padding: 0; }
ul.tree > li { background: var(--gw-surface); border: 1px solid var(--gw-line); border-radius: var(--gw-radius); padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--gw-shadow); }
ul.tree ul { margin: 2px 0 0 14px; padding-left: 22px; }
ul.tree ul > li { position: relative; padding: 5px 0 0; }
ul.tree ul > li::before {
  content: ""; position: absolute; left: -22px; top: 0; width: 16px; height: 22px;
  border-left: 1.5px solid var(--gw-line-strong); border-bottom: 1.5px solid var(--gw-line-strong); border-bottom-left-radius: 7px;
}

.node { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; min-height: 30px; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--gw-muted); font-size: 12.5px; margin: -4px 0 14px; align-items: center; }

/* Activity */
.day { margin: 0 0 18px; }
.day > h3 { font: 650 13px var(--gw-font-mono); margin: 0 0 6px; position: sticky; top: var(--top-h, 52px); z-index: 2; background: var(--gw-bg); padding: 6px 0; }
.day ul { margin: 0; padding: 0; list-style: none; background: var(--gw-surface); border: 1px solid var(--gw-line); border-radius: var(--gw-radius); box-shadow: var(--gw-shadow); }

.view > button { margin-top: 4px; }

/* Git branches */
.ver { font: 500 11.5px/1.6 var(--gw-font-mono); color: var(--gw-muted); padding: 0 7px; border-radius: 999px; border: 1px solid var(--gw-line); white-space: nowrap; }
.ref { --c: var(--c-neutral); display: inline-flex; align-items: center; gap: 4px; font: 600 11px/1.55 var(--gw-font-mono); padding: 0 6px; border-radius: 5px; white-space: nowrap;
  color: color-mix(in srgb, var(--c) 80%, var(--gw-fg)); background: color-mix(in srgb, var(--c) 13%, transparent); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
.ref.remote { background: transparent; border-style: dashed; font-weight: 500; }
.ref.tag { color: var(--gw-fg-2); background: var(--gw-sunken); border-color: var(--gw-line-strong); font-weight: 500; }
.ref.tag::before { content: ""; width: 6px; height: 6px; transform: rotate(45deg); background: var(--gw-muted); }

.ref.head::before { content: "HEAD"; font-size: 9.5px; letter-spacing: .04em; color: var(--gw-muted); }
/* after .ref: a lane's colour wins over the neutral default */
.lane0 { --c: var(--g0); } .lane1 { --c: var(--g1); } .lane2 { --c: var(--g2); } .lane3 { --c: var(--g3); }
.lane4 { --c: var(--g4); } .lane5 { --c: var(--g5); } .lane6 { --c: var(--g6); } .lane7 { --c: var(--g7); }

.graph .row:hover { background: color-mix(in srgb, var(--gw-fg) 4%, transparent); }
.graph .row.hit { background: color-mix(in srgb, var(--gw-accent) 12%, transparent); }
.graph .row .h { font: 12px var(--gw-font-mono); color: var(--gw-muted); flex: none; }

.graph .row .when { font: 12px var(--gw-font-mono); color: var(--gw-muted); flex: none; width: 78px; text-align: right; }
.graph .refs { display: inline-flex; gap: 4px; flex: none; }
.graph .more { position: absolute; left: 0; right: 0; }
.graph .detail { padding: 8px 12px 10px; margin: 0 8px 6px 0; background: var(--gw-sunken); border-radius: 8px; font-size: 13px; white-space: normal; display: grid; gap: 2px; }

@media (max-width: 860px) {

}
@media (max-width: 520px) {
  .graph .row .h, .graph .row .when { display: none; }
}

/* Drawer */
#shade { position: fixed; inset: 0; background: rgb(10 10 12 / .42); z-index: 20; }
@media (prefers-reduced-motion: no-preference) {
  #shade:not([hidden]) { animation: fade .15s ease-out; }
  #drawer:not([hidden]) { animation: slide .18s ease-out; }
}
@keyframes fade { from { opacity: 0; } }
@keyframes slide { from { transform: translateX(24px); } }
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(900px, 100%); z-index: 21; background: var(--gw-surface); border-left: 1px solid var(--gw-line-strong); display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }

#drawer header h2 .num { color: var(--gw-muted); font-weight: 500; margin-right: 8px; font-size: 15px; }
#drawer .scroll { overflow: auto; padding: 0 22px 64px; flex: 1; overscroll-behavior: contain; }
dl.meta { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 16px 0; padding: 12px 14px; background: var(--gw-sunken); border-radius: var(--gw-radius); font-size: 13px; align-items: baseline; }
dl.meta dt { color: var(--gw-muted); }
dl.meta dd { margin: 0; overflow-wrap: anywhere; }
.md { max-width: 78ch; overflow-wrap: anywhere; font-size: 14.5px; line-height: 1.6; }
.md h1 { font-size: 21px; letter-spacing: -.01em; } .md h2 { font-size: 16.5px; border-bottom: 1px solid var(--gw-line); padding-bottom: 4px; margin-top: 28px; }
.md h3 { font-size: 14.5px; margin-top: 22px; } .md h4, .md h5, .md h6 { font-size: 13.5px; }
.md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: 9px 0; }
.md ul, .md ol { padding-left: 22px; }
.md li { margin: 3px 0; }
.md li.task { list-style: none; margin-left: -20px; }
.md li.task input { margin: 0 7px 0 0; vertical-align: -1px; accent-color: var(--c-done); }
.md li.task.done > span.t { color: var(--gw-muted); }
.md pre { background: var(--gw-sunken); padding: 11px 13px; border-radius: 8px; overflow: auto; font: 12.5px/1.55 var(--gw-font-mono); border: 1px solid var(--gw-line); }
.md pre code { background: none; padding: 0; font-size: inherit; }
.md blockquote { border-left: 3px solid var(--gw-accent); background: color-mix(in srgb, var(--gw-accent) 6%, transparent); padding: 4px 14px; color: var(--gw-fg-2); margin-left: 0; border-radius: 0 8px 8px 0; }
.md .tw { overflow-x: auto; }
.md table { border-collapse: collapse; font-size: 13px; }
.md th, .md td { border: 1px solid var(--gw-line); padding: 5px 9px; vertical-align: top; text-align: left; }
.md th { background: var(--gw-sunken); }
.md hr { border: 0; border-top: 1px solid var(--gw-line-strong); margin: 20px 0; }
.md .dead { border-bottom: 1px dotted var(--gw-muted); }
.md del { color: var(--gw-muted); }

@media (max-width: 860px) {

  #top { position: static; }

  .live .state { flex: 1 1 100%; border-radius: 8px; }
  table.grid th.c-area, table.grid td.c-area, table.grid th.c-blk, table.grid td.c-blk, table.grid th.c-last, table.grid td.c-last { display: none; }
  td.c-title .sub { display: block; }
  td.c-title { min-width: 0; }
  table.grid td, table.grid th { padding: 8px 9px; }
  details.area > summary { grid-template-columns: 14px 1fr auto; gap: 6px 10px; padding: 10px 12px; }
  details.area > summary .spec { grid-column: 2 / -1; order: 3; }
  details.area > summary .bar2 { grid-column: 2 / -1; order: 4; }
  details.area .inner { padding: 6px 10px 12px; }
  .filters .summary { margin-left: 0; width: 100%; }
  .filters input[type="search"] { flex-basis: 100%; max-width: none; }
  .filters select { max-width: none; flex: 1 1 40%; }
  #drawer .scroll, #drawer header { padding-left: 16px; padding-right: 16px; }
  #start .card { padding: 22px 20px; }
}
@media (max-width: 520px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

  table.grid th.c-st, table.grid td.c-st { display: none; }
  td.c-title .sub-st { display: block; margin: 2px 0; }

  .meter i { display: none; }
  ul.tree > li { padding: 10px; }
  ul.tree ul { margin-left: 6px; padding-left: 16px; }
  ul.tree ul > li::before { left: -16px; width: 12px; }
  ul.tree ul > li::after { left: -16px; }
  dl.meta { grid-template-columns: 1fr; gap: 0; }
  dl.meta dd { margin-bottom: 6px; }
}
</style>
</head>
<body>
<a class="skip" href="#main" data-i18n="page.skip">Skip to content</a>

<header id="top">
  <div class="bar">
    <h1 id="project">Development status</h1>
    <div class="live" id="live" hidden>
      <span class="state"><span class="dot" id="dot"></span>
      <span id="live-text" aria-live="polite"></span></span>
      <button type="button" id="refresh" data-i18n="live.refresh">Refresh now</button>

    </div>
    <span class="ver" id="ver"></span>
    <select id="lang" class="gw-lang" data-i18n-aria-label="page.lang"></select>
  </div>
</header>

<main id="main">
  <section id="start"><div class="card">
    <h2 data-i18n="page.title">Development status</h2>
    <p data-i18n="start.intro"></p>
    <div id="resume" hidden>
      <div class="choices">
        <button type="button" class="primary" id="resume-btn"></button>
      </div>
      <p class="muted" data-i18n="start.resume-note"></p>
    </div>
    <div class="choices">
      <button type="button" class="primary" id="pick" hidden></button>
      <button type="button" id="snapshot" data-i18n="start.snapshot"></button>
      <input type="file" id="dir-input" webkitdirectory multiple hidden>
    </div>
    <p id="mode-note" class="muted"></p>
    <div id="start-error" class="notice bad" hidden></div>
    <div class="drop" data-i18n="start.drop"></div>

      <p id="rules"></p>
    </div>
  </div></section>

  <section id="app" class="wrap" hidden>

      <input type="search" id="q" data-i18n-placeholder="filter.search" data-i18n-aria-label="filter.search-label">
      <select id="f-status" data-i18n-aria-label="filter.status"></select>
      <select id="f-area" data-i18n-aria-label="filter.area"></select>
      <label class="check"><input type="checkbox" id="f-closed"> <span data-i18n="filter.closed"></span></label>
      <span class="summary" id="f-summary" aria-live="polite"></span>

</main>

<div id="shade" hidden></div>

<!-- The UI translation (i18n.js, a copy of core/shell/i18n.mjs without "export") and Build's
     strings (ui-strings.js, BUILD_STRINGS). Classic scripts, not modules: opened by double click
     (file://) there is no /shell/ and no module import, but a classic script beside the page loads.
     Do not edit i18n.js: change core/shell/i18n.mjs and copy it (ui-strings.test.mjs checks). -->
<script src="i18n.js"></script>
<script src="ui-strings.js"></script>
<script src="ticket-reader.js"></script>
<script>
(() => {
'use strict';

// The UI language: English by default, Hungarian too; the choice is shared with the shell.
const i18n = createI18n(BUILD_STRINGS);
const ui = i18n.t;

// ───────────────────────── Constants ─────────────────────────

// The Build module's endpoints on the core server, when the page is loaded
// from it. The same values are in modules/build/module.mjs.
const SERVER_ID = 'development-status';
const SERVER_API = '/api/build';
const SERVER_TIMEOUT_MS = 8000;

const POLL_MS = 3000;
const FRESH_MS = 90000;

// What a ticket is and how it is read (the model every view draws), where the tracker is and
// which folders are walked, the states and the links to Plan: ticket-reader.js, beside the page.
// The server reads the tickets for Plan's counts by the same rules (project-tickets.mjs).
const {
  readTickets, locateProject, keepsFolder, planLink, prdFilter, CLOSED, DONE, DROPPED, UNPARSED, README_FILE, GLOSSARY_FILE,
  DEFAULT_TRACKER_DIR, ALWAYS_SKIP, SKIP_DIRS, LOCATE_DEPTH, fold, isClosed,
} = GroundworkTickets;
const GROUPS = [
  { id: 'agent', title: 'group.agent', hint: 'group.agent.hint', has: (s) => s === 'ready-for-agent' },
  { id: 'human', title: 'group.human', hint: 'group.human.hint', has: (s) => s === 'ready-for-human' || s === 'needs-info' || s === 'needs-triage' },
  { id: 'test', title: 'group.test', hint: 'group.test.hint', has: (s) => /^needs-.*test$/.test(s) },
  { id: 'claimed', title: 'group.claimed', hint: 'group.claimed.hint', has: (s) => s === 'claimed' },
];
const VIEWS = [
  ['waiting', 'view.waiting'], ['areas', 'view.areas'], ['deps', 'view.deps'],
  ['activity', 'view.activity'], ['checks', 'view.checks'], ['docs', 'view.docs'], ['git', 'view.git'],
];
const GIT_PAGE = 400;     // commits asked for at once; "Earlier commits" asks for this many more
const GIT_ROW_H = 28;     // px, one commit
const GIT_LANE_W = 16;    // px, one lane of the graph
const GIT_COLORS = 8;     // --g0 … --g7
const NO_REPO = 'no-repo'; // gitState.error when the folder is not the top of a git repository

// ───────────────────────── Small helpers ─────────────────────────

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const joinPath = (a, b) => (a ? a + '/' + b : b);
const clock = (d) => d.toLocaleTimeString(i18n.lang, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);

function statusTone(status) {
  if (status === UNPARSED) return 'bad';
  if (status === 'ready-for-agent') return 'agent';
  if (status === 'ready-for-human' || status === 'needs-info' || status === 'needs-triage') return 'human';
  if (/^needs-.*test$/.test(status)) return 'test';
  if (status === 'claimed') return 'claimed';
  if (DONE.has(status)) return 'done';
  if (DROPPED.has(status)) return 'dropped';
  return 'neutral';
}
const statusName = (status) => (status === UNPARSED ? ui('status.unparsed') : status);
// A dated entry of a ticket: a heading of its own, or a GitHub issue's opening or closing.
const commentTitle = (c) => (c.event ? ui(c.event === 'closed' ? 'activity.closed' : 'activity.opened') : c.title || ui('activity.untitled'));
const chip = (status, extra = '') => `<span class="chip t-${statusTone(status)}${CLOSED.has(status) ? ' closed' : ''}">${esc(statusName(status))}${extra}</span>`;

// ───────────────────────── Reading the folder ─────────────────────────
// Four ways to get at a folder share one small adapter: list a directory's
// children, and turn a file node into a File (or what stands for one: size,
// lastModified, text()).

const handleAdapter = {
  async children(dir) {
    const out = [];
    for await (const h of dir.values()) out.push({ name: h.name, isDir: h.kind === 'directory', node: h });
    return out;
  },
  file: (h) => h.getFile(),
};

// Dropped folders where the browser has no file system handles (Firefox, Safari).
const entryAdapter = {
  children(dir) {
    return new Promise((resolve, reject) => {
      const reader = dir.createReader();
      const all = [];
      const step = () => reader.readEntries((batch) => {
        if (!batch.length) return resolve(all.map((e) => ({ name: e.name, isDir: e.isDirectory, node: e })));
        all.push(...batch);
        step();
      }, reject);
      step();
    });
  },
  file: (e) => new Promise((resolve, reject) => e.file(resolve, reject)),
};

// A flat list of paths as a tree: the file list of <input webkitdirectory>,
// and the list the launcher's server sends.
const treeAdapter = {
  children: async (dir) => [...dir.children.values()],
  file: async (node) => node.file,
};

function treeDir(root, parts) {
  let dir = root;
  for (const part of parts) {
    let child = dir.children.get(part);
    if (!child) { child = { name: part, isDir: true, node: { children: new Map() } }; dir.children.set(part, child); }
    dir = child.node;
  }
  return dir;
}

function treeFromFiles(fileList) {
  const root = { children: new Map() };
  let name = '';
  for (const f of fileList) {
    const parts = (f.webkitRelativePath || f.name).split('/');
    if (parts.length > 1) name = parts.shift();
    const last = parts.pop();
    treeDir(root, parts).children.set(last, { name: last, isDir: false, node: { file: f } });
  }
  return { root, name };
}

// The launcher's server: one request lists every markdown file (path, size,
// time) and each folder's count of other files; a file's text is asked for
// only when it changed.
class ServerDownError extends Error {
  constructor(message) { super(message); this.name = 'ServerDownError'; }
}

async function serverFetch(path) {
  const stop = new AbortController();
  const timeout = setTimeout(() => stop.abort(), SERVER_TIMEOUT_MS);
  try {
    return await fetch(SERVER_API + path, { cache: 'no-store', signal: stop.signal });
  } catch (err) {
    throw new ServerDownError(ui('error.server-down'));
  } finally {
    clearTimeout(timeout);
  }
}

async function serverJson(path) {
  const res = await serverFetch(path);
  let data = null;
  try { data = res.ok ? await res.json() : null; } catch (err) { data = null; }
  // Anything else on this address is not the launcher: as good as stopped.
  if (!data || data.server !== SERVER_ID) throw new ServerDownError(ui('error.not-our-server'));
  return data;
}

async function serverText(path) {
  const res = await serverFetch('/file?path=' + encodeURIComponent(path));
  if (!res.ok) throw new Error(path + ': HTTP ' + res.status);
  return res.text();
}

function treeFromListing(listing) {
  const root = { children: new Map() };
  for (const [path, others] of Object.entries(listing.dirs || {})) {
    const dir = treeDir(root, path ? path.split('/') : []);
    // Stand-ins for the files that are not markdown: only their number is known.
    // No real file name holds a slash.
    for (let i = 0; i < others; i++) dir.children.set('/' + i, { name: '/' + i, isDir: false, node: {} });
  }
  for (const f of listing.files || []) {
    const parts = f.path.split('/');
    const last = parts.pop();
    treeDir(root, parts).children.set(last, { name: last, isDir: false, node: { file: { size: f.size, lastModified: f.mtime, text: () => serverText(f.path) } } });
  }
  return root;
}

// Is the page loaded from the launcher's server? Asked, not guessed from the
// protocol: served by anything else, the page falls back to the folder picker.
async function findServer() {
  if (!/^https?:$/.test(location.protocol)) return null;
  try { return await serverJson('/hello'); } catch (err) { return null; }
}

function serverSource(hello) {
  const src = { adapter: treeAdapter, root: { children: new Map() }, name: hello.name || '', live: true, server: location.host, launcher: hello.launcher || '', version: hello.version || '', git: !!hello.git, github: !!hello.github };
  src.reload = async () => {
    const listing = await serverJson('/list');
    src.root = treeFromListing(listing);
    src.name = listing.name || src.name;
    src.roots = null;   // the tree is new: find the tracker in it again
  };
  return src;
}

async function findChild(A, dir, path) {
  let node = dir;
  for (const part of path.split('/')) {
    const hit = (await A.children(node)).find((c) => c.isDir && c.name === part);
    if (!hit) return null;
    node = hit.node;
  }
  return node;
}

// The folders the reader's locateProject decides by, with their nodes: LOCATE_DEPTH levels
// down; a heavy folder (SKIP_DIRS) only with its own subfolders, as it may be an area.
async function listFolders(A, root) {
  const nodes = new Map([['', root]]);
  const visit = async (dir, path, depth, heavy) => {
    await Promise.all((await A.children(dir)).map(async (c) => {
      if (!c.isDir || ALWAYS_SKIP.has(c.name)) return;
      const p = joinPath(path, c.name);
      nodes.set(p, c.node);
      if (!heavy && depth + 1 < LOCATE_DEPTH) await visit(c.node, p, depth + 1, SKIP_DIRS.has(c.name));
    }));
  };
  await visit(root, '', 0, false);
  return nodes;
}

// The tracker and the ADR folder: the same rule as the server's (ticket-reader.js).
async function locate(src) {
  const nodes = await listFolders(src.adapter, src.root);
  const { trackerPath, adrPath } = locateProject([...nodes.keys()]);
  return {
    tracker: trackerPath == null ? null : { node: nodes.get(trackerPath), path: trackerPath },
    adr: adrPath == null ? null : { node: nodes.get(adrPath), path: adrPath },
  };
}

async function walk(A, dir, path, depth, skipFrom, out) {
  const kids = await A.children(dir);
  await Promise.all(kids.map(async (c) => {
    const p = joinPath(path, c.name);
    if (c.isDir) {
      if (!keepsFolder(c.name, depth, skipFrom === 0)) return;
      await walk(A, c.node, p, depth + 1, skipFrom, out);
    } else if (/\.(md|markdown)$/i.test(c.name)) {
      const f = await A.file(c.node);
      out.entries.push({ path: p, size: f.size, mtime: f.lastModified, file: f });
    } else {
      out.others.push(p);
    }
  }));
}

// One pass over the folder: every markdown file of the tracker and the ADR
// folder with its size and time, without reading any content.
async function scan(src) {
  const A = src.adapter;
  if (src.reload) await src.reload();
  if (!src.roots || (!src.roots.tracker && Date.now() - src.located > 15000)) {
    src.roots = await locate(src);
    src.located = Date.now();
  }
  const out = { entries: [], others: [] };
  const top = await A.children(src.root);
  for (const c of top) {
    if (c.isDir || !(README_FILE.test(c.name) || GLOSSARY_FILE.test(c.name))) continue;
    const f = await A.file(c.node);
    out.entries.push({ path: c.name, size: f.size, mtime: f.lastModified, file: f });
  }
  const { tracker, adr } = src.roots;
  if (tracker) await walk(A, tracker.node, tracker.path, 0, 1, out);
  if (adr && !(tracker && (adr.path + '/').startsWith(tracker.path + '/'))) await walk(A, adr.node, adr.path, 0, 0, out);
  const seen = new Set();
  out.entries = out.entries.filter((e) => !seen.has(e.path) && seen.add(e.path));
  out.trackerPath = tracker ? tracker.path : null;
  out.adrPath = adr ? adr.path : null;
  return out;
}

const PROBLEM_KINDS = [
  ['duplicate', 'problem.duplicate'],
  ['no-status', 'problem.no-status'],
  ['bad-status', 'problem.bad-status'],
  ['all-checked', 'problem.all-checked'],
  ['missing-blocker', 'problem.missing-blocker'],
  ['released', 'problem.released', true],
  ['mismatch', 'problem.mismatch'],
  ['no-number', 'problem.no-number'],
  ['no-prd', 'problem.no-prd'],
  ['unknown-prd', 'problem.unknown-prd'],
];

// Kinds that are worth knowing but are not a contradiction: not counted as a warning.
const INFO_KINDS = new Set(PROBLEM_KINDS.filter((k) => k[2]).map((k) => k[0]));

// ───────────────────────── Markdown ─────────────────────────
// A small renderer for what the tickets use. Every piece of source text goes
// through esc() before it becomes HTML; raw HTML in the markdown is shown as text.

const LIST_ITEM = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const lead = (l) => l.length - l.trimStart().length;
const isOrdered = (m) => /\d/.test(m[2]);
const isBlockStart = (l) => /^\s*(#{1,6}\s|```|~~~|>)/.test(l) || /^\s*([-*_])(\s*\1){2,}\s*$/.test(l);
const TABLE_RULE = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;

function splitRow(line) {
  const cells = [];
  let cur = '', code = false;
  const s = line.trim().replace(/^\|/, '').replace(/\|\s*$/, (m0, off, str) => (str[off - 1] === '\\' ? m0 : ''));
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '`') code = !code;
    if (ch === '\\' && s[i + 1] === '|') { cur += '|'; i++; continue; }
    if (ch === '|' && !code) { cells.push(cur.trim()); cur = ''; } else cur += ch;
  }
  cells.push(cur.trim());
  return cells;
}

function renderMarkdown(text, ctx) {
  return renderBlocks(text.replace(/\r\n?/g, '\n').replace(/[\u0001\u0002]/g, '').replace(/\t/g, '    ').split('\n'), ctx);
}

function renderBlocks(lines, ctx) {
  const out = [];
  let para = [];
  const flush = () => {
    if (!para.length) return;
    // A line that starts a "**Field:** value" pair keeps its own line.
    const joined = para.map((l, i) => (i && (/^\*\*[^*]+:\*\*/.test(l.trim()) || /( {2}|\\)$/.test(para[i - 1])) ? '\u0001br\u0002' : i ? ' ' : '') + l.trim().replace(/\\$/, '')).join('');
    out.push('<p>' + renderInline(joined.replace(/\u0001br\u0002/g, '\n'), ctx).replace(/\n/g, '<br>') + '</p>');
    para = [];
  };
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { flush(); i++; continue; }

    const fence = /^(\s*)(```+|~~~+)(.*)$/.exec(line);
    if (fence) {
      flush();
      const body = [];
      i++;
      while (i < lines.length && !new RegExp('^\\s*' + fence[2][0] + '{' + fence[2].length + ',}\\s*$').test(lines[i])) body.push(lines[i++].slice(Math.min(fence[1].length, lead(lines[i - 1]))));
      i++;
      out.push('<pre><code>' + esc(body.join('\n')) + '</code></pre>');
      continue;
    }
    const h = /^(#{1,6})\s+(.*?)\s*#*\s*$/.exec(line);
    if (h) { flush(); out.push(`<h${h[1].length}>${renderInline(h[2], ctx)}</h${h[1].length}>`); i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flush(); out.push('<hr>'); i++; continue; }
    if (/^\s*>/.test(line)) {
      flush();
      const body = [];
      while (i < lines.length && (/^\s*>/.test(lines[i]) || (lines[i].trim() && body.length && !isBlockStart(lines[i]) && !LIST_ITEM.test(lines[i])))) body.push(lines[i++].replace(/^\s*>\s?/, ''));
      out.push('<blockquote>' + renderBlocks(body, ctx) + '</blockquote>');
      continue;
    }
    if (line.includes('|') && i + 1 < lines.length && TABLE_RULE.test(lines[i + 1]) && lines[i + 1].includes('-') && lines[i + 1].includes('|')) {
      flush();
      const head = splitRow(line);
      const align = splitRow(lines[i + 1]).map((c) => (/^:-+:$/.test(c) ? 'center' : /-:$/.test(c) ? 'right' : ''));
      const cell = (tag, c, k) => `<${tag}${align[k] ? ` style="text-align:${align[k]}"` : ''}>${renderInline(c, ctx)}</${tag}>`;
      let html = '<div class="tw"><table><thead><tr>' + head.map((c, k) => cell('th', c, k)).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && lines[i].trim() && lines[i].includes('|')) html += '<tr>' + splitRow(lines[i++]).map((c, k) => cell('td', c, k)).join('') + '</tr>';
      out.push(html + '</tbody></table></div>');
      continue;
    }
    const li = LIST_ITEM.exec(line);
    if (li) {
      flush();
      const base = li[1].length, ordered = isOrdered(li);
      const start = ordered ? parseInt(li[2], 10) : 1;
      const items = [];
      while (i < lines.length) {
        const m = LIST_ITEM.exec(lines[i]);
        if (!m || m[1].length < base || m[1].length >= base + 2 || isOrdered(m) !== ordered) break;
        const inner = m[1].length + m[2].length + 1;
        const body = [m[3]];
        i++;
        while (i < lines.length) {
          const l = lines[i];
          if (!l.trim()) {
            let j = i + 1;
            while (j < lines.length && !lines[j].trim()) j++;
            if (j < lines.length && lead(lines[j]) >= base + 2) { body.push(''); i++; continue; }
            break;
          }
          if (lead(l) >= base + 2) { body.push(l.slice(Math.min(lead(l), inner))); i++; continue; }
          if (LIST_ITEM.test(l) || isBlockStart(l)) break;
          body.push(l.trim());
          i++;
        }
        items.push(body);
        let j = i;
        while (j < lines.length && !lines[j].trim()) j++;
        const next = j > i && j < lines.length ? LIST_ITEM.exec(lines[j]) : null;
        if (next && next[1].length >= base && next[1].length < base + 2 && isOrdered(next) === ordered) i = j;
      }
      const tag = ordered ? 'ol' : 'ul';
      out.push(`<${tag}${ordered && start !== 1 ? ` start="${start}"` : ''}>` + items.map((body) => {
        const task = /^\[( |x|X)\]\s+(.*)$/.exec(body[0]);
        if (task) body = [task[2], ...body.slice(1)];
        let html = renderBlocks(body, ctx);
        const single = /^<p>([\s\S]*?)<\/p>/.exec(html);
        if (single) html = single[1] + html.slice(single[0].length);
        if (!task) return '<li>' + html + '</li>';
        const checked = task[1] !== ' ';
        return `<li class="task${checked ? ' done' : ''}"><input type="checkbox" disabled${checked ? ' checked' : ''} aria-label="${esc(ui(checked ? 'md.done' : 'md.not-done'))}"><span class="t">${html}</span></li>`;
      }).join('') + `</${tag}>`);
      continue;
    }
    para.push(line);
    i++;
    if (i < lines.length && (isBlockStart(lines[i]) || LIST_ITEM.test(lines[i]))) flush();
  }
  flush();
  return out.join('\n');
}

function resolvePath(from, href) {
  const parts = from.split('/').slice(0, -1);
  for (const seg of href.split('/')) {
    if (seg === '..') { if (!parts.length) return null; parts.pop(); } else if (seg && seg !== '.') parts.push(seg);
  }
  return parts.join('/');
}

function renderLink(url, html, ctx) {
  if (/^(https?:|mailto:)/i.test(url)) return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${html}</a>`;
  if (/^[a-z][a-z0-9+.-]*:/i.test(url) || url.startsWith('#') || url.startsWith('//')) return html;
  let target = url.replace(/[#?].*$/, '');
  try { target = decodeURIComponent(target); } catch (e) { /* keep as written */ }
  const path = target.startsWith('/') ? target.slice(1) : resolvePath(ctx.path, target);
  if (path && ctx.model.byPath.has(path)) return `<a href="${docHref(path)}" data-doc="${esc(path)}">${html}</a>`;
  return `<span class="dead" title="${esc(ui('md.dead-link', { url }))}">${html}</span>`;
}

function emphasis(s) {
  return s
    .replace(/\*\*(?=\S)([\s\S]+?)(?<=\S)\*\*/g, '<strong>$1</strong>')
    .replace(/(?<![\w\\])__(?=\S)([\s\S]+?)(?<=\S)__(?!\w)/g, '<strong>$1</strong>')
    .replace(/\*(?=[^\s*])([^*\n]+?)(?<=\S)\*/g, '<em>$1</em>')
    .replace(/(?<![\w\\])_(?=[^\s_])([^_\n]+?)(?<=\S)_(?!\w)/g, '<em>$1</em>')
    .replace(/~~(?=\S)([^~\n]+?)(?<=\S)~~/g, '<del>$1</del>');
}

function ticketRefs(s, ctx) {
  const m = ctx.model;
  s = s.replace(/(^|[^\w&/#])#(\d{1,6})(?![\w#])/g, (all, pre, num) => {
    const t = m.resolveIssue(+num);
    return t && t.path !== ctx.path ? pre + ticketLink(t) : all;
  });
  if (m.areaRef) s = s.replace(m.areaRef, (all, pre, whole, areaName, num) => {
    const t = m.resolveLocal(areaName, +num);
    return t && t.path !== ctx.path ? pre + ticketLink(t, whole) : all;
  });
  return s;
}

function renderInline(src, ctx, noLinks) {
  const stash = [];
  const keep = (html) => '\u0001' + (stash.push(html) - 1) + '\u0002';
  let s = src;
  s = s.replace(/(`+)([\s\S]*?[^`])\1(?!`)/g, (m, ticks, code) => keep('<code>' + esc(code.trim() || code) + '</code>'));
  s = s.replace(/\\([\\`*_{}[\]()#+\-.!|>~])/g, (m, ch) => keep(esc(ch)));
  s = s.replace(/!\[([^\]]*)\]\([^)]*\)/g, (m, alt) => keep('<span class="dead">' + esc(ui('md.image', { alt: alt || ui('md.image-unnamed') })) + '</span>'));
  if (!noLinks) {
    s = s.replace(/\[([^\]\n]+)\]\(\s*<?((?:[^()\s<>]|\([^()\s]*\))+)>?(?:\s+"[^"]*")?\s*\)/g, (m, label, url) => keep(renderLink(url, renderInline(label, ctx, true), ctx)));
    s = s.replace(/<(https?:\/\/[^>\s]+)>/g, (m, url) => keep(renderLink(url, esc(url), ctx)));
    s = s.replace(/\bhttps?:\/\/[^\s<>()\u0001]*[^\s<>().,;:!?"'\u0001„”]/g, (url) => keep(renderLink(url, esc(url), ctx)));
  }
  s = emphasis(esc(s));
  if (!noLinks) s = ticketRefs(s, ctx);
  for (let guard = 0; guard < 6 && s.includes('\u0001'); guard++) s = s.replace(/\u0001(\d+)\u0002/g, (m, k) => stash[+k] ?? '');
  return s;
}

// ───────────────────────── State ─────────────────────────

const STORE_KEY = 'development-status:' + location.pathname;
// prd: only the tickets naming this PRD item (Plan's link "/?module=build&prd=<id>"), closed ones too.
const state = { view: 'waiting', doc: null, q: '', status: '', area: '', prd: '', showClosed: false, activityDays: 14 };
try { state.prd = prdFilter(location.search); } catch (e) { /* no query */ }
const openDetails = new Set();
let source = null;       // { adapter, root, name, live, roots }; from the launcher's server also { server, launcher, reload }
let cache = new Map();   // path → { size, mtime, text }
let model = null;
let changeLog = [];      // newest first: { at, items: [{ path, label, text }] }
let recent = new Map();  // path → time of the last change seen in this session
let lastChecked = null;
let busy = false;
let timer = null;
let events = null;       // the server's live updates (EventSource on /api/events)
let again = false;       // a refresh was asked for while one ran
let lostAccess = false;
let serverDown = false;
let lastOpener = null;
// The git history from the launcher: { data, error, limit, open: Set of hashes, hit }.
let gitState = { data: null, error: '', limit: GIT_PAGE, open: new Set(), hit: '' };
// The GitHub issues the server sent: the source of the GitHub tickets.
const NO_ISSUES = () => ({ fingerprint: '', repo: null, issues: [], byNumber: new Map() });
let issueState = NO_ISSUES();

try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
  for (const k of ['status', 'area', 'showClosed']) if (k in saved) state[k] = saved[k];
} catch (e) { /* storage is optional */ }
const saveState = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify({ status: state.status, area: state.area, showClosed: state.showClosed })); } catch (e) { /* optional */ } };

// The folder handle survives a reload in IndexedDB (the permission does not).
function idb(mode, run) {
  return new Promise((resolve) => {
    try {
      const open = indexedDB.open('development-status', 1);
      open.onupgradeneeded = () => open.result.createObjectStore('handles');
      open.onerror = () => resolve(null);
      open.onsuccess = () => {
        try {
          const tx = open.result.transaction('handles', mode);
          const req = run(tx.objectStore('handles'));
          tx.oncomplete = () => resolve(req ? req.result : null);
          tx.onerror = tx.onabort = () => resolve(null);
        } catch (e) { resolve(null); }
      };
    } catch (e) { resolve(null); }
  });
}
const rememberHandle = (h) => idb('readwrite', (s) => s.put(h, STORE_KEY));
const forgetHandle = () => idb('readwrite', (s) => s.delete(STORE_KEY));
const recallHandle = () => idb('readonly', (s) => s.get(STORE_KEY));

// ───────────────────────── Refresh loop ─────────────────────────

function describeChange(path, before, after) {
  if (after && after.kind === 'ticket') {
    if (!before) return { label: after.label, text: () => ui('change.new-ticket', { title: after.title, status: statusName(after.status) }) };
    const parts = [];
    if (before.status !== after.status) parts.push(() => ui('change.status', { from: statusName(before.status), to: statusName(after.status) }));
    if (before.checks.done !== after.checks.done || before.checks.total !== after.checks.total) parts.push(() => ui('change.checks', { from: `${before.checks.done}/${before.checks.total}`, to: `${after.checks.done}/${after.checks.total}` }));
    if (after.comments.length > before.comments.length) { const c = after.comments[after.comments.length - 1]; parts.push(() => ui('change.comment', { title: commentTitle(c) })); }
    if (before.title !== after.title) parts.push(() => ui('change.title', { title: after.title }));
    if (before.fields['blocked by'] !== after.fields['blocked by']) parts.push(() => 'Blocked by: ' + (after.fields['blocked by'] || ui('change.none')));
    return { label: after.label, text: () => parts.map((f) => f()).join('; ') || ui('change.text') };
  }
  const name = path.split('/').slice(-2).join('/');
  if (!after) return { label: before && before.label ? before.label : name, text: () => ui('change.deleted') };
  return { label: name, text: () => ui(before ? 'change.modified' : 'change.new-file') };
}

async function refresh() {
  if (!source) return;
  if (busy) { again = true; return; }
  busy = true;
  try {
    const listing = await scan(source);
    const seen = new Set();
    const touched = [];
    for (const e of listing.entries) {
      seen.add(e.path);
      const old = cache.get(e.path);
      if (old && old.size === e.size && old.mtime === e.mtime) continue;
      // A file caught mid-write is read again in the next round.
      try { cache.set(e.path, { size: e.size, mtime: e.mtime, text: await e.file.text() }); touched.push(e.path); } catch (err) { if (err.name === 'NotAllowedError' || err.name === 'ServerDownError') throw err; }
    }
    for (const path of [...cache.keys()]) if (!seen.has(path)) { cache.delete(path); touched.push(path); }
    touched.push(...await refreshIssues());
    await refreshMap();
    const shape = listing.trackerPath + '|' + listing.adrPath + '|' + listing.others.length + '|' + (mapState.ids ? mapState.key : '-');
    const first = !model;
    if (first || touched.length || shape !== source.shape) {
      source.shape = shape;
      const next = readTickets({
        name: source.name,
        files: { entries: cache, others: listing.others, trackerPath: listing.trackerPath, adrPath: listing.adrPath },
        github: issueState.repo ? { repo: issueState.repo, issues: issueState.issues } : null,
        mapIds: mapState.ids,
      });
      if (!first && touched.length) {
        const now = Date.now();
        const items = touched.map((path) => ({ path, ...describeChange(path, model.byPath.get(path), next.byPath.get(path)) }));
        changeLog.unshift({ at: new Date(), items });
        changeLog = changeLog.slice(0, 40);
        for (const path of touched) recent.set(path, now);
        setTimeout(() => { if (model) renderView(); }, FRESH_MS + 500);
      }
      model = next;
      renderAll();
    }
    lastChecked = new Date();
    lostAccess = false;
    serverDown = false;
    if (await refreshGit() && model) { renderTabs(); if (state.view === 'git') renderView(); }
  } catch (err) {
    // The server stopped: keep what was read, keep asking; it may come back.
    if (err && err.name === 'ServerDownError') serverDown = true;
    else if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')) lostAccess = true;
    else if (err && err.name === 'NotFoundError') source.roots = null;
    else console.error(err);
    if (!model) showStart(ui('error.read', { error: err && err.message ? err.message : err }));
  } finally {
    busy = false;
    renderLive(true);
    if (again) { again = false; refresh(); }
  }
}

// The project's GitHub issues, which the server fetches (the page never talks to GitHub);
// the paths of the tickets that changed. The server is told what the page has, and answers
// "unchanged" while the issues are the same.
async function refreshIssues() {
  if (!source || !source.server || !source.github) return [];
  const known = issueState.fingerprint ? '?known=' + encodeURIComponent(issueState.fingerprint) : '';
  let data;
  try { data = await serverJson('/issues' + known); } catch (err) { if (err.name === 'ServerDownError') throw err; return []; }
  if (data.unchanged) return [];
  const issues = data.available ? data.issues : [];
  const repo = data.available ? data.repo : null;
  const next = new Map(issues.map((i) => [i.number, JSON.stringify(i)]));
  const touched = [];
  const path = (r, n) => r + '#' + n;
  for (const [n, json] of next) if (issueState.byNumber.get(n) !== json) touched.push(path(repo, n));
  for (const n of issueState.byNumber.keys()) if (!next.has(n)) touched.push(path(issueState.repo, n));
  issueState = { fingerprint: data.fingerprint || '', repo, issues, byNumber: next };
  return touched;
}

// The ids of Plan's map (docs/product/mindmap.json), which the reader checks the tickets'
// PRD lines against. On the server Plan sends it (GET /api/plan/map, "same" while unchanged);
// from a picked folder the file is read when its size or time changed. No map (none in the
// project, Plan not running, an unreadable file): ids null, and no PRD id counts as unknown.
const MAP_PATH = 'docs/product/mindmap.json';
let mapState = { key: '', ids: null };

async function refreshMap() {
  if (!source) return;
  try {
    if (source.server) {
      const known = mapState.key ? '?v=' + encodeURIComponent(mapState.key) : '';
      const res = await fetch('/api/plan/map' + known, { cache: 'no-store' });
      const data = res.ok ? await res.json() : null;
      if (data && data.same) return;
      const ids = GroundworkTickets.mapIds(data && data.data);   // { v, data: the map }
      mapState = { key: ids && data.v ? String(data.v) : '', ids };
      return;
    }
    const A = source.adapter;
    const dir = await findChild(A, source.root, MAP_PATH.split('/').slice(0, -1).join('/'));
    const hit = dir && (await A.children(dir)).find((c) => !c.isDir && c.name === MAP_PATH.split('/').pop());
    if (!hit) { mapState = { key: '', ids: null }; return; }
    const f = await A.file(hit.node);
    const key = f.size + '@' + f.lastModified;
    if (key === mapState.key) return;
    mapState = { key, ids: GroundworkTickets.mapIds(JSON.parse(await f.text())) };
  } catch (err) {
    if (err && (err.name === 'NotAllowedError' || err.name === 'NotFoundError')) throw err;
    mapState = { key: '', ids: null };   // a map caught mid-write, or no Plan: try again next round
  }
}

// The launcher's git history; true when it changed. The server is told what
// the page has, and answers "unchanged" while no ref moved.
async function refreshGit() {
  if (!source || !source.server || !source.git) return false;
  const known = gitState.data && gitState.data.limit === gitState.limit ? '&known=' + gitState.data.fingerprint : '';
  let data;
  try { data = await serverJson('/git?limit=' + gitState.limit + known); } catch (err) { return false; }
  if (data.unchanged) return false;
  if (!data.available) {
    const error = data.error || NO_REPO;
    const changed = gitState.data !== null || gitState.error !== error;
    gitState.data = null;
    gitState.error = error;
    return changed;
  }
  gitState.data = data;
  gitState.error = '';
  return true;
}

// How the page follows the project. From the core server: its live updates (Server-Sent
// Events on /api/events) say when a markdown file, a git ref or the GitHub issues changed, and
// the page reads again; EventSource reconnects by itself, and every (re)connect reads again,
// so nothing missed meanwhile is lost. A folder chosen in the browser (file://) is read again
// every POLL_MS instead.
function startLive() {
  stopLive();
  if (!source || !source.live) return;
  if (source.server && typeof EventSource === 'function') {
    events = new EventSource('/api/events');
    events.addEventListener('hello', () => refresh());
    events.addEventListener('change', (e) => {
      let topics = [];
      try { topics = JSON.parse(e.data).topics || []; } catch (err) { /* not ours */ }
      if (topics.some((t) => t.startsWith('build.') || t === 'plan.map')) refresh();   // plan.map: the ids the PRD lines are checked against
    });
    events.addEventListener('error', () => { if (!serverDown) { serverDown = true; renderLive(false); } });
    return;
  }
  timer = setInterval(() => { if (!document.hidden) refresh(); }, POLL_MS);
}

function stopLive() {
  clearInterval(timer);
  if (events) { events.close(); events = null; }
}

async function start(src) {
  stopLive();
  source = src;
  cache = new Map();
  model = null;
  changeLog = [];
  recent = new Map();
  lostAccess = false;
  serverDown = false;
  gitState = { data: null, error: '', limit: GIT_PAGE, open: new Set(), hit: '' };
  issueState = NO_ISSUES();
  mapState = { key: '', ids: null };
  $('start-error').hidden = true;
  await refresh();
  if (model) startLive();
}

function showStart(error) {
  stopLive();
  source = null;
  model = null;
  $('app').hidden = true;
  $('live').hidden = true;
  $('start').hidden = false;
  $('project').textContent = ui('page.title');
  document.title = ui('page.title');
  closeDrawerNow();
  if (error) { $('start-error').textContent = error; $('start-error').hidden = false; }
}

// ───────────────────────── Filtering ─────────────────────────

function matches(t, ignoreClosed) {
  if (state.prd && !t.prd.includes(state.prd)) return false;
  if (state.area && t.area !== state.area) return false;
  if (state.status && t.status !== state.status) return false;
  if (state.q && !t.hay.includes(fold(state.q.trim()))) return false;
  if (!ignoreClosed && !state.showClosed && !state.status && !state.prd && isClosed(t)) return false;
  return true;
}
const visibleTickets = () => model.tickets.filter((t) => matches(t, false));

// ───────────────────────── Rendering ─────────────────────────

const docHref = (path) => '#/' + state.view + '/' + encodeURIComponent(path);
function ticketLink(t, text) {
  return `<a class="tref${isClosed(t) ? ' is-closed' : ''}" href="${docHref(t.path)}" data-doc="${esc(t.path)}" title="${esc(t.title + ' (' + statusName(t.status) + ')')}">${esc(text || t.label)}</a>`;
}
const blockerLinks = (t) => t.blockers.map((b) => (b.ticket ? ticketLink(b.ticket) : `<span class="tref is-missing" title="${esc(ui('table.no-such-ticket'))}">${esc(b.raw)}?</span>`)).join(' ');
// The PRD items a ticket came from (its "**PRD:**" line): each opens Plan focused on that map
// node (Plan's deep link, planLink in ticket-reader.js, in the whole window). Opened as a file
// (file://) there is no Plan to open: the ids show as text.
const prdLinks = (t) => t.prd.map((id) => (source && source.live
  ? `<a class="prd-ref" href="${esc(planLink(id))}" target="_top" title="${esc(ui('prd.open', { id }))}">${esc(id)}</a>`
  : `<span class="prd-ref" title="${esc(ui('prd.no-plan'))}">${esc(id)}</span>`)).join(' ');
const meter = (c) => (c.total ? `<span class="meter" title="${esc(ui('table.meter', { done: c.done, total: c.total }))}"><i style="--p:${pct(c.done, c.total)}%"></i>${c.done}/${c.total}</span>` : '<span class="muted">–</span>');

// Blocked by an open ticket, or freed: every blocker it names is closed.
const isFree = (t) => !isClosed(t) && !t.blocked && t.blockers.length > 0 && t.blockers.every((b) => b.ticket);
const flags = (t) => (t.blocked ? ` <span class="flag blocked">${ui('flag.blocked')}</span>` : isFree(t) ? ` <span class="flag free" title="${esc(ui('flag.free-title'))}">${ui('flag.free')}</span>` : '');

function ticketRow(t) {
  const fresh = recent.has(t.path) && Date.now() - recent.get(t.path) < FRESH_MS;
  const blockers = blockerLinks(t);
  const sub = [esc(t.area), t.blockers.length ? ui('table.blocked-by-sub', { list: blockers }) : '', t.lastComment ? `<span class="mono" style="white-space:nowrap">${t.lastComment}</span>` : ''].filter(Boolean).join(' · ');
  return `<tr data-doc="${esc(t.path)}"${t.blocked ? ' class="is-blocked"' : ''}>
<td class="c-num">${esc(t.label)}</td>
<td class="c-title"><a class="open" href="${docHref(t.path)}" data-doc="${esc(t.path)}">${esc(t.title)}</a>${flags(t)}${fresh ? ` <span class="flag fresh">${ui('flag.fresh')}</span>` : ''}
${t.statusNote ? `<div class="note" title="${esc(t.statusNote)}">${esc(t.statusNote)}</div>` : ''}${t.prd.length ? `<div class="prd">${ui('table.prd-sub', { list: prdLinks(t) })}</div>` : ''}<div class="sub"><span class="sub-st">${chip(t.status)}</span>${sub}</div></td>
<td class="c-area">${esc(t.area)}</td>
<td class="c-st">${chip(t.status)}</td>
<td class="c-chk">${meter(t.checks)}</td>
<td class="c-blk">${blockers || '<span class="muted">–</span>'}</td>
<td class="c-last">${t.lastComment || '–'}</td>
</tr>`;
}

function ticketTable(list) {
  if (!list.length) return `<div class="empty">${ui('table.empty')}</div>`;
  return `<div class="tablewrap"><table class="grid"><thead><tr><th class="c-num">${ui('table.num')}</th><th>${ui('table.ticket')}</th><th class="c-area">${ui('table.area')}</th><th class="c-st">${ui('table.status')}</th><th class="c-chk">${ui('table.checks')}</th><th class="c-blk">${ui('table.blocked-by')}</th><th class="c-last">${ui('table.last-comment')}</th></tr></thead><tbody>${list.map(ticketRow).join('')}</tbody></table></div>`;
}

function renderLive(ticked) {
  if (!source) return;
  $('live').hidden = false;
  const dot = $('dot');
  let text;
  $('change').hidden = !!source.server;
  if (serverDown) {
    dot.className = 'dot warn';
    text = ui('live.down', { at: lastChecked ? ' (' + clock(lastChecked) + ')' : '', launcher: source.launcher ? ' (' + source.launcher + ')' : '' });
    $('refresh').textContent = ui('live.retry');
  } else if (lostAccess) {
    dot.className = 'dot warn';
    text = ui('live.lost');
    $('refresh').textContent = ui('live.renew');
  } else if (source.live) {
    dot.className = 'dot on';
    if (ticked) { dot.classList.remove('tick'); void dot.offsetWidth; dot.classList.add('tick'); }
    text = source.server && typeof EventSource === 'function'
      ? ui('live.push', { server: ui('live.server', { host: source.server }), at: lastChecked ? clock(lastChecked) : '–' })
      : ui('live.on', { server: source.server ? ui('live.server', { host: source.server }) : '', sec: POLL_MS / 1000, at: lastChecked ? clock(lastChecked) : '–' });
    $('refresh').textContent = ui('live.refresh');
  } else {
    dot.className = 'dot';
    text = ui('live.snapshot', { at: lastChecked ? clock(lastChecked) : '–' });
    $('refresh').textContent = ui('live.reread');
  }
  $('live-text').textContent = text;
  renderVersion();
}

function renderVersion() {
  // Groundwork's version, from the server; opened by double click there is none to show.
  const version = source && source.server ? source.version : '';
  $('ver').textContent = version ? `v${version}` : '';
  $('ver').hidden = !version;
  $('ver').title = version ? `Groundwork ${version}` : '';
}

function renderOverview() {
  const m = model;
  const total = m.tickets.length, open = m.open.length;
  const statuses = [...m.statusCounts.entries()].sort((a, b) => CLOSED.has(a[0]) - CLOSED.has(b[0]) || b[1] - a[1]);
  const statusButton = ([s, n]) => `<button type="button" class="chip t-${statusTone(s)}${CLOSED.has(s) ? ' closed' : ''}" data-status="${esc(s)}" aria-pressed="${state.status === s}" title="${esc(ui('overview.filter-status'))}">${esc(statusName(s))} <b>${n}</b></button>`;
  const openChips = statuses.filter(([s]) => !CLOSED.has(s)).map(statusButton).join('');
  const closedChips = statuses.filter(([s]) => CLOSED.has(s)).map(statusButton).join('');
  // The bar reads as progress: the closed part first, then the open states.
  const barOrder = [...statuses.filter(([s]) => CLOSED.has(s)), ...statuses.filter(([s]) => !CLOSED.has(s))];
  const stack = barOrder.map(([s, n]) => `<span class="t-${statusTone(s)}${CLOSED.has(s) ? ' closed' : ''}" style="flex:${n}" title="${esc(statusName(s))}: ${n}"></span>`).join('');
  const blocked = m.open.filter((t) => t.blocked).length;
  const inGroup = (id) => m.open.filter((t) => GROUPS.find((g) => g.id === id).has(t.status));
  const agentAll = inGroup('agent');
  const agentFree = agentAll.filter((t) => !t.blocked).length;
  const human = inGroup('human').length;
  const done = total - open;
  const kpi = (tone, value, key, sub, extra = '') => `<div class="kpi${tone ? ' t-' + tone : ''}${value === 0 || value === '0' ? ' zero' : ''}${extra}"><span class="v">${value}</span><span class="k">${key}</span>${sub ? `<span class="s">${sub}</span>` : ''}</div>`;

  let changes;
  if (!changeLog.length) {
    changes = ui(source.live ? 'overview.no-changes' : 'overview.no-changes-snapshot');
    changes = `<div class="changes">${changes}</div>`;
  } else {
    const item = (it) => `<li>${m.byPath.has(it.path) ? `<a href="${docHref(it.path)}" data-doc="${esc(it.path)}"><b>${esc(it.label)}</b></a>` : `<b>${esc(it.label)}</b>`}: ${esc(it.text())}</li>`;
    const [latest, ...older] = changeLog;
    changes = `<details class="changes" data-key="changes"${openDetails.has('changes') ? ' open' : ''}><summary>${ui('overview.latest-change', { time: clock(latest.at) })} ${latest.items.slice(0, 3).map((it) => `<b>${esc(it.label)}</b> ${esc(it.text())}`).join('; ')}${latest.items.length > 3 ? ui('overview.and-more', { n: latest.items.length - 3 }) : ''}</summary>
<ul>${latest.items.map(item).join('')}</ul>${older.map((b) => `<div style="margin-top:6px">${clock(b.at)}</div><ul>${b.items.map(item).join('')}</ul>`).join('')}</details>`;
  }

  $('overview').innerHTML = `
<div class="kpis">
${kpi('', open, ui('kpi.open'), ui('kpi.open-sub', { total, areas: m.areaList.length, adrs: m.adrs.length }), ' main')}
${kpi('agent', agentFree, ui('kpi.agent'), agentAll.length > agentFree ? ui('kpi.agent-sub-blocked', { n: agentAll.length - agentFree }) : ui('kpi.agent-sub'))}
${kpi('human', human, ui('kpi.human'), 'ready-for-human, needs-info, needs-triage')}
${kpi('bad', blocked, ui('kpi.blocked'), ui('kpi.blocked-sub'))}
${kpi('done', total ? pct(done, total) + '<small>%</small>' : '–', ui('kpi.done'), ui('kpi.done-sub', { n: done }))}
</div>
${total ? `<div class="progress"><div class="head"><span><b>${ui('overview.progress')}</b></span><span>${ui('overview.closed', { done, total })}${blocked ? ui('overview.blocked', { n: blocked }) : ''}</span></div>
<div class="stack" role="img" aria-label="${esc(ui('overview.bar-label', { open, done }))}">${stack}</div>
<div class="chips">${closedChips}${openChips && closedChips ? '<span class="sep"></span>' : ''}${openChips}</div></div>` : ''}
${m.trackerPath == null && !m.repo ? `<div class="notice">${ui('overview.no-tracker', { dir: esc(DEFAULT_TRACKER_DIR) })}${source.live ? '' : ' ' + ui('overview.no-tracker-snapshot', { dir: esc(DEFAULT_TRACKER_DIR) })}</div>` : ''}
${changes}`;
}

function renderTabs() {
  $('tabs').innerHTML = VIEWS.map(([id, label]) => {
    let badge = '';
    if (id === 'waiting') badge = `<span class="badge">${model.open.length}</span>`;
    const real = model.problems.filter((p) => !INFO_KINDS.has(p.kind)).length;
    if (id === 'git' && gitState.data) badge = `<span class="badge">${gitState.data.refs.filter((r) => r.kind === 'branch').length}</span>`;
    if (id === 'checks' && real) badge = `<span class="badge warn">${real}</span>`;
    else if (id === 'checks' && model.problems.length) badge = `<span class="badge">${model.problems.length}</span>`;
    return `<a href="#/${id}"${state.view === id ? ' aria-current="page"' : ''}>${ui(label)}${badge}</a>`;
  }).join('');
  // On a narrow screen the tabs scroll sideways: keep the current one in sight.
  const nav = $('tabs'), cur = nav.querySelector('[aria-current]');
  if (cur && (cur.offsetLeft < nav.scrollLeft || cur.offsetLeft + cur.offsetWidth > nav.scrollLeft + nav.clientWidth)) nav.scrollLeft = cur.offsetLeft - 16;
}

function renderFilters() {
  const m = model;
  if (state.status && !m.statusCounts.has(state.status)) state.status = '';
  if (state.area && !m.areas.has(state.area)) state.area = '';
  const statuses = [...m.statusCounts.keys()].sort((a, b) => CLOSED.has(a) - CLOSED.has(b) || a.localeCompare(b));
  $('f-status').innerHTML = `<option value="">${ui('filter.all-statuses')}</option>` + statuses.map((s) => `<option value="${esc(s)}"${s === state.status ? ' selected' : ''}>${esc(statusName(s))} (${m.statusCounts.get(s)})</option>`).join('');
  const areas = [...m.areas.values()].filter((a) => a.name).sort((a, b) => a.name.localeCompare(b.name));
  $('f-area').innerHTML = `<option value="">${ui('filter.all-areas')}</option>` + areas.map((a) => `<option value="${esc(a.name)}"${a.name === state.area ? ' selected' : ''}>${esc(a.name)} (${a.open}/${a.tickets.length})</option>`).join('');
  $('f-closed').checked = state.showClosed;
  if ($('q').value !== state.q) $('q').value = state.q;
}

function renderSummary() {
  const shown = visibleTickets().length;
  const hidden = model.tickets.filter((t) => matches(t, true)).length - shown;
  const prd = state.prd ? `<span class="prd-filter">${ui('filter.prd', { id: `<span class="prd-ref">${esc(state.prd)}</span>` })} <button type="button" class="quiet" data-act="clear-prd" title="${esc(ui('filter.prd-clear'))}" aria-label="${esc(ui('filter.prd-clear'))}">×</button></span> · ` : '';
  $('f-summary').innerHTML = prd + ui('filter.shown', { n: shown }) + (hidden ? ` · ${ui('filter.hidden', { n: hidden })} <button type="button" class="quiet" data-act="show-closed">${ui('filter.show')}</button>` : '') + (state.q || state.status || state.area || state.prd ? ` <button type="button" class="quiet" data-act="clear">${ui('filter.clear')}</button>` : '');
}

const VIEW_RENDERERS = {
  waiting() {
    const list = visibleTickets();
    const used = new Set();
    const section = (title, hint, items, always) => {
      items.forEach((t) => used.add(t));
      if (!items.length && !always) return '';
      items = [...items].sort((a, b) => a.blocked - b.blocked);
      const blocked = items.filter((t) => t.blocked).length;
      return `<section class="group"><h2>${esc(title)} <span class="count">${items.length}</span>${blocked ? `<span class="flag blocked">${ui('flag.blocked-n', { n: blocked })}</span>` : ''}<span class="hint">${esc(hint)}</span></h2>${ticketTable(items)}</section>`;
    };
    let html = GROUPS.map((g) => section(ui(g.title), ui(g.hint), list.filter((t) => g.has(t.status)), g.id === 'agent' || g.id === 'human')).join('');
    const rest = list.filter((t) => !used.has(t) && !isClosed(t) && t.status !== UNPARSED);
    for (const s of [...new Set(rest.map((t) => t.status))].sort()) html += section(s, ui('group.unknown.hint'), rest.filter((t) => t.status === s));
    html += section(ui('group.unparsed'), ui('group.unparsed.hint'), list.filter((t) => t.status === UNPARSED));
    html += section(ui('group.closed'), [...CLOSED].join(', '), list.filter(isClosed));
    return html;
  },

  areas() {
    const q = fold(state.q.trim());
    const rows = model.areaList.filter((a) => (!state.area || a.name === state.area)).map((a) => {
      const tickets = a.tickets.filter((t) => matches(t, false));
      if ((q || state.status) && !tickets.length && !(q && !state.status && fold(a.name + ' ' + (a.spec ? a.spec.title : '')).includes(q))) return '';
      const key = 'area:' + a.name;
      const docs = a.docs.map((d) => `<li><span class="kind">${esc(d.rel.split('/').length > 1 ? d.rel.split('/')[0] : 'md')}</span><a href="${docHref(d.path)}" data-doc="${esc(d.path)}">${esc(d.title)}</a><span class="path">${esc(d.rel)}</span></li>`).join('');
      return `<details class="area" data-key="${esc(key)}"${openDetails.has(key) ? ' open' : ''}>
<summary><span class="name">${esc(a.name || ui('area.root'))}</span>
<span class="spec">${a.spec ? '<span class="kind">spec</span>' + esc(a.spec.title) : `<i>${ui('area.no-spec')}</i>`}</span>
<span class="bar2${a.tickets.length ? '' : ' none'}" title="${esc(ui('area.bar-title', { closed: a.closed, total: a.tickets.length }))}"><i style="--p:${pct(a.closed, a.tickets.length)}%"></i></span>
<span class="cnt">${a.tickets.length ? ui('area.count', { open: `<b>${a.open}</b>`, closed: a.closed }) : ui('area.no-tickets')}</span></summary>
<div class="inner"><ul class="doclist">
${a.spec ? `<li><span class="kind">spec</span><a href="${docHref(a.spec.path)}" data-doc="${esc(a.spec.path)}">${esc(a.spec.title)}</a><span class="path">${esc(a.spec.rel)}</span></li>` : ''}
${docs}${a.extras ? `<li class="muted"><span class="kind">${ui('area.other')}</span>${ui('area.extras', { n: a.extras })}</li>` : ''}</ul>
${a.tickets.length ? ticketTable(tickets) : ''}${tickets.length < a.tickets.length ? `<p class="muted">${ui('area.hidden', { n: a.tickets.length - tickets.length })}</p>` : ''}</div></details>`;
    }).join('');
    return `<p class="lead">${ui('area.lead')}</p>${rows || `<div class="empty">${ui('area.empty')}</div>`}`;
  },

  deps() {
    const visible = new Set(visibleTickets());
    // The closed blockers of the visible tickets stay in the picture, dimmed:
    // they show what has already been unlocked.
    const nodes = new Set(visible);
    for (const t of visible) for (const b of t.blockers) if (b.ticket && !visible.has(b.ticket) && matches(b.ticket, true)) nodes.add(b.ticket);
    const children = (t) => t.dependents.filter((d) => nodes.has(d));
    const parents = (t) => t.blockers.map((b) => b.ticket).filter((b) => b && nodes.has(b));
    const linked = [...nodes].filter((t) => children(t).length || parents(t).length);
    const placed = new Set();
    const node = (t, path) => {
      placed.add(t);
      const loop = path.includes(t);
      const kids = loop ? [] : children(t);
      const others = parents(t).filter((p) => p !== path[path.length - 1]);
      const ctx = !visible.has(t);
      return `<li><div class="node${ctx ? ' ctx' : ''}">${ticketLink(t)} <a class="ttl" href="${docHref(t.path)}" data-doc="${esc(t.path)}" style="color:inherit">${esc(t.title)}</a> ${chip(t.status)}${flags(t)}${loop ? ` <span class="flag blocked">${ui('deps.loop')}</span>` : ''}${path.length && others.length ? `<span class="rel">${ui('deps.also-waits', { list: others.map((p) => ticketLink(p)).join(' ') })}</span>` : ''}</div>${kids.length ? `<span class="unlocks">${ui('deps.unlocks')}</span><ul>${kids.map((k) => node(k, [...path, t])).join('')}</ul>` : ''}</li>`;
    };
    let html = '';
    for (const t of linked) if (!parents(t).length) html += node(t, []);
    for (const t of linked) if (!placed.has(t)) html += node(t, []);
    const waiting = linked.filter((t) => visible.has(t) && t.blocked).length;
    const free = linked.filter((t) => visible.has(t) && isFree(t)).length;
    const legend = html ? `<div class="legend"><span><span class="flag blocked">${ui('flag.blocked')}</span> ${ui('deps.legend-blocked')}</span><span><span class="flag free">${ui('flag.free')}</span> ${ui('deps.legend-free')}</span><span class="muted">${ui('deps.legend-dim')}</span></div>` : '';
    return `<p class="lead">${ui('deps.lead')} ${state.showClosed || state.status ? '' : ui('deps.lead-closed') + ' '}${waiting ? ui('deps.waiting', { n: waiting }) : ui('deps.none-waiting')}${free ? ' ' + ui('deps.free', { n: free }) : ''}</p>${legend}${html ? `<ul class="tree">${html}</ul>` : `<div class="empty">${ui('deps.empty')}</div>`}`;
  },

  activity() {
    const days = new Map();
    for (const c of model.comments) {
      if (!matches(c.ticket, true)) continue;
      if (!days.has(c.date)) days.set(c.date, new Map());
      const byTicket = days.get(c.date);
      if (!byTicket.has(c.ticket)) byTicket.set(c.ticket, []);
      byTicket.get(c.ticket).push(c);
    }
    const all = [...days.entries()];
    const html = all.slice(0, state.activityDays).map(([date, byTicket]) => `<section class="day"><h3>${date} <span class="muted">· ${ui('activity.tickets', { n: byTicket.size })}</span></h3><ul>${[...byTicket.entries()].map(([t, list]) => `<li><div class="node">${ticketLink(t)} <a class="ttl" href="${docHref(t.path)}" data-doc="${esc(t.path)}" style="color:inherit">${esc(t.title)}</a> ${chip(t.status)} <span class="rel">${esc(t.area)}</span></div><div class="notes">${list.map((c) => `<div>${esc(commentTitle(c))}</div>`).join('')}</div></li>`).join('')}</ul></section>`).join('');
    return `<p class="lead">${ui('activity.lead')}</p>${html || `<div class="empty">${ui('activity.empty')}</div>`}${all.length > state.activityDays ? `<button type="button" data-act="more-days">${ui('activity.more', { n: all.length - state.activityDays })}</button>` : ''}`;
  },

  checks() {
    const q = fold(state.q.trim());
    const list = model.problems.filter((p) => p.tickets.some((t) => (!state.area || t.area === state.area) && (!q || t.hay.includes(q))));
    const html = PROBLEM_KINDS.map(([kind, title, info]) => {
      const items = list.filter((p) => p.kind === kind);
      if (!items.length) return '';
      const openOnes = items.filter((p) => p.tickets.some((t) => !isClosed(t))).length;
      return `<section class="group${info ? ' info' : ''}"><h2>${ui(title)} <span class="count">${items.length}</span><span class="hint">${info ? ui('checks.info') + ' · ' : ''}${ui('checks.affects', { n: openOnes })}</span></h2><div class="tablewrap"><table class="grid"><thead><tr><th>${ui('table.ticket')}</th><th class="c-st">${ui('table.status')}</th><th>${ui('checks.problem')}</th></tr></thead><tbody>${items.map((p) => `<tr><td class="c-title">${p.tickets.map((t) => `${ticketLink(t)} <a class="open" href="${docHref(t.path)}" data-doc="${esc(t.path)}">${esc(t.title)}</a><div class="note">${esc(t.path)}</div>`).join('')}</td><td class="c-st">${p.tickets.map((t) => chip(t.status)).join('<br>')}</td><td>${esc(ui(p.key, p.params))}</td></tr>`).join('')}</tbody></table></div></section>`;
    }).join('');
    return `<p class="lead">${ui('checks.lead')}</p>${html || `<div class="empty">${ui('checks.empty')}</div>`}`;
  },

  git: renderGitView,

  docs() {
    const q = fold(state.q.trim());
    const ok = (d) => (!state.area || d.area === state.area) && (!q || d.hay.includes(q));
    const link = (d) => `<a class="open" href="${docHref(d.path)}" data-doc="${esc(d.path)}">${esc(d.title)}</a>`;
    const table = (head, rows) => (rows.length ? `<div class="tablewrap"><table class="grid"><thead><tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>` : `<div class="empty">${ui('docs.empty')}</div>`);
    const specs = model.docs.filter((d) => d.kind === 'spec' && ok(d));
    const other = model.docs.filter((d) => d.kind === 'doc' && ok(d));
    const adrs = state.area ? [] : model.adrs.filter((d) => !q || d.hay.includes(q));
    const row = (d) => `<tr data-doc="${esc(d.path)}"><td class="c-area">${esc(d.area || '–')}</td><td class="c-title">${link(d)}<div class="note">${esc(d.path)}</div></td></tr>`;
    const own = state.area ? [] : [model.readme, ...model.glossaries].filter((d) => d && (!q || d.hay.includes(q)));
    return `${own.length ? `<section class="group"><h2>${ui('docs.own')}<span class="hint">${ui('docs.own.hint')}</span></h2>${table([ui('docs.file'), ui('docs.title')], own.map((d) => `<tr data-doc="${esc(d.path)}"><td class="c-area"><span class="kind">${ui(d.kind === 'readme' ? 'docs.readme' : 'docs.glossary')}</span>${esc(d.path)}</td><td class="c-title">${link(d)}</td></tr>`))}</section>` : ''}
<section class="group"><h2>${ui('docs.other')} <span class="count">${other.length}</span><span class="hint">${ui('docs.other.hint')}</span></h2>${table([ui('table.area'), ui('docs.document')], other.map(row))}</section>
