        const now = Date.now();
        const items = touched.map((path) => ({ path, ...describeChange(path, model.byPath.get(path), next.byPath.get(path)) }));
        changeLog.unshift({ at: new Date(), items });
        changeLog = changeLog.slice(0, 40);
        for (const path of touched) recent.set(path, now);
        setTimeout(() => { if (model) renderView(); }, FRESH_MS + 500);
      }
      model = next;
      renderAll();
    }
    lastChecked = new Date();
    lostAccess = false;
    serverDown = false;
    if (await refreshGit() && model) { renderTabs(); if (state.view === 'git') renderView(); }
  } catch (err) {
    // The server stopped: keep what was read, keep asking; it may come back.
    if (err && err.name === 'ServerDownError') serverDown = true;
    else if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')) lostAccess = true;
    else if (err && err.name === 'NotFoundError') source.roots = null;
    else console.error(err);
    if (!model) showStart(ui('error.read', { error: err && err.message ? err.message : err }));
  } finally {
    busy = false;
    renderLive(true);
  }
}

// The launcher's git history; true when it changed. The server is told what
// the page has, and answers "unchanged" while no ref moved.
async function refreshGit() {
  if (!source || !source.server || !source.git) return false;
  const known = gitState.data && gitState.data.limit === gitState.limit ? '&known=' + gitState.data.fingerprint : '';
  let data;
  try { data = await serverJson('/git?limit=' + gitState.limit + known); } catch (err) { return false; }
  if (data.unchanged) return false;
  if (!data.available) {
    const error = data.error || NO_REPO;
    const changed = gitState.data !== null || gitState.error !== error;
    gitState.data = null;
    gitState.error = error;
    return changed;
  }
  gitState.data = data;
  gitState.error = '';
  return true;
}

function startPolling() {
  clearInterval(timer);
  if (source && source.live) timer = setInterval(() => { if (!document.hidden) refresh(); }, POLL_MS);
}

async function start(src) {
  clearInterval(timer);
  source = src;
  cache = new Map();
  model = null;
  changeLog = [];
  recent = new Map();
  lostAccess = false;
  serverDown = false;
  gitState = { data: null, error: '', limit: GIT_PAGE, open: new Set(), hit: '' };
  $('start-error').hidden = true;
  await refresh();
  if (model) startPolling();
}

function showStart(error) {
  clearInterval(timer);
  source = null;
  model = null;
  $('app').hidden = true;
  $('live').hidden = true;
  $('start').hidden = false;
  $('project').textContent = ui('page.title');
  document.title = ui('page.title');
  closeDrawerNow();
  if (error) { $('start-error').textContent = error; $('start-error').hidden = false; }
}

// ───────────────────────── Filtering ─────────────────────────

function matches(t, ignoreClosed) {
  if (state.area && t.area !== state.area) return false;
  if (state.status && t.status !== state.status) return false;
  if (state.q && !t.hay.includes(fold(state.q.trim()))) return false;
  if (!ignoreClosed && !state.showClosed && !state.status && isClosed(t)) return false;
  return true;
}
const visibleTickets = () => model.tickets.filter((t) => matches(t, false));

// ───────────────────────── Rendering ─────────────────────────

const docHref = (path) => '#/' + state.view + '/' + encodeURIComponent(path);
function ticketLink(t, text) {
  return `<a class="tref${isClosed(t) ? ' is-closed' : ''}" href="${docHref(t.path)}" data-doc="${esc(t.path)}" title="${esc(t.title + ' (' + statusName(t.status) + ')')}">${esc(text || t.label)}</a>`;
}
const blockerLinks = (t) => t.blockers.map((b) => (b.ticket ? ticketLink(b.ticket) : `<span class="tref is-missing" title="${esc(ui('table.no-such-ticket'))}">${esc(b.raw)}?</span>`)).join(' ');
const meter = (c) => (c.total ? `<span class="meter" title="${esc(ui('table.meter', { done: c.done, total: c.total }))}"><i style="--p:${pct(c.done, c.total)}%"></i>${c.done}/${c.total}</span>` : '<span class="muted">–</span>');

// Blocked by an open ticket, or freed: every blocker it names is closed.
const isFree = (t) => !isClosed(t) && !t.blocked && t.blockers.length > 0 && t.blockers.every((b) => b.ticket);
const flags = (t) => (t.blocked ? ` <span class="flag blocked">${ui('flag.blocked')}</span>` : isFree(t) ? ` <span class="flag free" title="${esc(ui('flag.free-title'))}">${ui('flag.free')}</span>` : '');

function ticketRow(t) {
  const fresh = recent.has(t.path) && Date.now() - recent.get(t.path) < FRESH_MS;
  const blockers = blockerLinks(t);
  const sub = [esc(t.area), t.blockers.length ? ui('table.blocked-by-sub', { list: blockers }) : '', t.lastComment ? `<span class="mono" style="white-space:nowrap">${t.lastComment}</span>` : ''].filter(Boolean).join(' · ');
  return `<tr data-doc="${esc(t.path)}"${t.blocked ? ' class="is-blocked"' : ''}>
<td class="c-num">${esc(t.label)}</td>
<td class="c-title"><a class="open" href="${docHref(t.path)}" data-doc="${esc(t.path)}">${esc(t.title)}</a>${flags(t)}${fresh ? ` <span class="flag fresh">${ui('flag.fresh')}</span>` : ''}
${t.statusNote ? `<div class="note" title="${esc(t.statusNote)}">${esc(t.statusNote)}</div>` : ''}<div class="sub"><span class="sub-st">${chip(t.status)}</span>${sub}</div></td>
<td class="c-area">${esc(t.area)}</td>
<td class="c-st">${chip(t.status)}</td>
<td class="c-chk">${meter(t.checks)}</td>
<td class="c-blk">${blockers || '<span class="muted">–</span>'}</td>
<td class="c-last">${t.lastComment || '–'}</td>
</tr>`;
}

function ticketTable(list) {
  if (!list.length) return `<div class="empty">${ui('table.empty')}</div>`;
  return `<div class="tablewrap"><table class="grid"><thead><tr><th class="c-num">${ui('table.num')}</th><th>${ui('table.ticket')}</th><th class="c-area">${ui('table.area')}</th><th class="c-st">${ui('table.status')}</th><th class="c-chk">${ui('table.checks')}</th><th class="c-blk">${ui('table.blocked-by')}</th><th class="c-last">${ui('table.last-comment')}</th></tr></thead><tbody>${list.map(ticketRow).join('')}</tbody></table></div>`;
}

function renderLive(ticked) {
  if (!source) return;
  $('live').hidden = false;
  const dot = $('dot');
  let text;
  $('change').hidden = !!source.server;
  if (serverDown) {
    dot.className = 'dot warn';
    text = ui('live.down', { at: lastChecked ? ' (' + clock(lastChecked) + ')' : '', launcher: source.launcher ? ' (' + source.launcher + ')' : '' });
    $('refresh').textContent = ui('live.retry');
  } else if (lostAccess) {
    dot.className = 'dot warn';
    text = ui('live.lost');
    $('refresh').textContent = ui('live.renew');
  } else if (source.live) {
    dot.className = 'dot on';
    if (ticked) { dot.classList.remove('tick'); void dot.offsetWidth; dot.classList.add('tick'); }
    text = ui('live.on', { server: source.server ? ui('live.server', { host: source.server }) : '', sec: POLL_MS / 1000, at: lastChecked ? clock(lastChecked) : '–' });
    $('refresh').textContent = ui('live.refresh');
  } else {
    dot.className = 'dot';
    text = ui('live.snapshot', { at: lastChecked ? clock(lastChecked) : '–' });
    $('refresh').textContent = ui('live.reread');
  }
  $('live-text').textContent = text;
  renderVersion();
}

function renderVersion() {
  const other = source && source.server && source.version !== VERSION ? source.version || ui('ver.older') : '';
  $('ver').textContent = other ? ui('ver.mismatch', { version: VERSION, other }) : `v${VERSION}`;
  $('ver').className = 'ver' + (other ? ' warn' : '');
  $('ver').title = other
    ? ui('ver.mismatch-title', { version: VERSION, other })
    : `development-status ${VERSION}`;
}

function renderOverview() {
  const m = model;
  const total = m.tickets.length, open = m.open.length;
  const statuses = [...m.statusCounts.entries()].sort((a, b) => CLOSED.has(a[0]) - CLOSED.has(b[0]) || b[1] - a[1]);
  const statusButton = ([s, n]) => `<button type="button" class="chip t-${statusTone(s)}${CLOSED.has(s) ? ' closed' : ''}" data-status="${esc(s)}" aria-pressed="${state.status === s}" title="${esc(ui('overview.filter-status'))}">${esc(statusName(s))} <b>${n}</b></button>`;
  const openChips = statuses.filter(([s]) => !CLOSED.has(s)).map(statusButton).join('');
  const closedChips = statuses.filter(([s]) => CLOSED.has(s)).map(statusButton).join('');
  // The bar reads as progress: the closed part first, then the open states.
  const barOrder = [...statuses.filter(([s]) => CLOSED.has(s)), ...statuses.filter(([s]) => !CLOSED.has(s))];
  const stack = barOrder.map(([s, n]) => `<span class="t-${statusTone(s)}${CLOSED.has(s) ? ' closed' : ''}" style="flex:${n}" title="${esc(statusName(s))}: ${n}"></span>`).join('');
  const blocked = m.open.filter((t) => t.blocked).length;
  const inGroup = (id) => m.open.filter((t) => GROUPS.find((g) => g.id === id).has(t.status));
  const agentAll = inGroup('agent');
  const agentFree = agentAll.filter((t) => !t.blocked).length;
  const human = inGroup('human').length;
  const done = total - open;
  const kpi = (tone, value, key, sub, extra = '') => `<div class="kpi${tone ? ' t-' + tone : ''}${value === 0 || value === '0' ? ' zero' : ''}${extra}"><span class="v">${value}</span><span class="k">${key}</span>${sub ? `<span class="s">${sub}</span>` : ''}</div>`;

  let changes;
  if (!changeLog.length) {
    changes = ui(source.live ? 'overview.no-changes' : 'overview.no-changes-snapshot');
    changes = `<div class="changes">${changes}</div>`;
  } else {
    const item = (it) => `<li>${m.byPath.has(it.path) ? `<a href="${docHref(it.path)}" data-doc="${esc(it.path)}"><b>${esc(it.label)}</b></a>` : `<b>${esc(it.label)}</b>`}: ${esc(it.text())}</li>`;
    const [latest, ...older] = changeLog;
    changes = `<details class="changes" data-key="changes"${openDetails.has('changes') ? ' open' : ''}><summary>${ui('overview.latest-change', { time: clock(latest.at) })} ${latest.items.slice(0, 3).map((it) => `<b>${esc(it.label)}</b> ${esc(it.text())}`).join('; ')}${latest.items.length > 3 ? ui('overview.and-more', { n: latest.items.length - 3 }) : ''}</summary>
<ul>${latest.items.map(item).join('')}</ul>${older.map((b) => `<div style="margin-top:6px">${clock(b.at)}</div><ul>${b.items.map(item).join('')}</ul>`).join('')}</details>`;
  }

  $('overview').innerHTML = `
<div class="kpis">
${kpi('', open, ui('kpi.open'), ui('kpi.open-sub', { total, areas: m.areaList.length, adrs: m.adrs.length }), ' main')}
${kpi('agent', agentFree, ui('kpi.agent'), agentAll.length > agentFree ? ui('kpi.agent-sub-blocked', { n: agentAll.length - agentFree }) : ui('kpi.agent-sub'))}
${kpi('human', human, ui('kpi.human'), 'ready-for-human, needs-info, needs-triage')}
${kpi('bad', blocked, ui('kpi.blocked'), ui('kpi.blocked-sub'))}
${kpi('done', total ? pct(done, total) + '<small>%</small>' : '–', ui('kpi.done'), ui('kpi.done-sub', { n: done }))}
</div>
${total ? `<div class="progress"><div class="head"><span><b>${ui('overview.progress')}</b></span><span>${ui('overview.closed', { done, total })}${blocked ? ui('overview.blocked', { n: blocked }) : ''}</span></div>
<div class="stack" role="img" aria-label="${esc(ui('overview.bar-label', { open, done }))}">${stack}</div>
<div class="chips">${closedChips}${openChips && closedChips ? '<span class="sep"></span>' : ''}${openChips}</div></div>` : ''}
${m.trackerPath == null ? `<div class="notice">${ui('overview.no-tracker', { dir: esc(DEFAULT_TRACKER_DIR) })}${source.live ? '' : ' ' + ui('overview.no-tracker-snapshot', { dir: esc(DEFAULT_TRACKER_DIR) })}</div>` : ''}
${changes}`;
}

function renderTabs() {
  $('tabs').innerHTML = VIEWS.map(([id, label]) => {
    let badge = '';
    if (id === 'waiting') badge = `<span class="badge">${model.open.length}</span>`;
    const real = model.problems.filter((p) => !INFO_KINDS.has(p.kind)).length;
    if (id === 'git' && gitState.data) badge = `<span class="badge">${gitState.data.refs.filter((r) => r.kind === 'branch').length}</span>`;
    if (id === 'checks' && real) badge = `<span class="badge warn">${real}</span>`;
    else if (id === 'checks' && model.problems.length) badge = `<span class="badge">${model.problems.length}</span>`;
    return `<a href="#/${id}"${state.view === id ? ' aria-current="page"' : ''}>${ui(label)}${badge}</a>`;
  }).join('');
  // On a narrow screen the tabs scroll sideways: keep the current one in sight.
  const nav = $('tabs'), cur = nav.querySelector('[aria-current]');
  if (cur && (cur.offsetLeft < nav.scrollLeft || cur.offsetLeft + cur.offsetWidth > nav.scrollLeft + nav.clientWidth)) nav.scrollLeft = cur.offsetLeft - 16;
}

function renderFilters() {
  const m = model;
  if (state.status && !m.statusCounts.has(state.status)) state.status = '';
  if (state.area && !m.areas.has(state.area)) state.area = '';
  const statuses = [...m.statusCounts.keys()].sort((a, b) => CLOSED.has(a) - CLOSED.has(b) || a.localeCompare(b));
  $('f-status').innerHTML = `<option value="">${ui('filter.all-statuses')}</option>` + statuses.map((s) => `<option value="${esc(s)}"${s === state.status ? ' selected' : ''}>${esc(statusName(s))} (${m.statusCounts.get(s)})</option>`).join('');
  const areas = [...m.areas.values()].filter((a) => a.name).sort((a, b) => a.name.localeCompare(b.name));
  $('f-area').innerHTML = `<option value="">${ui('filter.all-areas')}</option>` + areas.map((a) => `<option value="${esc(a.name)}"${a.name === state.area ? ' selected' : ''}>${esc(a.name)} (${a.open}/${a.tickets.length})</option>`).join('');
  $('f-closed').checked = state.showClosed;
  if ($('q').value !== state.q) $('q').value = state.q;
}

function renderSummary() {
  const shown = visibleTickets().length;
  const hidden = model.tickets.filter((t) => matches(t, true)).length - shown;
  $('f-summary').innerHTML = ui('filter.shown', { n: shown }) + (hidden ? ` · ${ui('filter.hidden', { n: hidden })} <button type="button" class="quiet" data-act="show-closed">${ui('filter.show')}</button>` : '') + (state.q || state.status || state.area ? ` <button type="button" class="quiet" data-act="clear">${ui('filter.clear')}</button>` : '');
}

const VIEW_RENDERERS = {
  waiting() {
    const list = visibleTickets();
    const used = new Set();
    const section = (title, hint, items, always) => {
      items.forEach((t) => used.add(t));
      if (!items.length && !always) return '';
      items = [...items].sort((a, b) => a.blocked - b.blocked);
      const blocked = items.filter((t) => t.blocked).length;
      return `<section class="group"><h2>${esc(title)} <span class="count">${items.length}</span>${blocked ? `<span class="flag blocked">${ui('flag.blocked-n', { n: blocked })}</span>` : ''}<span class="hint">${esc(hint)}</span></h2>${ticketTable(items)}</section>`;
    };
    let html = GROUPS.map((g) => section(ui(g.title), ui(g.hint), list.filter((t) => g.has(t.status)), g.id === 'agent' || g.id === 'human')).join('');
    const rest = list.filter((t) => !used.has(t) && !isClosed(t) && t.status !== UNPARSED);
    for (const s of [...new Set(rest.map((t) => t.status))].sort()) html += section(s, ui('group.unknown.hint'), rest.filter((t) => t.status === s));
    html += section(ui('group.unparsed'), ui('group.unparsed.hint'), list.filter((t) => t.status === UNPARSED));
    html += section(ui('group.closed'), [...CLOSED].join(', '), list.filter(isClosed));
    return html;
  },

  areas() {
    const q = fold(state.q.trim());
    const rows = model.areaList.filter((a) => (!state.area || a.name === state.area)).map((a) => {
      const tickets = a.tickets.filter((t) => matches(t, false));
      if ((q || state.status) && !tickets.length && !(q && !state.status && fold(a.name + ' ' + (a.spec ? a.spec.title : '')).includes(q))) return '';
      const key = 'area:' + a.name;
      const docs = a.docs.map((d) => `<li><span class="kind">${esc(d.rel.split('/').length > 1 ? d.rel.split('/')[0] : 'md')}</span><a href="${docHref(d.path)}" data-doc="${esc(d.path)}">${esc(d.title)}</a><span class="path">${esc(d.rel)}</span></li>`).join('');
      return `<details class="area" data-key="${esc(key)}"${openDetails.has(key) ? ' open' : ''}>
<summary><span class="name">${esc(a.name || ui('area.root'))}</span>
<span class="spec">${a.spec ? '<span class="kind">spec</span>' + esc(a.spec.title) : `<i>${ui('area.no-spec')}</i>`}</span>
<span class="bar2${a.tickets.length ? '' : ' none'}" title="${esc(ui('area.bar-title', { closed: a.closed, total: a.tickets.length }))}"><i style="--p:${pct(a.closed, a.tickets.length)}%"></i></span>
<span class="cnt">${a.tickets.length ? ui('area.count', { open: `<b>${a.open}</b>`, closed: a.closed }) : ui('area.no-tickets')}</span></summary>
<div class="inner"><ul class="doclist">
${a.spec ? `<li><span class="kind">spec</span><a href="${docHref(a.spec.path)}" data-doc="${esc(a.spec.path)}">${esc(a.spec.title)}</a><span class="path">${esc(a.spec.rel)}</span></li>` : ''}
${docs}${a.extras ? `<li class="muted"><span class="kind">${ui('area.other')}</span>${ui('area.extras', { n: a.extras })}</li>` : ''}</ul>
${a.tickets.length ? ticketTable(tickets) : ''}${tickets.length < a.tickets.length ? `<p class="muted">${ui('area.hidden', { n: a.tickets.length - tickets.length })}</p>` : ''}</div></details>`;
    }).join('');
    return `<p class="lead">${ui('area.lead')}</p>${rows || `<div class="empty">${ui('area.empty')}</div>`}`;
  },

  deps() {
    const visible = new Set(visibleTickets());
    // The closed blockers of the visible tickets stay in the picture, dimmed:
    // they show what has already been unlocked.
    const nodes = new Set(visible);
    for (const t of visible) for (const b of t.blockers) if (b.ticket && !visible.has(b.ticket) && matches(b.ticket, true)) nodes.add(b.ticket);
    const children = (t) => t.dependents.filter((d) => nodes.has(d));
    const parents = (t) => t.blockers.map((b) => b.ticket).filter((b) => b && nodes.has(b));
    const linked = [...nodes].filter((t) => children(t).length || parents(t).length);
    const placed = new Set();
    const node = (t, path) => {
      placed.add(t);
      const loop = path.includes(t);
      const kids = loop ? [] : children(t);
      const others = parents(t).filter((p) => p !== path[path.length - 1]);
      const ctx = !visible.has(t);
      return `<li><div class="node${ctx ? ' ctx' : ''}">${ticketLink(t)} <a class="ttl" href="${docHref(t.path)}" data-doc="${esc(t.path)}" style="color:inherit">${esc(t.title)}</a> ${chip(t.status)}${flags(t)}${loop ? ` <span class="flag blocked">${ui('deps.loop')}</span>` : ''}${path.length && others.length ? `<span class="rel">${ui('deps.also-waits', { list: others.map((p) => ticketLink(p)).join(' ') })}</span>` : ''}</div>${kids.length ? `<span class="unlocks">${ui('deps.unlocks')}</span><ul>${kids.map((k) => node(k, [...path, t])).join('')}</ul>` : ''}</li>`;
    };
    let html = '';
    for (const t of linked) if (!parents(t).length) html += node(t, []);
    for (const t of linked) if (!placed.has(t)) html += node(t, []);
    const waiting = linked.filter((t) => visible.has(t) && t.blocked).length;
    const free = linked.filter((t) => visible.has(t) && isFree(t)).length;
    const legend = html ? `<div class="legend"><span><span class="flag blocked">${ui('flag.blocked')}</span> ${ui('deps.legend-blocked')}</span><span><span class="flag free">${ui('flag.free')}</span> ${ui('deps.legend-free')}</span><span class="muted">${ui('deps.legend-dim')}</span></div>` : '';
    return `<p class="lead">${ui('deps.lead')} ${state.showClosed || state.status ? '' : ui('deps.lead-closed') + ' '}${waiting ? ui('deps.waiting', { n: waiting }) : ui('deps.none-waiting')}${free ? ' ' + ui('deps.free', { n: free }) : ''}</p>${legend}${html ? `<ul class="tree">${html}</ul>` : `<div class="empty">${ui('deps.empty')}</div>`}`;
  },

  activity() {
    const days = new Map();
    for (const c of model.comments) {
      if (!matches(c.ticket, true)) continue;
      if (!days.has(c.date)) days.set(c.date, new Map());
      const byTicket = days.get(c.date);
      if (!byTicket.has(c.ticket)) byTicket.set(c.ticket, []);
      byTicket.get(c.ticket).push(c);
    }
    const all = [...days.entries()];
    const html = all.slice(0, state.activityDays).map(([date, byTicket]) => `<section class="day"><h3>${date} <span class="muted">· ${ui('activity.tickets', { n: byTicket.size })}</span></h3><ul>${[...byTicket.entries()].map(([t, list]) => `<li><div class="node">${ticketLink(t)} <a class="ttl" href="${docHref(t.path)}" data-doc="${esc(t.path)}" style="color:inherit">${esc(t.title)}</a> ${chip(t.status)} <span class="rel">${esc(t.area)}</span></div><div class="notes">${list.map((c) => `<div>${esc(c.title || ui('activity.untitled'))}</div>`).join('')}</div></li>`).join('')}</ul></section>`).join('');
    return `<p class="lead">${ui('activity.lead')}</p>${html || `<div class="empty">${ui('activity.empty')}</div>`}${all.length > state.activityDays ? `<button type="button" data-act="more-days">${ui('activity.more', { n: all.length - state.activityDays })}</button>` : ''}`;
  },

  checks() {
    const q = fold(state.q.trim());
    const list = model.problems.filter((p) => p.tickets.some((t) => (!state.area || t.area === state.area) && (!q || t.hay.includes(q))));
    const html = PROBLEM_KINDS.map(([kind, title, info]) => {
      const items = list.filter((p) => p.kind === kind);
      if (!items.length) return '';
      const openOnes = items.filter((p) => p.tickets.some((t) => !isClosed(t))).length;
      return `<section class="group${info ? ' info' : ''}"><h2>${ui(title)} <span class="count">${items.length}</span><span class="hint">${info ? ui('checks.info') + ' · ' : ''}${ui('checks.affects', { n: openOnes })}</span></h2><div class="tablewrap"><table class="grid"><thead><tr><th>${ui('table.ticket')}</th><th class="c-st">${ui('table.status')}</th><th>${ui('checks.problem')}</th></tr></thead><tbody>${items.map((p) => `<tr><td class="c-title">${p.tickets.map((t) => `${ticketLink(t)} <a class="open" href="${docHref(t.path)}" data-doc="${esc(t.path)}">${esc(t.title)}</a><div class="note">${esc(t.path)}</div>`).join('')}</td><td class="c-st">${p.tickets.map((t) => chip(t.status)).join('<br>')}</td><td>${esc(p.text())}</td></tr>`).join('')}</tbody></table></div></section>`;
    }).join('');
    return `<p class="lead">${ui('checks.lead')}</p>${html || `<div class="empty">${ui('checks.empty')}</div>`}`;
  },

  git: renderGitView,

  docs() {
    const q = fold(state.q.trim());
    const ok = (d) => (!state.area || d.area === state.area) && (!q || d.hay.includes(q));
    const link = (d) => `<a class="open" href="${docHref(d.path)}" data-doc="${esc(d.path)}">${esc(d.title)}</a>`;
    const table = (head, rows) => (rows.length ? `<div class="tablewrap"><table class="grid"><thead><tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>` : `<div class="empty">${ui('docs.empty')}</div>`);
    const specs = model.docs.filter((d) => d.kind === 'spec' && ok(d));
    const other = model.docs.filter((d) => d.kind === 'doc' && ok(d));
    const adrs = state.area ? [] : model.adrs.filter((d) => !q || d.hay.includes(q));
    const row = (d) => `<tr data-doc="${esc(d.path)}"><td class="c-area">${esc(d.area || '–')}</td><td class="c-title">${link(d)}<div class="note">${esc(d.path)}</div></td></tr>`;
    const own = state.area ? [] : [model.readme, ...model.glossaries].filter((d) => d && (!q || d.hay.includes(q)));
    return `${own.length ? `<section class="group"><h2>${ui('docs.own')}<span class="hint">${ui('docs.own.hint')}</span></h2>${table([ui('docs.file'), ui('docs.title')], own.map((d) => `<tr data-doc="${esc(d.path)}"><td class="c-area"><span class="kind">${ui(d.kind === 'readme' ? 'docs.readme' : 'docs.glossary')}</span>${esc(d.path)}</td><td class="c-title">${link(d)}</td></tr>`))}</section>` : ''}
<section class="group"><h2>${ui('docs.other')} <span class="count">${other.length}</span><span class="hint">${ui('docs.other.hint')}</span></h2>${table([ui('table.area'), ui('docs.document')], other.map(row))}</section>
<section class="group"><h2>${ui('docs.specs')} <span class="count">${specs.length}</span></h2>${table([ui('table.area'), ui('docs.spec')], specs.map(row))}</section>
${state.area ? '' : `<section class="group"><h2>${ui('docs.adrs')} <span class="count">${adrs.length}</span><span class="hint">${model.adrPath ? esc(model.adrPath) + '/' : ui('docs.no-adr-dir')}</span></h2>${table([ui('table.num'), ui('docs.decision'), ui('docs.adr-status')], adrs.map((d) => `<tr data-doc="${esc(d.path)}"><td class="c-num">${esc(d.num || '–')}</td><td class="c-title">${link(d)}</td><td>${d.status ? esc(d.status) : '<span class="muted">–</span>'}</td></tr>`))}</section>`}`;
  },
};

// ───────────────────────── Git branches ─────────────────────────

const shortHash = (h) => h.slice(0, 7);
const relTime = (sec) => {
  const d = Date.now() / 1000 - sec;
  if (d < 90) return ui('git.now');
  if (d < 3600) return ui('git.minutes', { n: Math.round(d / 60) });
  if (d < 86400) return ui('git.hours', { n: Math.round(d / 3600) });
  if (d < 86400 * 45) return ui('git.days', { n: Math.round(d / 86400) });
  return new Date(sec * 1000).toLocaleDateString(i18n.lang);
};
const fullTime = (sec) => new Date(sec * 1000).toLocaleString(i18n.lang);

// The branch a merge commit brought in, when its subject is git's own wording.
function mergedName(subject) {
  const m = /^Merge (?:remote-tracking )?branch '([^']+)'/.exec(subject) || /^Merge pull request #\d+ from \S+?\/(\S+)/.exec(subject) || /^Merge branch (\S+)/.exec(subject);
  return m ? m[1] : '';
}

// Lanes: each commit gets a column. A lane holds the commit it waits for next
// (the first parent of the one above); a merge opens or joins a lane for each
// further parent; lanes that wait for the same commit end in it (where a
// branch forked). The base branch keeps lane 0, so its line runs straight.
function layoutGit(g) {
  const index = new Map(g.commits.map((c, i) => [c.hash, i]));
  const base = g.refs.find((r) => r.kind === 'branch' && r.name === g.base);
  const lanes = [];
  let color = 1;
  // Held for the base until its tip comes; nothing is drawn in it before.
  if (base && index.has(base.hash)) lanes[0] = { hash: base.hash, color: 0, held: true };
  const free = () => { let k = 0; while (lanes[k]) k++; return k; };
  let width = 1;
  const rows = g.commits.map((c) => {
    const before = lanes.map((l) => (l ? { ...l } : null));
    let at = lanes.findIndex((l) => l && l.hash === c.hash);
    if (at < 0) { at = free(); lanes[at] = { hash: c.hash, color: color++ % GIT_COLORS }; }
    const own = lanes[at].color;
    const ends = [];
    lanes.forEach((l, k) => { if (l && k !== at && l.hash === c.hash) { ends.push({ k, color: l.color }); lanes[k] = null; } });
    const outs = [];
    if (c.parents.length) { lanes[at] = { hash: c.parents[0], color: own }; outs.push({ k: at, color: own }); } else lanes[at] = null;
    for (const p of c.parents.slice(1)) {
      let k = lanes.findIndex((l) => l && l.hash === p);
      if (k < 0) { k = free(); lanes[k] = { hash: p, color: color++ % GIT_COLORS }; }
      outs.push({ k, color: lanes[k].color });
    }
    while (lanes.length && !lanes[lanes.length - 1]) lanes.pop();
    width = Math.max(width, lanes.length, at + 1);
    // Lanes that only pass by this row.
    const through = [];
    before.forEach((l, k) => { if (l && !l.held && l.hash !== c.hash && lanes[k] && lanes[k].hash === l.hash) through.push({ k, color: l.color }); });
    return { c, at, color: own, ends, outs, through, start: !before[at] || before[at].hash !== c.hash || !!before[at].held };
  });
  return { rows, width };
}

function gitSvg(layout) {
  const x = (k) => 10 + k * GIT_LANE_W, H = GIT_ROW_H;
  const paths = [], dots = [];
  const curve = (x1, y1, x2, y2) => (x1 === x2 ? `M${x1} ${y1}V${y2}` : `M${x1} ${y1}C${x1} ${(y1 + y2) / 2} ${x2} ${(y1 + y2) / 2} ${x2} ${y2}`);
  layout.rows.forEach((r, i) => {
    const top = i * H, mid = top + H / 2, bottom = top + H, cx = x(r.at);
    for (const t of r.through) paths.push(`<path class="lane${t.color}" d="M${x(t.k)} ${top}V${bottom}" stroke="var(--c)"/>`);
    if (!r.start) paths.push(`<path class="lane${r.color}" d="M${cx} ${top}V${mid}" stroke="var(--c)"/>`);
    for (const e of r.ends) paths.push(`<path class="lane${e.color}" d="${curve(x(e.k), top, cx, mid)}" stroke="var(--c)"/>`);
    for (const o of r.outs) paths.push(`<path class="lane${o.color}" d="${curve(cx, mid, x(o.k), bottom)}" stroke="var(--c)"/>`);
    const merge = r.c.parents.length > 1;
    dots.push(`<circle class="lane${r.color}" cx="${cx}" cy="${mid}" r="${merge ? 3.5 : 4.5}" stroke="var(--c)" fill="${merge ? 'var(--gw-surface)' : 'var(--c)'}"/>`);
  });
  const w = x(layout.width) + 2;
  return { w, svg: `<svg width="${w}" height="${layout.rows.length * H}" aria-hidden="true">${paths.join('')}${dots.join('')}</svg>` };
}

function refPill(r, color, asButton) {
  const cls = `ref ${r.kind === 'tag' ? 'tag' : r.kind === 'remote' ? 'remote lane' + color : 'lane' + color}${r.head ? ' head' : ''}`;
  const title = ui(r.kind === 'tag' ? 'git.tag' : r.kind === 'remote' ? 'git.remote' : r.head ? 'git.head' : 'git.local');
  return asButton
    ? `<button type="button" class="${cls}" data-git-jump="${esc(r.hash)}" title="${esc(ui('git.jump', { what: title }))}">${esc(r.name)}</button>`
    : `<span class="${cls}" title="${esc(title)}">${esc(r.name)}</span>`;
}

function branchState(r, g) {
  if (r.kind === 'branch' && r.name === g.base) return `<span class="flag free">${ui('git.base')}</span>`;
  if (r.ahead == null) return '<span class="muted">–</span>';
  // The base's own remote: not merged into it, only behind or ahead of it.
  const baseRef = g.refs.find((b) => b.kind === 'branch' && b.name === g.base);
  if (r.kind === 'remote' && baseRef && baseRef.upstream === r.name) {
    if (!r.ahead && !r.behind) return `<span class="flag free">${ui('git.same', { base: esc(g.base) })}</span>`;
    return [r.behind ? `<span class="flag fresh">${ui('git.not-pushed', { n: r.behind })}</span>` : '', r.ahead ? `<span class="flag fresh">${ui('git.not-pulled', { n: r.ahead })}</span>` : ''].filter(Boolean).join(' ');
  }
  if (r.ahead === 0) return `<span class="flag free">${ui('git.merged', { base: esc(g.base) })}</span>${r.behind ? ` <span class="muted">${ui('git.behind-merged', { n: r.behind, base: esc(g.base) })}</span>` : ''}`;
  return `<span class="flag fresh">${ui('git.ahead', { n: r.ahead, base: esc(g.base) })}</span>${r.behind ? ` <span class="muted">${ui('git.behind', { n: r.behind })}</span>` : ''}`;
}

function renderGitView() {
  if (!source || !source.server) {
    return `<p class="lead">${ui('git.no-server')}</p>`;
  }
  if (!source.git) {
    return `<div class="notice">${ui('git.old-server', { version: source.version ? ' (' + esc(source.version) + ')' : '', page: VERSION })}</div>`;
  }
  const g = gitState.data;
  if (!g) {
    return gitState.error
      ? `<div class="empty">${gitState.error === NO_REPO ? ui('git.no-repo') : ui('git.error', { error: esc(gitState.error) })}</div>`
      : `<div class="empty">${ui('git.loading')}</div>`;
  }
  const layout = layoutGit(g);
  const color = new Map(layout.rows.map((r) => [r.c.hash, r.color]));
  const refsAt = new Map();
  for (const r of g.refs) { if (!refsAt.has(r.hash)) refsAt.set(r.hash, []); refsAt.get(r.hash).push(r); }
  const order = { branch: 0, remote: 1, tag: 2 };
  for (const list of refsAt.values()) list.sort((a, b) => b.head - a.head || order[a.kind] - order[b.kind] || a.name.localeCompare(b.name));

  // The branches, the newest first; the base on top.
  const branches = g.refs.filter((r) => r.kind !== 'tag').sort((a, b) => (b.name === g.base && b.kind === 'branch') - (a.name === g.base && a.kind === 'branch') || b.date - a.date);
  const baseUp = (g.refs.find((r) => r.kind === 'branch' && r.name === g.base) || {}).upstream;
  const merged = branches.filter((r) => r.ahead === 0 && !(r.kind === 'remote' && r.name === baseUp)).length;
  const merges = g.commits.filter((c) => c.parents.length > 1).length;
  const table = `<div class="tablewrap"><table class="grid"><thead><tr><th>${ui('git.branch')}</th><th>${ui('git.relation', { base: g.base ? esc(g.base) : ui('git.base-branch') })}</th><th class="c-last">${ui('git.last-commit')}</th></tr></thead><tbody>${branches.map((r) => `<tr><td class="c-branch">${refPill(r, color.get(r.hash) ?? 7, true)}${r.worktree && !r.head ? ` <span class="flag fresh" title="${esc(ui('git.worktree-title'))}">worktree</span>` : ''}${r.upstream ? ` <span class="muted">→ ${esc(r.upstream)}</span>` : ''}</td><td>${branchState(r, g)}</td><td class="c-last" title="${esc(fullTime(r.date))}">${esc(relTime(r.date))}</td></tr>`).join('')}</tbody></table></div>`;

  const w = 10 + layout.width * GIT_LANE_W + 2;   // as gitSvg draws it
  const rows = layout.rows.map((r) => {
    const c = r.c, merge = c.parents.length > 1;
    const into = merge ? mergedName(c.subject) : '';
    const pills = (refsAt.get(c.hash) || []).map((ref) => refPill(ref, r.color, false)).join('');
    const open = gitState.open.has(c.hash);
    const detail = open ? `<div class="detail"><div class="mono">${esc(c.hash)}</div><div>${esc(c.subject)}</div><div class="muted">${esc(c.author)} · ${esc(fullTime(c.date))}${merge ? ' · ' + ui('git.merge-parents', { n: c.parents.length, list: c.parents.map((p) => `<span class="mono">${esc(shortHash(p))}</span>`).join(', ') }) : c.parents.length ? '' : ' · ' + ui('git.first')}${into ? ' · ' + ui('git.merged-branch', { name: `<b>${esc(into)}</b>` }) : ''}</div></div>` : '';
    return `<div class="row${merge ? ' merge' : ''}${gitState.hit === c.hash ? ' hit' : ''}" data-commit="${esc(c.hash)}" title="${esc(c.subject)}"><span class="h">${esc(shortHash(c.hash))}</span>${pills ? `<span class="refs">${pills}</span>` : ''}<span class="s">${esc(c.subject)}</span><span class="who">${esc(c.author)}</span><span class="when" title="${esc(fullTime(c.date))}">${esc(relTime(c.date))}</span></div>${detail}`;
  });
  // A detail line pushes the rows below it down: the graph is drawn per block.
  let html = '', block = [], blockRows = [];
  const flush = () => {
    if (!blockRows.length) return;
    const part = gitSvg({ rows: blockRows, width: layout.width });
    html += `<div class="block" style="position:relative;padding-left:${part.w}px">${part.svg}${block.join('')}</div>`;
    block = []; blockRows = [];
  };
  layout.rows.forEach((r, i) => {
    const opened = gitState.open.has(r.c.hash);
    const [line, detail] = opened ? [rows[i].slice(0, rows[i].indexOf('<div class="detail">')), rows[i].slice(rows[i].indexOf('<div class="detail">'))] : [rows[i], ''];
    block.push(line); blockRows.push(r);
    if (opened) { flush(); html += `<div style="padding-left:${w}px">${detail}</div>`; }
  });
  flush();
  const shown = g.commits.length;
  return `<p class="lead">${ui('git.lead')}</p>
<section class="group"><h2>${ui('git.branches')} <span class="count">${branches.length}</span><span class="hint">${ui('git.branches-hint', { merged, base: esc(g.base), tags: g.refs.filter((r) => r.kind === 'tag').length })} · ${g.headBranch ? ui('git.checked-out', { name: esc(g.headBranch) }) : ui('git.detached')}</span></h2>${table}</section>
<section class="group"><h2>${ui('git.graph')} <span class="count">${shown}</span><span class="hint">${shown < g.total ? ui('git.newest', { shown, total: g.total }) : ui('git.all')} · ${ui('git.merges', { n: merges })}</span></h2>
<div class="graph" style="--row-h:${GIT_ROW_H}px"><div class="rows">${html}</div></div>
<div class="graph-foot">${shown < g.total ? `<button type="button" data-act="more-commits">${ui('git.more', { n: Math.min(GIT_PAGE, g.total - shown) })}</button>` : ''}<span>${ui('git.legend')} ${refPill({ kind: 'branch', name: ui('git.local'), hash: '' }, 0, false)} ${refPill({ kind: 'remote', name: ui('git.remote'), hash: '' }, 0, false)} ${refPill({ kind: 'tag', name: ui('git.tag'), hash: '' }, 0, false)} ${refPill({ kind: 'branch', name: ui('git.checked-out-branch'), hash: '', head: true }, 0, false)}</span></div></section>`;
}

function renderView() {
  if (!model) return;
  const y = window.scrollY;
  $('filters').hidden = state.view === 'git';
  $('view').innerHTML = (VIEW_RENDERERS[state.view] || VIEW_RENDERERS.waiting)();
  renderSummary();
  window.scrollTo(0, y);
}

function renderDrawer() {
  const doc = model && state.doc ? model.byPath.get(state.doc) : null;
  const drawer = $('drawer');
  if (!doc) {
    if (!drawer.hidden) closeDrawerNow();
    return;
  }
  const body = $('drawer-body');
  const keepScroll = drawer.dataset.path === doc.path ? body.scrollTop : 0;
  let meta = '';
  if (doc.kind === 'ticket') {
    const t = doc;
    const area = model.areas.get(t.area);
    const row = (k, v) => (v ? `<dt>${k}</dt><dd>${v}</dd>` : '');
    meta = `<dl class="meta">
${row(ui('table.status'), chip(t.status) + flags(t) + (t.statusNote ? ' ' + esc(t.statusNote) : ''))}
${row(ui('table.area'), esc(t.area) + (area && area.spec ? ` · <a href="${docHref(area.spec.path)}" data-doc="${esc(area.spec.path)}"><span class="kind">spec</span>${esc(area.spec.title)}</a>` : ''))}
${row(ui('table.checks'), t.checks.total ? meter(t.checks) : '')}
${row(ui('table.blocked-by'), blockerLinks(t) + (t.notes.length ? ' <span class="muted">' + esc(t.notes.join('; ')) + '</span>' : ''))}
${row(ui('drawer.unlocks'), t.dependents.map((d) => ticketLink(d)).join(' '))}
${row(ui('drawer.earlier'), esc(t.earlier))}${row(ui('drawer.type'), esc(t.type))}
${row(ui('table.last-comment'), t.lastComment ? `<span class="mono">${t.lastComment}</span> · ${ui('drawer.comments', { n: t.comments.length })}` : '')}
${row(ui('docs.file'), `<span class="mono">${esc(t.path)}</span>`)}</dl>`;
    $('drawer-title').innerHTML = `<span class="num">${esc(t.label)}</span>${esc(t.title)}`;
  } else {
    meta = `<dl class="meta"><dt>${ui('docs.file')}</dt><dd><span class="mono">${esc(doc.path)}</span></dd>${doc.kind === 'adr' && doc.status ? `<dt>${ui('docs.adr-status')}</dt><dd>${esc(doc.status)}</dd>` : ''}</dl>`;
    $('drawer-title').textContent = doc.title;
  }
  body.innerHTML = meta + '<div class="md">' + renderMarkdown(doc.text, { path: doc.path, model }) + '</div>';
  const wasHidden = drawer.hidden;
  drawer.hidden = false;
  $('shade').hidden = false;
  $('top').inert = true;
  $('main').inert = true;
  document.body.style.overflow = 'hidden';
  body.scrollTop = keepScroll;
  if (wasHidden || drawer.dataset.path !== doc.path) $('drawer-close').focus();
  drawer.dataset.path = doc.path;
}

function closeDrawerNow() {
  $('drawer').hidden = true;
  $('shade').hidden = true;
  $('top').inert = false;
  $('main').inert = false;
  document.body.style.overflow = '';
  delete $('drawer').dataset.path;
}

function closeDrawer() {
  const back = lastOpener;
  location.hash = '#/' + state.view;
  requestAnimationFrame(() => {
    const el = back && [...document.querySelectorAll('#main a[data-doc]')].find((a) => a.dataset.doc === back);
    if (el) el.focus();
  });
}

function renderAll() {
  $('start').hidden = true;
  $('app').hidden = false;
  const name = model.projectName || ui('page.project');
  $('project').innerHTML = `${esc(name)}<small>${ui('page.subtitle')}</small>`;
  document.title = ui('page.title-open', { n: model.open.length, name });
  renderOverview();
  renderTabs();
  renderFilters();
  renderView();
  renderDrawer();
  renderLive(false);
}

// ───────────────────────── Routing and events ─────────────────────────

function readHash() {
  const m = /^#\/([a-z]+)(?:\/(.+))?$/.exec(location.hash);
  const view = m && VIEW_RENDERERS[m[1]] ? m[1] : 'waiting';
  let doc = null;
  if (m && m[2]) { try { doc = decodeURIComponent(m[2]); } catch (e) { doc = null; } }
  const viewChanged = view !== state.view;
  state.view = view;
  state.doc = doc;
  if (!model) return;
  if (viewChanged) { renderTabs(); renderOverview(); renderView(); window.scrollTo(0, 0); }
  renderDrawer();
}
window.addEventListener('hashchange', readHash);

function filtersChanged() {
  saveState();
  renderOverview();
  renderFilters();
  renderView();
}

let typing = null;
$('q').addEventListener('input', () => {
  state.q = $('q').value;
  clearTimeout(typing);
  typing = setTimeout(renderView, 120);
});
$('f-status').addEventListener('change', (e) => { state.status = e.target.value; filtersChanged(); });
$('f-area').addEventListener('change', (e) => { state.area = e.target.value; filtersChanged(); });
$('f-closed').addEventListener('change', (e) => { state.showClosed = e.target.checked; filtersChanged(); });

document.addEventListener('click', (e) => {
  const act = e.target.closest('[data-act]');
  if (act) {
    if (act.dataset.act === 'show-closed') state.showClosed = true;
    if (act.dataset.act === 'clear') { state.q = ''; state.status = ''; state.area = ''; }
    if (act.dataset.act === 'more-days') { state.activityDays += 30; renderView(); return; }
    if (act.dataset.act === 'more-commits') { gitState.limit += GIT_PAGE; act.disabled = true; refreshGit().then(() => renderView()); return; }
    filtersChanged();
    return;
  }
  const jump = e.target.closest('[data-git-jump]');
  if (jump) {
    gitState.hit = jump.dataset.gitJump;
    renderView();
    const row = document.querySelector(`.graph .row[data-commit="${CSS.escape(gitState.hit)}"]`);
    if (row) row.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    else { gitState.hit = ''; }
    return;
  }
  const commitRow = e.target.closest('.graph .row[data-commit]');
  if (commitRow && !String(window.getSelection())) {
    const h = commitRow.dataset.commit;
    if (gitState.open.has(h)) gitState.open.delete(h); else gitState.open.add(h);
    renderView();
    return;
  }
  const statusChip = e.target.closest('button[data-status]');
  if (statusChip) {
    state.status = state.status === statusChip.dataset.status ? '' : statusChip.dataset.status;
    if (state.view !== 'waiting' && state.view !== 'areas') location.hash = '#/waiting';
    filtersChanged();
    return;
  }
  const link = e.target.closest('a[data-doc]');
  if (link) { if (!$('drawer').contains(link)) lastOpener = link.dataset.doc; return; }
  const row = e.target.closest('tr[data-doc]');
  if (row && !e.target.closest('a, button') && !String(window.getSelection())) {
    lastOpener = row.dataset.doc;
    location.hash = docHref(row.dataset.doc);
  }
});
document.addEventListener('toggle', (e) => {
  const key = e.target.dataset && e.target.dataset.key;
  if (key) { if (e.target.open) openDetails.add(key); else openDetails.delete(key); }
}, true);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('drawer').hidden) { e.preventDefault(); closeDrawer(); return; }
  if (e.key === '/' && !$('app').hidden && $('drawer').hidden && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) { e.preventDefault(); $('q').focus(); }
});
$('drawer-close').addEventListener('click', closeDrawer);
$('shade').addEventListener('click', closeDrawer);

// ───────────────────────── Choosing the folder ─────────────────────────

const canPick = typeof window.showDirectoryPicker === 'function';

async function useHandle(handle) {
  await rememberHandle(handle);
  await start({ adapter: handleAdapter, root: handle, name: handle.name, live: true });
}

async function pickFolder() {
  try {
    await useHandle(await window.showDirectoryPicker({ mode: 'read', id: 'development-status' }));
  } catch (err) {
    if (err && err.name === 'AbortError') return;
    $('start-error').textContent = ui('error.open', { error: err && err.message ? err.message : err });
    $('start-error').hidden = false;
  }
}

$('pick').addEventListener('click', pickFolder);
$('snapshot').addEventListener('click', () => $('dir-input').click());
$('dir-input').addEventListener('change', async (e) => {
  const files = [...e.target.files];
  e.target.value = '';
  if (!files.length) return;
  const tree = treeFromFiles(files);
  await start({ adapter: treeAdapter, root: tree.root, name: tree.name, live: false });
});
$('change').addEventListener('click', async () => {
  await forgetHandle();
  showStart();
  if (canPick) pickFolder();
});
$('refresh').addEventListener('click', async () => {
  if (!source) return;
  if (!source.live) { $('dir-input').click(); return; }
  if (lostAccess) {
    try { if (await source.root.requestPermission({ mode: 'read' }) !== 'granted') return; } catch (e) { return; }
  }
  refresh();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && source && source.live) refresh(); });

// A dropped folder: live where the browser hands out a handle, a snapshot elsewhere.
let dragDepth = 0;
const hasFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
document.addEventListener('dragenter', (e) => { if (hasFiles(e)) { dragDepth++; document.body.classList.add('dragging'); } });
document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
document.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
document.addEventListener('drop', async (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('dragging');
  const item = [...e.dataTransfer.items].find((it) => it.kind === 'file');
  if (!item) return;
  // Both calls must happen before the handler yields.
  const handlePromise = typeof item.getAsFileSystemHandle === 'function' ? item.getAsFileSystemHandle() : null;
  const entry = typeof item.webkitGetAsEntry === 'function' ? item.webkitGetAsEntry() : null;
  let handle = null;
  try { handle = handlePromise ? await handlePromise : null; } catch (err) { handle = null; }
  if (handle && handle.kind === 'directory') return useHandle(handle);
  if (entry && entry.isDirectory) return start({ adapter: entryAdapter, root: entry, name: entry.name, live: false });
  $('start-error').textContent = ui('error.drop-file');
  $('start-error').hidden = false;
});

// ───────────────────────── Layout ─────────────────────────
// Light or dark follows the operating system (the shell's theme); there is no switch here.

// The sticky day headings sit right under the top bar, whatever its height.
const topHeight = () => document.documentElement.style.setProperty('--top-h', (getComputedStyle($('top')).position === 'sticky' ? $('top').offsetHeight : 0) + 'px');
if (typeof ResizeObserver === 'function') new ResizeObserver(topHeight).observe($('top'));
window.addEventListener('resize', topHeight);
topHeight();

// ───────────────────────── Boot ─────────────────────────

// ───────────────────────── Language ─────────────────────────
// Inside the shell the shell's picker sets the language and this page follows it (i18n listens);
// alone, the page shows its own picker (hidden in the shell by CSS).

let resumeName = '';   // the remembered folder, offered on the start screen

function relabelStart() {
  $('mode-note').textContent = canPick ? ui('start.mode-live', { sec: POLL_MS / 1000 }) : ui('start.mode-snapshot');
  $('pick').textContent = ui(resumeName ? 'start.pick-other' : 'start.pick');
  $('resume-btn').textContent = ui('start.resume', { name: resumeName });
  $('rules').innerHTML = ui('start.rules');
}

function relabel() {
  i18n.apply(document);
  relabelStart();
  renderVersion();
  if (model) renderAll();
  else { $('project').textContent = ui('page.title'); document.title = ui('page.title'); renderLive(false); }
}

const langPicker = $('lang');
langPicker.innerHTML = Object.entries(LANGS).map(([code, name]) => `<option value="${code}">${esc(name)}</option>`).join('');
langPicker.addEventListener('change', () => i18n.set(langPicker.value));
i18n.onChange(() => { langPicker.value = i18n.lang; relabel(); });
langPicker.value = i18n.lang;
relabel();

async function boot() {
  $('pick').hidden = !canPick;
  readHash();
  const hello = await findServer();
  if (hello) { await start(serverSource(hello)); return; }
  if (!canPick) return;
  const saved = await recallHandle();
  if (!saved || typeof saved.queryPermission !== 'function') return;
  let permission = 'prompt';
  try { permission = await saved.queryPermission({ mode: 'read' }); } catch (e) { /* ask again */ }
  if (permission === 'granted') { await start({ adapter: handleAdapter, root: saved, name: saved.name, live: true }); return; }
  $('resume').hidden = false;
  resumeName = saved.name;
  relabelStart();
  $('pick').classList.remove('primary');
  $('resume-btn').onclick = async () => {
    try {
      if (await saved.requestPermission({ mode: 'read' }) === 'granted') await start({ adapter: handleAdapter, root: saved, name: saved.name, live: true });
    } catch (err) {
      $('start-error').textContent = ui('error.gone', { error: err && err.message ? err.message : err });
      $('start-error').hidden = false;
    }
  };
}

// For checks from the console or a test: the parsed state, read only.
window.developmentStatus = { get model() { return model; }, get source() { return source; }, get changes() { return changeLog; }, refresh, renderMarkdown };

boot();
})();
</script>
</body>
</html>
