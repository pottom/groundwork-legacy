<title data-i18n="page.title">Development status</title>
<link rel="icon" href="data:,">
<!--
  The Build module's dashboard (index.html): a self-contained status page for
  a project whose tickets, specs and decisions live in markdown files.

  No build, no dependencies. Two ways to open it:
    - from the Groundwork core server (node core/groundwork.mjs, at /build/):
      the Build module's read-only endpoints (/api/build/, module.mjs) hand
      the page the markdown files, so it goes live at once, in every browser;
    - or open this file by double click: it asks once for the project folder
      (read only), which needs a Chromium browser to stay live.
  Either way it re-reads the markdown files every few seconds. Nothing about
  any particular project is baked in: copy the file into
  another project that keeps the same conventions and it works there.

  Conventions it reads (all relative to the chosen folder):
    <tracker>/<area>/issues/<number>-<slug>.md   one ticket per file
    <tracker>/<area>/spec.md                     the area's spec
    <tracker>/<area>/**/*.md                     other documents
    docs/adr/*.md                                decision records
    README.md                                    the project's name (first heading)
    GLOSSARY.md (or the older CONTEXT.md), GLOSSARY-MAP.md
                                                 the domain glossary, listed under Documents
  <tracker> is ".scratch" by default (DEFAULT_TRACKER_DIR below); without it,
  the first folder whose subfolders hold "issues/" folders.

  A ticket's fields are read near the top of the file, in any of these forms:
    **Status:** ready-for-agent        Status: ready-for-agent      - **Status:** …
  (the local format of Matt Pocock's /to-tickets skill puts **Blocked by:**
  before **Status:**; the order does not matter). "Blocked by" may also be a
  "## Blocked by" heading with a list under it (the issue template's form),
  and it may name tickets by number ("01", "#12", "area 3"), by file name
  ("01-some-slug") or by title; "None (can start immediately)" means none.
  Comments go under "## Comments"; a heading with a date (### 2026-10-14 …)
  is one comment.

  The Branches view draws the git history: every branch and tag, the
  commits in date order, and where each branch was merged. Git is asked by the
  server (read only), so this view needs it; opened by double click, the
  page cannot run git.

  Version: VERSION below; modules/build/module.mjs has the same constant. Bump
  both together and add a line here (semver: a new view or field is a minor
  step, a fix a patch, a change that breaks the server pairing a major one).
    1.0.0  2026-10-18  the first numbered version: tickets, areas, dependencies,
                       activity, inconsistencies, documents, and the git branch
                       graph; the version is shown in the header, and a
                       page and launcher of different versions say so
    2.0.0  2026-10-19  served by the Groundwork core server: the endpoints moved
                       to /api/build/, development-status.mjs is gone
    2.1.0  2026-10-19  the shared look: colours and fonts from the shell's theme
                       (/shell/theme.css, with a fallback when opened alone);
                       light or dark follows the system, the switch is gone;
                       inside the shell the bar drops the project name
    2.2.0  2026-10-19  English UI with a Hungarian translation (the shell's
                       i18n.mjs, inline below, kept equal by ui-strings.test.mjs);
                       it follows the shell's language, and alone it has its own
                       language picker
-->

<style>
/* Colours carry the ticket states:
   ready-for-agent = blue, waiting for a human = orange,
   needs-…-test = purple, done = green. */
/* The shared look comes from the shell's theme (/shell/theme.css, linked above): every
   colour, font and radius the shell and the other modules share is a --gw-* variable.
   Light or dark follows the operating system.

   Opened by double click there is no server, so no theme: the :where(:root) blocks
   below repeat the theme's values as a fallback. :where() has no specificity, so
   when theme.css is there its :root wins. Keep them equal to core/shell/theme.css
   (module.test.mjs checks it). */
:where(:root) {
  color-scheme: light dark;
  --gw-bg: #fbfaf7;
  --gw-surface: #ffffff;
  --gw-sunken: #f3f1ec;
  --gw-fg: #1d1c1a;
  --gw-fg-2: #4a4843;
  --gw-muted: #6b6860;
  --gw-line: #e4e0d7;
  --gw-line-strong: #cfcac0;
  --gw-accent: #2f5bd3;
  --gw-accent-fg: #ffffff;
  --gw-focus: #2f5bd3;
  --gw-ok: #1f8a4c;
  --gw-bad: #c0392b;
  --gw-shadow: 0 1px 2px rgb(0 0 0 / .04), 0 4px 16px rgb(0 0 0 / .05);
  --gw-font: Inter, 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
  --gw-font-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
  --gw-radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :where(:root) {
    --gw-bg: #15161a;
    --gw-surface: #1c1e23;
    --gw-sunken: #24262c;
    --gw-fg: #ecebe8;
    --gw-fg-2: #c3c1bb;
    --gw-muted: #9a978f;
    --gw-line: #2f3238;
    --gw-line-strong: #464a52;
    --gw-accent: #7d9cf0;
    --gw-accent-fg: #15161a;
    --gw-focus: #7d9cf0;
    --gw-ok: #5cc58a;
    --gw-bad: #ee7a6c;
    --gw-shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .22);
  }
}

/* Build's own colours: the ticket kinds (--c-*), the branch lanes (--g*), and two
   surfaces the shell has no name for. Done and missing are the shell's ok and bad. */
:root {
  --raised: #ffffff;
  --c-agent: #2f5bd3; --c-human: #c2410c; --c-test: #7c3aed; --c-claimed: #0b7269;
  --c-done: var(--gw-ok); --c-dropped: #7a776f; --c-neutral: #55524a; --c-bad: var(--gw-bad);
  --shadow-lg: 0 10px 40px rgb(0 0 0 / .16);
  --g0: #2f5bd3; --g1: #c2410c; --g2: #1f8a4c; --g3: #7c3aed; --g4: #0b7269; --g5: #b4235a; --g6: #8a6d00; --g7: #4a6fa5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --raised: #22242a;
    --c-agent: #7d9cf0; --c-human: #f08a5d; --c-test: #b294f5; --c-claimed: #5cc7bb;
    --c-dropped: #8f8c85; --c-neutral: #b4b1a8;
    --g0: #7d9cf0; --g1: #f08a5d; --g2: #5cc58a; --g3: #b294f5; --g4: #5cc7bb; --g5: #f07aa8; --g6: #d9b44a; --g7: #8fb0dd;
    --shadow-lg: 0 10px 40px rgb(0 0 0 / .5);
  }
}

/* Inside the shell (an iframe of /), the shell's header already names the project:
   Build's bar keeps only the live state and the version. */
.in-shell .bar h1 { display: none; }
.in-shell .bar { justify-content: flex-end; padding-top: 6px; padding-bottom: 6px; }
.in-shell #start { margin-top: 4vh; }
/* Alone, the page picks its own UI language; inside the shell the shell's picker does it. */
.in-shell #lang { display: none; }
#lang { padding: 2px 6px; border: 1px solid var(--gw-line-strong); border-radius: 7px; background: var(--gw-surface); font-size: 12.5px; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--gw-bg); color: var(--gw-fg); font: 14px/1.5 var(--gw-font); overflow-x: hidden; }
a { color: var(--gw-accent); text-decoration: none; text-underline-offset: 2px; }
a:hover { text-decoration: underline; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--gw-focus); outline-offset: 2px; border-radius: 4px; }
button, select, input { font: inherit; color: inherit; }
button, .btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid var(--gw-line-strong);
  background: var(--gw-surface); border-radius: 7px; cursor: pointer; white-space: nowrap; line-height: 1.4;
  transition: border-color .12s, background-color .12s;
}
button:hover, .btn:hover { border-color: var(--gw-fg-2); text-decoration: none; }
button.primary { background: var(--gw-accent); border-color: var(--gw-accent); color: var(--gw-accent-fg); font-weight: 600; padding: 9px 18px; }
button.primary:hover { background: color-mix(in srgb, var(--gw-accent) 88%, var(--gw-fg)); }
button.quiet { border-color: transparent; background: none; color: var(--gw-accent); padding: 2px 4px; }
button.quiet:hover { text-decoration: underline; }
button.icon { padding: 5px 8px; color: var(--gw-fg-2); }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 8px; top: 8px; z-index: 50; background: var(--gw-surface); padding: 6px 10px; border-radius: 6px; box-shadow: var(--gw-shadow); }
.num, .mono { font-family: var(--gw-font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--gw-muted); }
[hidden] { display: none !important; }
code { font-family: var(--gw-font-mono); font-size: .9em; background: var(--gw-sunken); padding: 1px 5px; border-radius: 4px; }

/* Top bar */
#top {
  position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--gw-line);
  background: color-mix(in srgb, var(--gw-bg) 90%, transparent); -webkit-backdrop-filter: saturate(1.4) blur(10px); backdrop-filter: saturate(1.4) blur(10px);
}
.bar { max-width: 1440px; margin: 0 auto; padding: 10px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.bar h1 { font-size: 16px; margin: 0 auto 0 0; font-weight: 680; letter-spacing: -.005em; display: flex; align-items: center; gap: 10px; min-width: 0; overflow-wrap: anywhere; }
.bar h1::before {
  content: ""; flex: none; width: 14px; height: 14px; border-radius: 4px;
  background: linear-gradient(135deg, var(--c-agent) 0 50%, var(--c-done) 50% 100%);
}
.bar h1 small { font-weight: 450; color: var(--gw-muted); font-size: 13px; }
.live { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; color: var(--gw-muted); font-size: 12.5px; }
.live .state { display: inline-flex; align-items: center; gap: 7px; padding: 3px 10px; border-radius: 999px; background: var(--gw-sunken); min-width: 0; }
.live button { font-size: 12.5px; padding: 3px 10px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-dropped); flex: none; }
.dot.on { background: var(--c-done); }
.dot.warn { background: var(--c-human); }
@media (prefers-reduced-motion: no-preference) { .dot.on.tick { animation: tick .9s ease-out; } }
@keyframes tick { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c-done) 60%, transparent); } to { box-shadow: 0 0 0 7px transparent; } }
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 24px 96px; }

/* Start screen */
#start { max-width: 660px; margin: 8vh auto 40px; padding: 0 20px; }
#start .card { background: var(--gw-surface); border: 1px solid var(--gw-line); border-radius: 14px; padding: 28px 30px; box-shadow: var(--gw-shadow); }
#start h2 { font-size: 26px; margin: 0 0 8px; letter-spacing: -.015em; line-height: 1.2; }
#start p { margin: 8px 0; color: var(--gw-fg-2); }
#start p.muted { color: var(--gw-muted); }
.choices { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 20px 0 10px; }
.drop { border: 1.5px dashed var(--gw-line-strong); border-radius: 10px; padding: 20px; color: var(--gw-muted); margin-top: 16px; text-align: center; transition: background-color .12s, border-color .12s; }
body.dragging .drop, body.dragging #top { border-color: var(--gw-accent); }
body.dragging .drop { background: color-mix(in srgb, var(--gw-accent) 8%, transparent); color: var(--gw-fg); }
.notice { border-left: 3px solid var(--c-human); background: color-mix(in srgb, var(--c-human) 9%, transparent); padding: 9px 13px; border-radius: 0 8px 8px 0; margin: 12px 0; }
.notice.bad { border-color: var(--c-bad); background: color-mix(in srgb, var(--c-bad) 9%, transparent); }
.rules { color: var(--gw-muted); font-size: 13px; margin-top: 24px; border-top: 1px solid var(--gw-line); padding-top: 14px; }
.rules code { font-size: 12px; }

/* Overview: big numbers and the segmented progress bar */
.overview { padding: 20px 0 6px; display: grid; gap: 14px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi {
  --c: var(--gw-fg-2); position: relative; background: var(--gw-surface); border: 1px solid var(--gw-line); border-radius: var(--gw-radius);
  padding: 12px 14px 11px; display: grid; gap: 2px; box-shadow: var(--gw-shadow); overflow: hidden; min-width: 0;
}
.kpi::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--c); }
.kpi .v { font: 680 30px/1.05 var(--gw-font); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi .v small { font-size: 15px; font-weight: 600; color: var(--gw-muted); margin-left: 2px; }
.kpi .k { font-size: 12.5px; color: var(--gw-fg-2); font-weight: 560; }
.kpi .s { font-size: 12px; color: var(--gw-muted); }
.kpi.zero .v { color: var(--gw-muted); }
.kpi.zero::before { background: var(--gw-line-strong); }
.progress { background: var(--gw-surface); border: 1px solid var(--gw-line); border-radius: var(--gw-radius); padding: 12px 14px; display: grid; gap: 10px; box-shadow: var(--gw-shadow); }
.progress .head { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; font-size: 13px; color: var(--gw-muted); }
.progress .head b { color: var(--gw-fg); font-weight: 650; }
.stack { display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; background: var(--gw-sunken); }
.stack span { display: block; min-width: 4px; background: var(--c); border-radius: 2px; }
.stack span.closed { background: repeating-linear-gradient(135deg, var(--c) 0 5px, color-mix(in srgb, var(--c) 72%, var(--gw-surface)) 5px 8px); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips .sep { width: 1px; height: 18px; background: var(--gw-line-strong); margin: 0 4px; }
.chip {
  --c: var(--c-neutral); display: inline-flex; align-items: center; gap: 6px; padding: 1px 9px 1px 8px; border-radius: 999px; white-space: nowrap;
  font: 500 12px/1.65 var(--gw-font-mono); color: color-mix(in srgb, var(--c) 82%, var(--gw-fg)); background: color-mix(in srgb, var(--c) 11%, transparent);
  border: 1px solid color-mix(in srgb, var(--c) 28%, transparent);
}
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }
.chip.closed { background: transparent; }
.chip.closed::before { background: none; border: 1.5px solid var(--c); width: 6px; height: 6px; }
button.chip { cursor: pointer; padding-top: 2px; padding-bottom: 2px; }
button.chip:hover, button.chip[aria-pressed="true"] { border-color: var(--c); }
button.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 24%, transparent); font-weight: 650; box-shadow: inset 0 0 0 1px var(--c); }
.chip b { font-weight: 700; color: var(--gw-fg); }
.t-agent { --c: var(--c-agent); } .t-human { --c: var(--c-human); } .t-test { --c: var(--c-test); }
.t-claimed { --c: var(--c-claimed); } .t-done { --c: var(--c-done); } .t-dropped { --c: var(--c-dropped); }
.t-neutral { --c: var(--c-neutral); } .t-bad { --c: var(--c-bad); }
.changes { font-size: 13px; color: var(--gw-muted); padding: 0 2px; }
.changes summary { cursor: pointer; border-radius: 4px; }
.changes ul { margin: 6px 0 0; padding-left: 18px; }
.changes li b { color: var(--gw-fg); font-weight: 600; }

/* Navigation and filters */
nav.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--gw-line); overflow-x: auto; margin-top: 8px; scrollbar-width: thin; }
nav.tabs a { display: inline-flex; align-items: center; gap: 6px; padding: 9px 12px 10px; color: var(--gw-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-weight: 520; border-radius: 6px 6px 0 0; }
nav.tabs a:hover { color: var(--gw-fg); text-decoration: none; background: color-mix(in srgb, var(--gw-fg) 4%, transparent); }
nav.tabs a[aria-current="page"] { color: var(--gw-fg); border-color: var(--gw-accent); font-weight: 650; }
nav.tabs .badge { font: 600 11px/1.6 var(--gw-font-mono); background: var(--gw-sunken); color: var(--gw-fg-2); border-radius: 999px; padding: 0 7px; }
nav.tabs .badge.warn { background: color-mix(in srgb, var(--c-human) 18%, transparent); color: var(--c-human); }
.filters { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 14px 0 6px; }
.filters input[type="search"], .filters select { padding: 6px 10px; border: 1px solid var(--gw-line-strong); border-radius: 8px; background: var(--gw-surface); min-width: 0; }
.filters input[type="search"] { flex: 1 1 240px; max-width: 380px; }
.filters select { max-width: 230px; }
.filters label.check { display: inline-flex; gap: 7px; align-items: center; cursor: pointer; color: var(--gw-fg-2); }
.filters label.check input { accent-color: var(--gw-accent); width: 15px; height: 15px; margin: 0; }
.filters .summary { margin-left: auto; color: var(--gw-muted); font-size: 13px; }

/* Groups and tables */
.group { margin: 0 0 26px; }
.group > h2, .view > h2 { font-size: 15px; margin: 18px 0 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; letter-spacing: -.005em; }
.group > h2 .count { font: 650 12px/1.7 var(--gw-font-mono); background: var(--gw-sunken); padding: 0 8px; border-radius: 999px; color: var(--gw-fg-2); }
.group > h2 .hint, .lead { font-weight: 400; color: var(--gw-muted); font-size: 13px; }
.group.info > h2 { color: var(--gw-fg-2); }
.lead { margin: 12px 0 14px; max-width: 86ch; }
.tablewrap { overflow-x: auto; background: var(--gw-surface); border: 1px solid var(--gw-line); border-radius: var(--gw-radius); box-shadow: var(--gw-shadow); }
table.grid { width: 100%; border-collapse: collapse; }
table.grid th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--gw-muted); font-weight: 650; padding: 8px 12px; border-bottom: 1px solid var(--gw-line); white-space: nowrap; background: color-mix(in srgb, var(--gw-sunken) 55%, var(--gw-surface)); }
table.grid td { padding: 9px 12px; border-bottom: 1px solid var(--gw-line); vertical-align: top; }
table.grid tr:last-child td { border-bottom: 0; }
table.grid tbody tr[data-doc] { cursor: pointer; }
table.grid tbody tr[data-doc]:hover { background: color-mix(in srgb, var(--gw-accent) 5%, transparent); }
table.grid tbody tr.is-blocked td.c-title a.open { color: var(--gw-fg-2); }
td.c-num { white-space: nowrap; font-family: var(--gw-font-mono); font-variant-numeric: tabular-nums; color: var(--gw-muted); width: 1%; font-size: 12.5px; padding-top: 10px; }
td.c-title { overflow-wrap: anywhere; min-width: 220px; }
td.c-title a.open { color: var(--gw-fg); font-weight: 580; }
td.c-title .note { color: var(--gw-muted); font-size: 12.5px; margin-top: 1px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
td.c-title .sub { display: none; color: var(--gw-muted); font-size: 12px; margin-top: 3px; }
td.c-title .sub-st { display: none; }
td.c-area, td.c-last, td.c-st, td.c-chk { white-space: nowrap; }
th.c-area { width: 150px; } th.c-st { width: 160px; } th.c-chk { width: 100px; } th.c-last { width: 140px; } th.c-blk { width: 15%; }
td.c-area { color: var(--gw-fg-2); }
td.c-blk { font-size: 13px; }
td.c-last { font-family: var(--gw-font-mono); font-size: 12.5px; color: var(--gw-muted); }
.tref { font-family: var(--gw-font-mono); font-size: .92em; white-space: nowrap; padding: 0 4px; border-radius: 4px; background: color-mix(in srgb, var(--gw-accent) 8%, transparent); }
.tref:hover { text-decoration: none; background: color-mix(in srgb, var(--gw-accent) 16%, transparent); }
.tref.is-closed { color: var(--gw-muted); background: var(--gw-sunken); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--gw-muted) 60%, transparent); }
.tref.is-missing { color: var(--c-bad); background: color-mix(in srgb, var(--c-bad) 9%, transparent); }
.flag { display: inline-block; font: 650 10.5px/1.6 var(--gw-font-mono); padding: 0 6px; border-radius: 5px; border: 1px solid; white-space: nowrap; vertical-align: 1px; text-transform: lowercase; }
.flag.blocked { color: var(--c-bad); background: color-mix(in srgb, var(--c-bad) 8%, transparent); }
.flag.fresh { color: var(--c-claimed); background: color-mix(in srgb, var(--c-claimed) 8%, transparent); }
.flag.free { color: var(--c-done); background: color-mix(in srgb, var(--c-done) 9%, transparent); }
.meter { display: inline-flex; align-items: center; gap: 7px; font-family: var(--gw-font-mono); font-size: 12px; color: var(--gw-fg-2); }
.meter i { display: block; width: 48px; height: 6px; border-radius: 3px; background: var(--gw-line); overflow: hidden; }
.meter i::before { content: ""; display: block; height: 100%; width: var(--p); background: var(--c-done); border-radius: 3px; }
.empty { color: var(--gw-muted); padding: 12px 14px; background: var(--gw-surface); border: 1px dashed var(--gw-line-strong); border-radius: var(--gw-radius); }

/* Areas */
details.area { background: var(--gw-surface); border: 1px solid var(--gw-line); border-radius: var(--gw-radius); margin-bottom: 8px; box-shadow: var(--gw-shadow); }
details.area > summary { display: grid; grid-template-columns: 18px minmax(150px, 1.1fr) minmax(0, 2.2fr) 160px 170px; gap: 12px; align-items: center; padding: 10px 14px; cursor: pointer; list-style: none; border-radius: var(--gw-radius); }
details.area > summary::-webkit-details-marker { display: none; }
details.area > summary::before { content: ""; width: 7px; height: 7px; border-right: 1.5px solid var(--gw-muted); border-bottom: 1.5px solid var(--gw-muted); transform: rotate(-45deg); justify-self: center; transition: transform .15s; }
details.area[open] > summary::before { transform: rotate(45deg); }
details.area > summary:hover { background: color-mix(in srgb, var(--gw-fg) 3%, transparent); }
details.area > summary .name { font-weight: 650; overflow-wrap: anywhere; }
details.area > summary .spec { color: var(--gw-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.area > summary .cnt { font: 12.5px var(--gw-font-mono); text-align: right; white-space: nowrap; color: var(--gw-muted); }
details.area > summary .cnt b { color: var(--gw-fg); }
.bar2 { display: block; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--c-agent) 22%, var(--gw-sunken)); overflow: hidden; }
.bar2.none { background: var(--gw-sunken); }
.bar2 i { display: block; height: 100%; width: var(--p); background: var(--c-done); border-radius: 4px; }
details.area .inner { padding: 6px 14px 14px; border-top: 1px solid var(--gw-line); }
.doclist { margin: 8px 0 12px; padding: 0; list-style: none; display: grid; gap: 4px; }
.doclist li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 0; }
.doclist .path { color: var(--gw-muted); font: 12px var(--gw-font-mono); margin-left: 8px; overflow-wrap: anywhere; }
.kind { font: 600 10.5px/1.6 var(--gw-font-mono); color: var(--gw-fg-2); background: var(--gw-sunken); border-radius: 4px; padding: 0 6px; margin-right: 7px; text-transform: lowercase; }

/* Dependency tree */
ul.tree, ul.tree ul { list-style: none; margin: 0; padding: 0; }
ul.tree > li { background: var(--gw-surface); border: 1px solid var(--gw-line); border-radius: var(--gw-radius); padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--gw-shadow); }
ul.tree ul { margin: 2px 0 0 14px; padding-left: 22px; }
ul.tree ul > li { position: relative; padding: 5px 0 0; }
ul.tree ul > li::before {
  content: ""; position: absolute; left: -22px; top: 0; width: 16px; height: 22px;
  border-left: 1.5px solid var(--gw-line-strong); border-bottom: 1.5px solid var(--gw-line-strong); border-bottom-left-radius: 7px;
}
ul.tree ul > li::after { content: ""; position: absolute; left: -22px; top: 22px; bottom: 0; border-left: 1.5px solid var(--gw-line-strong); }
ul.tree ul > li:last-child::after { display: none; }
.node { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; min-height: 30px; }
ul.tree ul .node { display: inline-flex; max-width: 100%; background: var(--raised); border: 1px solid var(--gw-line); border-radius: 8px; padding: 4px 10px; }
.node .ttl { overflow-wrap: anywhere; font-weight: 550; min-width: 0; }
.node.ctx { opacity: .72; }
.node.ctx .ttl { font-weight: 450; }
.rel { color: var(--gw-muted); font-size: 12px; }
.unlocks { display: block; margin: 6px 0 0 1px; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--gw-muted); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--gw-muted); font-size: 12.5px; margin: -4px 0 14px; align-items: center; }

/* Activity */
.day { margin: 0 0 18px; }
.day > h3 { font: 650 13px var(--gw-font-mono); margin: 0 0 6px; position: sticky; top: var(--top-h, 52px); z-index: 2; background: var(--gw-bg); padding: 6px 0; }
.day ul { margin: 0; padding: 0; list-style: none; background: var(--gw-surface); border: 1px solid var(--gw-line); border-radius: var(--gw-radius); box-shadow: var(--gw-shadow); }
.day li { padding: 9px 14px; border-bottom: 1px solid var(--gw-line); }
.day li:last-child { border-bottom: 0; }
.day .notes { margin: 3px 0 0; color: var(--gw-muted); font-size: 13px; }
.day .notes div { padding-left: 14px; position: relative; }
.day .notes div::before { content: "–"; position: absolute; left: 0; }
.view > button { margin-top: 4px; }

/* Git branches */
.ver { font: 500 11.5px/1.6 var(--gw-font-mono); color: var(--gw-muted); padding: 0 7px; border-radius: 999px; border: 1px solid var(--gw-line); white-space: nowrap; }
.ver.warn { color: var(--c-human); border-color: color-mix(in srgb, var(--c-human) 45%, transparent); }
.ref { --c: var(--c-neutral); display: inline-flex; align-items: center; gap: 4px; font: 600 11px/1.55 var(--gw-font-mono); padding: 0 6px; border-radius: 5px; white-space: nowrap;
  color: color-mix(in srgb, var(--c) 80%, var(--gw-fg)); background: color-mix(in srgb, var(--c) 13%, transparent); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
.ref.remote { background: transparent; border-style: dashed; font-weight: 500; }
.ref.tag { color: var(--gw-fg-2); background: var(--gw-sunken); border-color: var(--gw-line-strong); font-weight: 500; }
.ref.tag::before { content: ""; width: 6px; height: 6px; transform: rotate(45deg); background: var(--gw-muted); }
.ref.head { box-shadow: inset 0 0 0 1px var(--c); }
.ref.head::before { content: "HEAD"; font-size: 9.5px; letter-spacing: .04em; color: var(--gw-muted); }
/* after .ref: a lane's colour wins over the neutral default */
.lane0 { --c: var(--g0); } .lane1 { --c: var(--g1); } .lane2 { --c: var(--g2); } .lane3 { --c: var(--g3); }
.lane4 { --c: var(--g4); } .lane5 { --c: var(--g5); } .lane6 { --c: var(--g6); } .lane7 { --c: var(--g7); }
button.ref { cursor: pointer; }
button.ref:hover { border-color: var(--c); }
td.c-branch { white-space: nowrap; }
td.c-branch .ref { font-size: 12px; }
.graph { position: relative; background: var(--gw-surface); border: 1px solid var(--gw-line); border-radius: var(--gw-radius); box-shadow: var(--gw-shadow); overflow-x: auto; }
.graph svg { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.graph svg path { fill: none; stroke-width: 2; stroke-linecap: round; }
.graph svg circle { stroke-width: 2; }
.graph .rows { position: relative; min-width: 560px; }
.graph .row { height: var(--row-h); display: flex; align-items: center; gap: 8px; padding-right: 12px; cursor: pointer; white-space: nowrap; border-radius: 6px; }
.graph .row:hover { background: color-mix(in srgb, var(--gw-fg) 4%, transparent); }
.graph .row.hit { background: color-mix(in srgb, var(--gw-accent) 12%, transparent); }
.graph .row .h { font: 12px var(--gw-font-mono); color: var(--gw-muted); flex: none; }
.graph .row .s { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; }
.graph .row.merge .s { color: var(--gw-fg-2); }
.graph .row .who { color: var(--gw-muted); font-size: 12.5px; flex: none; }
.graph .row .when { font: 12px var(--gw-font-mono); color: var(--gw-muted); flex: none; width: 78px; text-align: right; }
.graph .refs { display: inline-flex; gap: 4px; flex: none; }
.graph .more { position: absolute; left: 0; right: 0; }
.graph .detail { padding: 8px 12px 10px; margin: 0 8px 6px 0; background: var(--gw-sunken); border-radius: 8px; font-size: 13px; white-space: normal; display: grid; gap: 2px; }
.graph .detail .mono { overflow-wrap: anywhere; }
.graph-foot { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 10px; color: var(--gw-muted); font-size: 13px; }
@media (max-width: 860px) {
  .graph .row .who { display: none; }
  .graph .rows { min-width: 0; }
}
@media (max-width: 520px) {
  .graph .row .h, .graph .row .when { display: none; }
}

/* Drawer */
#shade { position: fixed; inset: 0; background: rgb(10 10 12 / .42); z-index: 20; }
@media (prefers-reduced-motion: no-preference) {
  #shade:not([hidden]) { animation: fade .15s ease-out; }
  #drawer:not([hidden]) { animation: slide .18s ease-out; }
}
@keyframes fade { from { opacity: 0; } }
@keyframes slide { from { transform: translateX(24px); } }
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(900px, 100%); z-index: 21; background: var(--gw-surface); border-left: 1px solid var(--gw-line-strong); display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }
#drawer header { display: flex; gap: 12px; align-items: flex-start; padding: 14px 22px; border-bottom: 1px solid var(--gw-line); }
#drawer header h2 { margin: 0; font-size: 18px; line-height: 1.35; flex: 1; overflow-wrap: anywhere; letter-spacing: -.01em; min-width: 0; }
#drawer header h2 .num { color: var(--gw-muted); font-weight: 500; margin-right: 8px; font-size: 15px; }
#drawer .scroll { overflow: auto; padding: 0 22px 64px; flex: 1; overscroll-behavior: contain; }
dl.meta { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 16px 0; padding: 12px 14px; background: var(--gw-sunken); border-radius: var(--gw-radius); font-size: 13px; align-items: baseline; }
dl.meta dt { color: var(--gw-muted); }
dl.meta dd { margin: 0; overflow-wrap: anywhere; }
.md { max-width: 78ch; overflow-wrap: anywhere; font-size: 14.5px; line-height: 1.6; }
.md h1 { font-size: 21px; letter-spacing: -.01em; } .md h2 { font-size: 16.5px; border-bottom: 1px solid var(--gw-line); padding-bottom: 4px; margin-top: 28px; }
.md h3 { font-size: 14.5px; margin-top: 22px; } .md h4, .md h5, .md h6 { font-size: 13.5px; }
.md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: 9px 0; }
.md ul, .md ol { padding-left: 22px; }
.md li { margin: 3px 0; }
.md li.task { list-style: none; margin-left: -20px; }
.md li.task input { margin: 0 7px 0 0; vertical-align: -1px; accent-color: var(--c-done); }
.md li.task.done > span.t { color: var(--gw-muted); }
.md pre { background: var(--gw-sunken); padding: 11px 13px; border-radius: 8px; overflow: auto; font: 12.5px/1.55 var(--gw-font-mono); border: 1px solid var(--gw-line); }
.md pre code { background: none; padding: 0; font-size: inherit; }
.md blockquote { border-left: 3px solid var(--gw-accent); background: color-mix(in srgb, var(--gw-accent) 6%, transparent); padding: 4px 14px; color: var(--gw-fg-2); margin-left: 0; border-radius: 0 8px 8px 0; }
.md .tw { overflow-x: auto; }
.md table { border-collapse: collapse; font-size: 13px; }
.md th, .md td { border: 1px solid var(--gw-line); padding: 5px 9px; vertical-align: top; text-align: left; }
.md th { background: var(--gw-sunken); }
.md hr { border: 0; border-top: 1px solid var(--gw-line-strong); margin: 20px 0; }
.md .dead { border-bottom: 1px dotted var(--gw-muted); }
.md del { color: var(--gw-muted); }

@media (max-width: 860px) {
  .bar, .wrap { padding-left: 16px; padding-right: 16px; }
  #top { position: static; }
  .bar h1 { flex: 1 1 0; flex-wrap: wrap; row-gap: 0; }
  .bar h1 small { flex-basis: 100%; padding-left: 24px; }
  .live { order: 2; margin-left: 0; width: 100%; }
  .live .state { flex: 1 1 100%; border-radius: 8px; }
  table.grid th.c-area, table.grid td.c-area, table.grid th.c-blk, table.grid td.c-blk, table.grid th.c-last, table.grid td.c-last { display: none; }
  td.c-title .sub { display: block; }
  td.c-title { min-width: 0; }
  table.grid td, table.grid th { padding: 8px 9px; }
  details.area > summary { grid-template-columns: 14px 1fr auto; gap: 6px 10px; padding: 10px 12px; }
  details.area > summary .spec { grid-column: 2 / -1; order: 3; }
  details.area > summary .bar2 { grid-column: 2 / -1; order: 4; }
  details.area .inner { padding: 6px 10px 12px; }
  .filters .summary { margin-left: 0; width: 100%; }
  .filters input[type="search"] { flex-basis: 100%; max-width: none; }
  .filters select { max-width: none; flex: 1 1 40%; }
  #drawer .scroll, #drawer header { padding-left: 16px; padding-right: 16px; }
  #start .card { padding: 22px 20px; }
}
@media (max-width: 520px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .kpi.main { grid-column: 1 / -1; }
  .kpi .v { font-size: 26px; }
  table.grid th.c-st, table.grid td.c-st { display: none; }
  td.c-title .sub-st { display: block; margin: 2px 0; }
  td.c-title .sub .chip { font-size: 11px; }
  .meter i { display: none; }
  ul.tree > li { padding: 10px; }
  ul.tree ul { margin-left: 6px; padding-left: 16px; }
  ul.tree ul > li::before { left: -16px; width: 12px; }
  ul.tree ul > li::after { left: -16px; }
  dl.meta { grid-template-columns: 1fr; gap: 0; }
  dl.meta dd { margin-bottom: 6px; }
}
</style>

<!-- The UI translation: a copy of core/shell/i18n.mjs (without "export"), inline so that the
     page also works opened by double click, where there is no /shell/ and no module import.
     Do not edit it here: change core/shell/i18n.mjs and copy it (ui-strings.test.mjs checks). -->
<script id="gw-i18n">
// The UI translation mechanism: one small browser module with no dependencies, served at
// /shell/i18n.mjs. The shell and every module view use it; a page that runs without the core
// server (Build's folder-picker mode) can import a copy of this file, it needs nothing else.
//
// The UI language is not the language of the generated documents (see modules/plan/doc-strings.mjs).
//
//   const i18n = createI18n({ en: { save: 'Save', saved: 'Saved at {time}' }, hu: { ... } })
//   i18n.lang                      'en' or 'hu'
//   i18n.t('saved', { time })      the text in the current language; {name} placeholders are filled;
//                                  a key missing in the language falls back to English, then to the key
//   i18n.apply(document)           fills elements marked with data-i18n="key" (text),
//                                  data-i18n-title, data-i18n-aria-label, data-i18n-placeholder (attributes);
//                                  on a document it also sets <html lang>
//   i18n.set('hu')                 switches: stores the choice and tells the other pages
//   i18n.onChange((lang) => ...)   called after the language changed, here or in another page
//
// The choice lives in localStorage under LANG_KEY, shared by every page of the origin, so a reload
// keeps it and the shell and its module frames agree. A change reaches the other pages through the
// storage event, and the frames of the page that made it also through a postMessage
// { type: 'groundwork:lang', lang } (accepted only from the page's own origin).

const LANG_KEY = 'groundwork:ui-lang'
const DEFAULT_LANG = 'en'
// Each language named in itself, for a language picker.
const LANGS = { en: 'English', hu: 'Magyar' }
const MESSAGE = 'groundwork:lang'

const defaultStorage = () => { try { return globalThis.localStorage ?? null } catch { return null } }

function createI18n(strings, { storage = defaultStorage(), win = globalThis.window ?? null } = {}) {
  const known = (l) => (typeof l === 'string' && Object.hasOwn(strings, l) ? l : null)
  const read = () => { try { return known(storage?.getItem(LANG_KEY)) } catch { return null } }
  let lang = read() ?? DEFAULT_LANG
  const listeners = new Set()

  const change = (next) => {
    next = known(next) ?? DEFAULT_LANG
    if (next === lang) return false
    lang = next
    for (const fn of listeners) fn(lang)
    return true
  }

  const t = (key, vars) => {
    const text = strings[lang]?.[key] ?? strings[DEFAULT_LANG]?.[key] ?? key
    return vars ? text.replace(/\{(\w+)\}/g, (m, name) => (name in vars ? String(vars[name]) : m)) : text
  }

  win?.addEventListener?.('storage', (e) => { if (e.key === LANG_KEY) change(e.newValue) })
  win?.addEventListener?.('message', (e) => {
    if (e.origin === win.location?.origin && e.data?.type === MESSAGE) change(e.data.lang)
  })

  return {
    get lang() { return lang },
    t,
    set(next) {
      if (!change(next)) return
      try { storage?.setItem(LANG_KEY, lang) } catch {}
      const origin = win?.location?.origin
      for (const f of Array.from(win?.frames ?? [])) {
        try { f.postMessage({ type: MESSAGE, lang }, origin && origin !== 'null' ? origin : '*') } catch {}
      }
    },
    onChange(fn) { listeners.add(fn); return () => listeners.delete(fn) },
    apply(root) {
      if (root.documentElement) root.documentElement.lang = lang
      for (const el of root.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n)
      for (const attr of ['title', 'aria-label', 'placeholder']) {
        for (const el of root.querySelectorAll(`[data-i18n-${attr}]`)) el.setAttribute(attr, t(el.getAttribute(`data-i18n-${attr}`)))
      }
    },
  }
}
</script>

    'live.refresh': 'Refresh now',
    'live.change': 'Another folder',

<script>
(() => {
'use strict';

// The UI language: English by default, Hungarian too; the choice is shared with the shell.
const i18n = createI18n(BUILD_STRINGS);
const ui = i18n.t;

// ───────────────────────── Constants ─────────────────────────

// The Build module's endpoints on the core server, when the page is loaded
// from it. The same values are in modules/build/module.mjs.
const SERVER_ID = 'development-status';
const SERVER_API = '/api/build';
const SERVER_TIMEOUT_MS = 8000;
const VERSION = '2.2.0';   // the same in module.mjs; the header comment lists the versions

const DEFAULT_TRACKER_DIR = '.scratch';
const ADR_DIRS = ['docs/adr', 'doc/adr', 'docs/adrs', 'docs/decisions', 'adr'];
// Never descended into while looking for the tracker, nor below an area.
// The server (project-reader.mjs) keeps the same two sets out of
// its file list: change them together.
const SKIP_DIRS = new Set(['node_modules', '.git', '.hg', '.svn', 'target', 'dist', 'build', 'out', 'vendor', 'worktrees', '.cache', '.next', '.venv', '__pycache__']);
const ALWAYS_SKIP = new Set(['node_modules', '.git', '.hg', '.svn']);
// The project's own top-level documents: the README names the project; the
// domain glossary is GLOSSARY.md (CONTEXT.md before v1.3 of the skills).
const README_FILE = /^readme\.(md|markdown)$/i;
const GLOSSARY_FILE = /^(glossary|glossary-map|context)\.(md|markdown)$/i;
const POLL_MS = 3000;
const FRESH_MS = 90000;
const MAX_DEPTH = 8;

const CLOSED = new Set(['done', 'closed', 'wontfix', 'resolved', 'legacy']);
const UNPARSED = '?';
const GROUPS = [
  { id: 'agent', title: 'group.agent', hint: 'group.agent.hint', has: (s) => s === 'ready-for-agent' },
  { id: 'human', title: 'group.human', hint: 'group.human.hint', has: (s) => s === 'ready-for-human' || s === 'needs-info' || s === 'needs-triage' },
  { id: 'test', title: 'group.test', hint: 'group.test.hint', has: (s) => /^needs-.*test$/.test(s) },
  { id: 'claimed', title: 'group.claimed', hint: 'group.claimed.hint', has: (s) => s === 'claimed' },
];
const VIEWS = [
  ['waiting', 'view.waiting'], ['areas', 'view.areas'], ['deps', 'view.deps'],
  ['activity', 'view.activity'], ['checks', 'view.checks'], ['docs', 'view.docs'], ['git', 'view.git'],
];
const GIT_PAGE = 400;     // commits asked for at once; "Earlier commits" asks for this many more
const GIT_ROW_H = 28;     // px, one commit
const GIT_LANE_W = 16;    // px, one lane of the graph
const GIT_COLORS = 8;     // --g0 … --g7
const NO_REPO = 'no-repo'; // gitState.error when the folder is not the top of a git repository

// ───────────────────────── Small helpers ─────────────────────────

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fold = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const joinPath = (a, b) => (a ? a + '/' + b : b);
const clock = (d) => d.toLocaleTimeString(i18n.lang, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const plainInline = (s) => s.replace(/`([^`]*)`/g, '$1').replace(/\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/(\*\*|__)(.*?)\1/g, '$2').replace(/(^|[^\w\\])_([^_\s][^_]*?)_(?!\w)/g, '$1$2').trim();

function statusTone(status) {
  if (status === UNPARSED) return 'bad';
  if (status === 'ready-for-agent') return 'agent';
  if (status === 'ready-for-human' || status === 'needs-info' || status === 'needs-triage') return 'human';
  if (/^needs-.*test$/.test(status)) return 'test';
  if (status === 'claimed') return 'claimed';
  if (status === 'done' || status === 'resolved' || status === 'closed') return 'done';
  if (CLOSED.has(status)) return 'dropped';
  return 'neutral';
}
const statusName = (status) => (status === UNPARSED ? ui('status.unparsed') : status);
const isClosed = (t) => CLOSED.has(t.status);
const chip = (status, extra = '') => `<span class="chip t-${statusTone(status)}${CLOSED.has(status) ? ' closed' : ''}">${esc(statusName(status))}${extra}</span>`;

// ───────────────────────── Reading the folder ─────────────────────────
// Four ways to get at a folder share one small adapter: list a directory's
// children, and turn a file node into a File (or what stands for one: size,
// lastModified, text()).

const handleAdapter = {
  async children(dir) {
    const out = [];
    for await (const h of dir.values()) out.push({ name: h.name, isDir: h.kind === 'directory', node: h });
    return out;
  },
  file: (h) => h.getFile(),
};

// Dropped folders where the browser has no file system handles (Firefox, Safari).
const entryAdapter = {
  children(dir) {
    return new Promise((resolve, reject) => {
      const reader = dir.createReader();
      const all = [];
      const step = () => reader.readEntries((batch) => {
        if (!batch.length) return resolve(all.map((e) => ({ name: e.name, isDir: e.isDirectory, node: e })));
        all.push(...batch);
        step();
      }, reject);
      step();
    });
  },
  file: (e) => new Promise((resolve, reject) => e.file(resolve, reject)),
};

// A flat list of paths as a tree: the file list of <input webkitdirectory>,
// and the list the launcher's server sends.
const treeAdapter = {
  children: async (dir) => [...dir.children.values()],
  file: async (node) => node.file,
};

function treeDir(root, parts) {
  let dir = root;
  for (const part of parts) {
    let child = dir.children.get(part);
    if (!child) { child = { name: part, isDir: true, node: { children: new Map() } }; dir.children.set(part, child); }
    dir = child.node;
  }
  return dir;
}

function treeFromFiles(fileList) {
  const root = { children: new Map() };
  let name = '';
  for (const f of fileList) {
    const parts = (f.webkitRelativePath || f.name).split('/');
    if (parts.length > 1) name = parts.shift();
    const last = parts.pop();
    treeDir(root, parts).children.set(last, { name: last, isDir: false, node: { file: f } });
  }
  return { root, name };
}

// The launcher's server: one request lists every markdown file (path, size,
// time) and each folder's count of other files; a file's text is asked for
// only when it changed.
class ServerDownError extends Error {
  constructor(message) { super(message); this.name = 'ServerDownError'; }
}

async function serverFetch(path) {
  const stop = new AbortController();
  const timeout = setTimeout(() => stop.abort(), SERVER_TIMEOUT_MS);
  try {
    return await fetch(SERVER_API + path, { cache: 'no-store', signal: stop.signal });
  } catch (err) {
    throw new ServerDownError(ui('error.server-down'));
  } finally {
    clearTimeout(timeout);
  }
}

async function serverJson(path) {
  const res = await serverFetch(path);
  let data = null;
  try { data = res.ok ? await res.json() : null; } catch (err) { data = null; }
  // Anything else on this address is not the launcher: as good as stopped.
  if (!data || data.server !== SERVER_ID) throw new ServerDownError(ui('error.not-our-server'));
  return data;
}

async function serverText(path) {
  const res = await serverFetch('/file?path=' + encodeURIComponent(path));
  if (!res.ok) throw new Error(path + ': HTTP ' + res.status);
  return res.text();
}

function treeFromListing(listing) {
  const root = { children: new Map() };
  for (const [path, others] of Object.entries(listing.dirs || {})) {
    const dir = treeDir(root, path ? path.split('/') : []);
    // Stand-ins for the files that are not markdown: only their number is known.
    // No real file name holds a slash.
    for (let i = 0; i < others; i++) dir.children.set('/' + i, { name: '/' + i, isDir: false, node: {} });
  }
  for (const f of listing.files || []) {
    const parts = f.path.split('/');
    const last = parts.pop();
    treeDir(root, parts).children.set(last, { name: last, isDir: false, node: { file: { size: f.size, lastModified: f.mtime, text: () => serverText(f.path) } } });
  }
  return root;
}

// Is the page loaded from the launcher's server? Asked, not guessed from the
// protocol: served by anything else, the page falls back to the folder picker.
async function findServer() {
  if (!/^https?:$/.test(location.protocol)) return null;
  try { return await serverJson('/hello'); } catch (err) { return null; }
}

function serverSource(hello) {
  const src = { adapter: treeAdapter, root: { children: new Map() }, name: hello.name || '', live: true, server: location.host, launcher: hello.launcher || '', version: hello.version || '', git: !!hello.git };
  src.reload = async () => {
    const listing = await serverJson('/list');
    src.root = treeFromListing(listing);
    src.name = listing.name || src.name;
    src.roots = null;   // the tree is new: find the tracker in it again
  };
  return src;
}

const childDirs = async (A, dir, skip) => (await A.children(dir)).filter((c) => c.isDir && !skip.has(c.name));

async function findChild(A, dir, path) {
  let node = dir;
  for (const part of path.split('/')) {
    const hit = (await A.children(node)).find((c) => c.isDir && c.name === part);
    if (!hit) return null;
    node = hit.node;
  }
  return node;
}

// A tracker is a folder whose subfolders (the areas) hold an "issues" folder.
async function looksLikeTracker(A, dir) {
  for (const area of await childDirs(A, dir, ALWAYS_SKIP)) {
    if ((await A.children(area.node)).some((c) => c.isDir && c.name.toLowerCase() === 'issues')) return true;
  }
  return false;
}

async function locate(src) {
  const A = src.adapter;
  const roots = { tracker: null, adr: null };
  const preferred = await findChild(A, src.root, DEFAULT_TRACKER_DIR);
  if (preferred && await looksLikeTracker(A, preferred)) roots.tracker = { node: preferred, path: DEFAULT_TRACKER_DIR };
  else if (await looksLikeTracker(A, src.root)) roots.tracker = { node: src.root, path: '' };
  else {
    let level = [{ node: src.root, path: '' }];
    search: for (let depth = 0; depth < 3; depth++) {
      const next = [];
      for (const at of level) {
        for (const c of await childDirs(A, at.node, SKIP_DIRS)) {
          const here = { node: c.node, path: joinPath(at.path, c.name) };
          if (await looksLikeTracker(A, c.node)) { roots.tracker = here; break search; }
          next.push(here);
        }
      }
      level = next;
    }
    if (!roots.tracker && preferred) roots.tracker = { node: preferred, path: DEFAULT_TRACKER_DIR };
  }
  for (const path of ADR_DIRS) {
    const node = await findChild(A, src.root, path);
    if (node) { roots.adr = { node, path }; break; }
  }
  return roots;
}

async function walk(A, dir, path, depth, skipFrom, out) {
  const kids = await A.children(dir);
  await Promise.all(kids.map(async (c) => {
    const p = joinPath(path, c.name);
    if (c.isDir) {
      const skip = depth >= skipFrom ? SKIP_DIRS : ALWAYS_SKIP;
      if (skip.has(c.name) || depth >= MAX_DEPTH) return;
      await walk(A, c.node, p, depth + 1, skipFrom, out);
    } else if (/\.(md|markdown)$/i.test(c.name)) {
      const f = await A.file(c.node);
      out.entries.push({ path: p, size: f.size, mtime: f.lastModified, file: f });
    } else {
      out.others.push(p);
    }
  }));
}

// One pass over the folder: every markdown file of the tracker and the ADR
// folder with its size and time, without reading any content.
async function scan(src) {
  const A = src.adapter;
  if (src.reload) await src.reload();
  if (!src.roots || (!src.roots.tracker && Date.now() - src.located > 15000)) {
    src.roots = await locate(src);
    src.located = Date.now();
  }
  const out = { entries: [], others: [] };
  const top = await A.children(src.root);
  for (const c of top) {
    if (c.isDir || !(README_FILE.test(c.name) || GLOSSARY_FILE.test(c.name))) continue;
    const f = await A.file(c.node);
    out.entries.push({ path: c.name, size: f.size, mtime: f.lastModified, file: f });
  }
  const { tracker, adr } = src.roots;
  if (tracker) await walk(A, tracker.node, tracker.path, 0, 1, out);
  if (adr && !(tracker && (adr.path + '/').startsWith(tracker.path + '/'))) await walk(A, adr.node, adr.path, 0, 0, out);
  const seen = new Set();
  out.entries = out.entries.filter((e) => !seen.has(e.path) && seen.add(e.path));
  out.trackerPath = tracker ? tracker.path : null;
  out.adrPath = adr ? adr.path : null;
  return out;
}

// ───────────────────────── Parsing ─────────────────────────

const FIELD = /^\s*(?:[-*+]\s+)?\*{0,2}(status|issue|blocked by|earlier name|type)\*{0,2}\s*:\*{0,2}\s*(.*)$/i;
const COMMENTS_HEADING = /^##\s+(comments?|megjegyzések|hozzászólások)\s*$/i;   // reads Hungarian files too
const NO_BLOCKER = /^(none|nincs|semmi|nothing|n\/a|[—–-]+)(?![\p{L}\p{N}])/iu;

function firstHeading(lines) {
  for (const l of lines) {
    const m = /^#{1,6}\s+(.*?)\s*#*$/.exec(l);
    if (m) return plainInline(m[1]);
  }
  return '';
}

// "#41, 12 (#30), [other-area 3](…)" → references; free text is kept as a note.
function parseBlockedBy(raw) {
  let s = raw.replace(/`/g, '').trim();
  if (!s || NO_BLOCKER.test(s)) return { none: true, refs: [], raw };
  s = s.replace(/\[([^\]]*)\]\([^)]*\)/g, (m, text) => {
    const list = /^([\w.-]+)\s+(\d+(?:\s*,\s*\d+)+)$/.exec(text.trim());
    return list ? list[2].split(/\s*,\s*/).map((n) => list[1] + ' ' + n).join(', ') : text;
  });
  // Split on top-level commas; stop at the first top-level ";" or ": ".
  const items = [];
  let depth = 0, cur = '';
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '(') depth++;
    else if (ch === ')') depth = Math.max(0, depth - 1);
    if (depth === 0 && (ch === ';' || (ch === ':' && /\s/.test(s[i + 1] || ' ')) || (/[—–]/.test(ch) && /\s/.test(s[i - 1] || '')))) break;
    if (depth === 0 && ch === ',') { items.push(cur); cur = ''; } else cur += ch;
  }
  items.push(cur);
  const refs = [];
  for (const item of items) {
    const outside = item.replace(/\([^()]*(?:\([^()]*\)[^()]*)*\)/g, ' ').trim();
    const inside = (item.match(/\(([^()]*)\)/) || [])[1] || '';
    const hashes = [...outside.matchAll(/#(\d+)/g)].map((m) => ({ kind: 'issue', num: +m[1], raw: '#' + m[1] }));
    if (hashes.length) { refs.push(...hashes); continue; }
    const m = /^(?:([\w.-]*[A-Za-z][\w.-]*)\s+)?(\d+)\b/.exec(outside);
    const alt = /^#(\d+)$/.exec(inside.trim());
    if (m) refs.push({ kind: 'local', area: m[1] || null, num: +m[2], raw: (m[1] ? m[1] + ' ' : '') + m[2], alt: alt ? +alt[1] : null });
    else if (alt) refs.push({ kind: 'issue', num: +alt[1], raw: '#' + alt[1] });
    else if (outside) refs.push({ kind: 'text', raw: outside });
  }
  return { none: false, refs, raw };
}

function parseTicket(path, area, fileName, text) {
  const lines = text.replace(/\r\n?/g, '\n').split('\n');
  const t = { kind: 'ticket', path, area, fileName, text, fields: {} };

  let headEnd = lines.findIndex((l, i) => i > 0 && /^##\s/.test(l));
  if (headEnd < 0 || headEnd > 40) headEnd = Math.min(lines.length, 40);
  for (let i = 0; i < headEnd; i++) {
    const m = FIELD.exec(lines[i]);
    if (m && !(m[1].toLowerCase() in t.fields)) t.fields[m[1].toLowerCase()] = m[2].trim();
  }

  const h1 = (lines.find((l) => /^#\s+/.test(l)) || '').replace(/^#\s+/, '').trim();
  const h1m = /^(#?)(\d+)\s*[:.–—-]\s*(.*)$/.exec(h1);
  t.title = plainInline(h1m ? h1m[3] : h1) || fileName;
  const fm = /^(\d+)/.exec(fileName);
  const issueField = /#?(\d+)/.exec(t.fields.issue || '');
  t.fileNum = fm ? fm[1] : null;
  t.issue = issueField ? +issueField[1] : h1m && h1m[1] ? +h1m[2] : fm && fm[1].length >= 3 ? +fm[1] : null;
  t.local = t.issue == null ? (fm ? fm[1] : h1m ? h1m[2] : null) : null;
  t.label = t.issue != null ? '#' + t.issue : t.local != null ? area + ' ' + t.local : fileName;
  t.mismatch = issueField && fm && fm[1].length >= 3 && +fm[1] !== +issueField[1] ? { file: +fm[1], field: +issueField[1] } : null;
  t.earlier = t.fields['earlier name'] || '';
  t.type = t.fields.type || '';

  const headingsEnd = (() => { const c = lines.findIndex((l) => COMMENTS_HEADING.test(l)); return c < 0 ? lines.length : c; })();
  // The issue template's form: a "## Blocked by" (or "## Status") heading with
  // the value, or a list of values, under it.
  const section = (name) => {
    const at = lines.findIndex((l, i) => i < headingsEnd && new RegExp('^#{2,4}\\s+' + name + '\\s*:?\\s*$', 'i').test(l));
    if (at < 0) return null;
    const items = [];
    for (let j = at + 1; j < lines.length && !/^#{1,6}\s/.test(lines[j]); j++) {
      const l = lines[j].trim();
      if (!l) { if (items.length) break; continue; }
      items.push(l.replace(/^(?:[-*+]|\d+[.)])\s+/, ''));
    }
    return items.length ? items : null;
  };
  if (!('status' in t.fields)) {
    const st = section('status');
    if (st) t.fields.status = st[0];
  }

  // Status: the first word is the state, the rest is the free-text note.
  t.statusLine = 'status' in t.fields;
  const sv = (t.fields.status || '').replace(/^[`*_\s]+/, '');
  const sm = /^([\p{L}][\p{L}\p{N}_-]*)[`*_]*\s*(.*)$/u.exec(sv);
  if (sm) {
    t.status = sm[1].toLowerCase();
    let note = sm[2].trim().replace(/^[—–\-:;,.]+\s*/, '');
    if (/^\(.*\)\.?$/.test(note) && balanced(note.replace(/\.$/, '').slice(1, -1))) note = note.replace(/\.$/, '').slice(1, -1);
    t.statusNote = note;
  } else {
    t.status = UNPARSED;
    t.statusNote = t.statusLine ? (t.fields.status || '') : '';
  }

  if ('blocked by' in t.fields) t.blockedBy = parseBlockedBy(t.fields['blocked by']);
  else {
    const list = section('blocked by');
    if (list) {
      t.fields['blocked by'] = list.join(', ');
      const parts = list.map(parseBlockedBy);
      const refs = parts.flatMap((p) => p.refs);
      t.blockedBy = { none: !refs.length, refs, raw: t.fields['blocked by'] };
    } else t.blockedBy = { none: true, refs: [], raw: '' };
  }

  // Checkboxes count in the whole file: a collector ticket (#45) adds its open items in dated
  // sections under the comments. Dated headings are the comments.
  let commentsAt = lines.findIndex((l) => COMMENTS_HEADING.test(l));
  const bodyEnd = commentsAt < 0 ? lines.length : commentsAt;
  let done = 0, total = 0, fence = false;
  for (let i = 0; i < lines.length; i++) {
    if (/^\s*(```|~~~)/.test(lines[i])) { fence = !fence; continue; }
    if (fence) continue;
    const m = /^\s*(?:[-*+]|\d+[.)])\s+\[( |x|X)\]\s/.exec(lines[i]);
    if (m) { total++; if (m[1] !== ' ') done++; }
  }
  t.checks = { done, total };
  t.comments = [];
  for (let i = 0; i < lines.length; i++) {
    const m = /^#{3,5}\s+(.*?)(\d{4}-\d{2}-\d{2})(.*)$/.exec(lines[i]) || (i > bodyEnd ? /^\*\*()(\d{4}-\d{2}-\d{2})([^*]*)\*\*\s*$/.exec(lines[i]) : null);
    if (!m) continue;
    const title = plainInline((m[1] + ' ' + m[3]).replace(/^[\s,:.–—-]+/, '').replace(/\s+/g, ' '));
    t.comments.push({ date: m[2], title, order: i });
  }
  t.lastComment = t.comments.reduce((max, c) => (c.date > max ? c.date : max), '');
  t.hay = fold(t.label + ' ' + (t.issue != null ? t.issue + ' ' : '') + t.title + '\n' + text);
  return t;
}

function balanced(s) {
  let d = 0;
  for (const ch of s) { if (ch === '(') d++; else if (ch === ')' && --d < 0) return false; }
  return d === 0;
}

function parseAdr(path, text) {
  const lines = text.replace(/\r\n?/g, '\n').split('\n');
  const name = path.split('/').pop();
  const num = (/^(\d+)/.exec(name) || [])[1] || '';
  let status = '';
  const head = lines.slice(0, 30);
  for (let i = 0; i < head.length && !status; i++) {
    const l = head[i];
    let m = /^\s*(?:[-*]\s+)?\*{0,2}(?:status|státusz|állapot)\*{0,2}\s*:\*{0,2}\s*(.+)$/i.exec(l);   // reads Hungarian files too
    if (m) status = m[1];
    else if (/^##\s+(status|státusz|állapot)\s*$/i.test(l)) status = head.slice(i + 1).find((x) => x.trim()) || '';   // reads Hungarian files too
    else if ((m = /^>\s*\*\*([^*]+?)[.:]?\*\*/.exec(l))) status = m[1];
  }
  return { kind: 'adr', path, num, title: firstHeading(lines) || name, status: plainInline(status).slice(0, 60), text, hay: fold(name + ' ' + text) };
}

// Everything the views need, from the texts alone.
function buildModel(folderName, files, others, trackerPath, adrPath) {
  const m = {
    folderName, trackerPath, adrPath, tickets: [], docs: [], adrs: [], glossaries: [], areas: new Map(),
    byPath: new Map(), byIssue: new Map(), byLocal: new Map(), problems: [],
  };
  const area = (name) => {
    if (!m.areas.has(name)) m.areas.set(name, { name, spec: null, tickets: [], docs: [], extras: 0 });
    return m.areas.get(name);
  };
  const prefix = trackerPath ? trackerPath + '/' : '';

  for (const [path, file] of files) {
    const topDoc = !path.includes('/') && (README_FILE.test(path) || GLOSSARY_FILE.test(path));
    const inTracker = trackerPath != null && path.startsWith(prefix) && (prefix || !topDoc);
    if (adrPath && path.startsWith(adrPath + '/')) {
      const adr = parseAdr(path, file.text);
      m.adrs.push(adr);
      m.byPath.set(path, adr);
    } else if (inTracker) {
      const rel = path.slice(prefix.length);
      const tm = /^(.+)\/issues\/([^/]+)\.(?:md|markdown)$/i.exec(rel);
      if (tm) {
        const t = parseTicket(path, tm[1], tm[2], file.text);
        m.tickets.push(t);
        area(tm[1]).tickets.push(t);
        m.byPath.set(path, t);
        continue;
      }
      const seg = rel.includes('/') ? rel.slice(0, rel.indexOf('/')) : '';
      const lines = file.text.split('\n', 60);
      const isSpec = /^spec\.(md|markdown)$/i.test(rel.slice(seg.length + 1)) && seg !== '';
      // The /to-spec template has no title line: it starts at "## Problem Statement".
      const h1 = lines.find((l) => /^#\s+\S/.test(l));
      const title = isSpec ? (h1 ? plainInline(h1.replace(/^#\s+/, '').replace(/\s*#*\s*$/, '')) : seg + ' – spec') : firstHeading(lines) || rel;
      const doc = { kind: isSpec ? 'spec' : 'doc', path, area: seg, rel: seg ? rel.slice(seg.length + 1) : rel, title, text: file.text };
      doc.hay = fold(doc.path + ' ' + doc.title);
      m.docs.push(doc);
      m.byPath.set(path, doc);
      if (isSpec) area(seg).spec = doc; else area(seg).docs.push(doc);
    } else {
      const isReadme = README_FILE.test(path);
      const doc = { kind: isReadme ? 'readme' : 'glossary', path, area: '', rel: path, title: firstHeading(file.text.split('\n', 60)) || path, text: file.text };
      doc.hay = fold(doc.path + ' ' + doc.title);
      if (isReadme) m.readme = doc; else m.glossaries.push(doc);
      m.byPath.set(path, doc);
    }
  }
  for (const p of others) {
    if (trackerPath == null || !p.startsWith(prefix)) continue;
    const rel = p.slice(prefix.length);
    if (rel.includes('/') && m.areas.has(rel.slice(0, rel.indexOf('/')))) m.areas.get(rel.slice(0, rel.indexOf('/'))).extras++;
  }
  m.projectName = (m.readme && m.readme.title) || folderName || '';

  // Numbering: an issue number is global; an older ticket is "<area> <number>".
  const push = (map, key, t) => { if (!map.has(key)) map.set(key, []); map.get(key).push(t); };
  for (const t of m.tickets) {
    if (t.issue != null) push(m.byIssue, t.issue, t);
    else if (t.local != null) push(m.byLocal, t.area + '/' + +t.local, t);
  }
  const alias = new Map();
  for (const t of m.tickets) {
    const e = /^(.+?)\s+(\d+)$/.exec(t.earlier);
    if (e) alias.set(e[1] + '/' + +e[2], t);
  }
  const local = (areaName, num) => (m.byLocal.get(areaName + '/' + num) || [])[0] || alias.get(areaName + '/' + num) || null;
  const issue = (num) => (m.byIssue.get(num) || [])[0] || null;
  m.resolveIssue = issue;
  m.resolveLocal = local;
  // A blocker named by its title or its file name ("Blocked by: Store the
  // label", or "01-store-the-label"): /to-tickets allows "numbers/titles".
  const nameKey = (s) => fold(plainInline(s)).replace(/^["'„“]+|["'”.]+$/g, '').replace(/[\s_-]+/g, ' ').trim();
  const byName = new Map();
  for (const t of m.tickets) {
    for (const key of new Set([nameKey(t.title), nameKey(t.fileName), nameKey(t.fileName.replace(/^\d+[\s_-]*/, ''))])) if (key) push(byName, key, t);
  }
  const named = (areaName, raw) => {
    const list = byName.get(nameKey(raw)) || [];
    const here = list.filter((x) => x.area === areaName);
    return here.length === 1 ? here[0] : list.length === 1 ? list[0] : null;
  };

  for (const t of m.tickets) {
    t.blockers = [];
    t.notes = [];
    for (const r of t.blockedBy.refs) {
      let hit = null;
      if (r.kind === 'text') {
        hit = named(t.area, r.raw);
        if (!hit) { t.notes.push(r.raw); continue; }
      } else if (r.kind === 'issue') hit = issue(r.num) || (t.issue == null ? local(t.area, r.num) : null);
      else if (r.area) hit = local(r.area, r.num);
      else hit = local(t.area, r.num) || (r.alt != null ? issue(r.alt) : null) || issue(r.num);
      if (hit === t) continue;
      if (!t.blockers.some((b) => b.ticket && b.ticket === hit)) t.blockers.push({ raw: r.raw, ticket: hit });
    }
    t.dependents = [];
  }
  for (const t of m.tickets) for (const b of t.blockers) if (b.ticket) b.ticket.dependents.push(t);
  for (const t of m.tickets) t.blocked = !isClosed(t) && t.blockers.some((b) => b.ticket && !isClosed(b.ticket));

  const order = (t) => (t.issue != null ? [0, t.issue, ''] : [1, +t.local || 0, t.area]);
  m.tickets.sort((a, b) => {
    const x = order(a), y = order(b);
    return x[0] - y[0] || (x[0] ? x[2].localeCompare(y[2]) : 0) || x[1] - y[1] || a.path.localeCompare(b.path);
  });
  m.adrs.sort((a, b) => a.path.localeCompare(b.path));
  m.docs.sort((a, b) => a.path.localeCompare(b.path));
  for (const a of m.areas.values()) {
    a.open = a.tickets.filter((t) => !isClosed(t)).length;
    a.closed = a.tickets.length - a.open;
  }
  m.areaList = [...m.areas.values()].sort((a, b) => (b.open > 0) - (a.open > 0) || a.name.localeCompare(b.name));
  m.statusCounts = new Map();
  for (const t of m.tickets) m.statusCounts.set(t.status, (m.statusCounts.get(t.status) || 0) + 1);
  m.open = m.tickets.filter((t) => !isClosed(t));
  const names = [...m.areas.keys()].filter(Boolean).sort((a, b) => b.length - a.length).map((n) => n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  m.areaRef = names.length ? new RegExp('(^|[^\\w/.-])((' + names.join('|') + ')\\s(\\d{1,4}))(?![\\w-])', 'g') : null;

  m.comments = [];
  for (const t of m.tickets) for (const c of t.comments) m.comments.push({ ...c, ticket: t });
  m.comments.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0) || b.order - a.order);

  findProblems(m);
  return m;
}

function findProblems(m) {
  const add = (kind, tickets, text) => m.problems.push({ kind, tickets, text });
  for (const t of m.tickets) {
    if (!t.statusLine) add('no-status', [t], () => ui('problem.no-status.text'));
    else if (t.status === UNPARSED) add('bad-status', [t], () => (t.statusNote ? ui('problem.bad-status.text', { line: t.statusNote }) : ui('problem.bad-status.empty')));
    if (t.status === 'ready-for-agent' && t.checks.total > 0 && t.checks.done === t.checks.total) add('all-checked', [t], () => ui('problem.all-checked.text', { n: t.checks.total }));
    const missing = t.blockers.filter((b) => !b.ticket);
    if (missing.length) add('missing-blocker', [t], () => ui('problem.missing-blocker.text', { list: missing.map((b) => b.raw).join(', ') }));
    if (!isClosed(t) && t.blockers.length && t.blockers.every((b) => b.ticket && isClosed(b.ticket))) add('released', [t], () => ui('problem.released.text', { list: t.blockers.map((b) => b.ticket.label).join(', ') }));
    if (t.mismatch) add('mismatch', [t], () => ui('problem.mismatch.text', { file: t.mismatch.file, field: t.mismatch.field }));
    if (t.issue == null && t.local == null) add('no-number', [t], () => ui('problem.no-number.text'));
  }
  for (const [num, list] of m.byIssue) if (list.length > 1) add('duplicate', list, () => ui('problem.duplicate.issue', { n: list.length, num }));
  for (const [key, list] of m.byLocal) if (list.length > 1) add('duplicate', list, () => ui('problem.duplicate.local', { n: list.length, key: key.replace('/', ' ') }));
}

const PROBLEM_KINDS = [
  ['duplicate', 'problem.duplicate'],
  ['no-status', 'problem.no-status'],
  ['bad-status', 'problem.bad-status'],
  ['all-checked', 'problem.all-checked'],
  ['missing-blocker', 'problem.missing-blocker'],
  ['released', 'problem.released', true],
  ['mismatch', 'problem.mismatch'],
  ['no-number', 'problem.no-number'],
];

// Kinds that are worth knowing but are not a contradiction: not counted as a warning.
const INFO_KINDS = new Set(PROBLEM_KINDS.filter((k) => k[2]).map((k) => k[0]));

// ───────────────────────── Markdown ─────────────────────────
// A small renderer for what the tickets use. Every piece of source text goes
// through esc() before it becomes HTML; raw HTML in the markdown is shown as text.

const LIST_ITEM = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const lead = (l) => l.length - l.trimStart().length;
const isOrdered = (m) => /\d/.test(m[2]);
const isBlockStart = (l) => /^\s*(#{1,6}\s|```|~~~|>)/.test(l) || /^\s*([-*_])(\s*\1){2,}\s*$/.test(l);
const TABLE_RULE = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;

function splitRow(line) {
  const cells = [];
  let cur = '', code = false;
  const s = line.trim().replace(/^\|/, '').replace(/\|\s*$/, (m0, off, str) => (str[off - 1] === '\\' ? m0 : ''));
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '`') code = !code;
    if (ch === '\\' && s[i + 1] === '|') { cur += '|'; i++; continue; }
    if (ch === '|' && !code) { cells.push(cur.trim()); cur = ''; } else cur += ch;
  }
  cells.push(cur.trim());
  return cells;
}

function renderMarkdown(text, ctx) {
  return renderBlocks(text.replace(/\r\n?/g, '\n').replace(/[\u0001\u0002]/g, '').replace(/\t/g, '    ').split('\n'), ctx);
}

function renderBlocks(lines, ctx) {
  const out = [];
  let para = [];
  const flush = () => {
    if (!para.length) return;
    // A line that starts a "**Field:** value" pair keeps its own line.
    const joined = para.map((l, i) => (i && (/^\*\*[^*]+:\*\*/.test(l.trim()) || /( {2}|\\)$/.test(para[i - 1])) ? '\u0001br\u0002' : i ? ' ' : '') + l.trim().replace(/\\$/, '')).join('');
    out.push('<p>' + renderInline(joined.replace(/\u0001br\u0002/g, '\n'), ctx).replace(/\n/g, '<br>') + '</p>');
    para = [];
  };
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { flush(); i++; continue; }

    const fence = /^(\s*)(```+|~~~+)(.*)$/.exec(line);
    if (fence) {
      flush();
      const body = [];
      i++;
      while (i < lines.length && !new RegExp('^\\s*' + fence[2][0] + '{' + fence[2].length + ',}\\s*$').test(lines[i])) body.push(lines[i++].slice(Math.min(fence[1].length, lead(lines[i - 1]))));
      i++;
      out.push('<pre><code>' + esc(body.join('\n')) + '</code></pre>');
      continue;
    }
    const h = /^(#{1,6})\s+(.*?)\s*#*\s*$/.exec(line);
    if (h) { flush(); out.push(`<h${h[1].length}>${renderInline(h[2], ctx)}</h${h[1].length}>`); i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flush(); out.push('<hr>'); i++; continue; }
    if (/^\s*>/.test(line)) {
      flush();
      const body = [];
      while (i < lines.length && (/^\s*>/.test(lines[i]) || (lines[i].trim() && body.length && !isBlockStart(lines[i]) && !LIST_ITEM.test(lines[i])))) body.push(lines[i++].replace(/^\s*>\s?/, ''));
      out.push('<blockquote>' + renderBlocks(body, ctx) + '</blockquote>');
      continue;
    }
    if (line.includes('|') && i + 1 < lines.length && TABLE_RULE.test(lines[i + 1]) && lines[i + 1].includes('-') && lines[i + 1].includes('|')) {
      flush();
      const head = splitRow(line);
      const align = splitRow(lines[i + 1]).map((c) => (/^:-+:$/.test(c) ? 'center' : /-:$/.test(c) ? 'right' : ''));
      const cell = (tag, c, k) => `<${tag}${align[k] ? ` style="text-align:${align[k]}"` : ''}>${renderInline(c, ctx)}</${tag}>`;
      let html = '<div class="tw"><table><thead><tr>' + head.map((c, k) => cell('th', c, k)).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && lines[i].trim() && lines[i].includes('|')) html += '<tr>' + splitRow(lines[i++]).map((c, k) => cell('td', c, k)).join('') + '</tr>';
      out.push(html + '</tbody></table></div>');
      continue;
    }
    const li = LIST_ITEM.exec(line);
    if (li) {
      flush();
      const base = li[1].length, ordered = isOrdered(li);
      const start = ordered ? parseInt(li[2], 10) : 1;
      const items = [];
      while (i < lines.length) {
        const m = LIST_ITEM.exec(lines[i]);
        if (!m || m[1].length < base || m[1].length >= base + 2 || isOrdered(m) !== ordered) break;
        const inner = m[1].length + m[2].length + 1;
        const body = [m[3]];
        i++;
        while (i < lines.length) {
          const l = lines[i];
          if (!l.trim()) {
            let j = i + 1;
            while (j < lines.length && !lines[j].trim()) j++;
            if (j < lines.length && lead(lines[j]) >= base + 2) { body.push(''); i++; continue; }
            break;
          }
          if (lead(l) >= base + 2) { body.push(l.slice(Math.min(lead(l), inner))); i++; continue; }
          if (LIST_ITEM.test(l) || isBlockStart(l)) break;
          body.push(l.trim());
          i++;
        }
        items.push(body);
        let j = i;
        while (j < lines.length && !lines[j].trim()) j++;
        const next = j > i && j < lines.length ? LIST_ITEM.exec(lines[j]) : null;
        if (next && next[1].length >= base && next[1].length < base + 2 && isOrdered(next) === ordered) i = j;
      }
      const tag = ordered ? 'ol' : 'ul';
      out.push(`<${tag}${ordered && start !== 1 ? ` start="${start}"` : ''}>` + items.map((body) => {
        const task = /^\[( |x|X)\]\s+(.*)$/.exec(body[0]);
        if (task) body = [task[2], ...body.slice(1)];
        let html = renderBlocks(body, ctx);
        const single = /^<p>([\s\S]*?)<\/p>/.exec(html);
        if (single) html = single[1] + html.slice(single[0].length);
        if (!task) return '<li>' + html + '</li>';
        const checked = task[1] !== ' ';
        return `<li class="task${checked ? ' done' : ''}"><input type="checkbox" disabled${checked ? ' checked' : ''} aria-label="${esc(ui(checked ? 'md.done' : 'md.not-done'))}"><span class="t">${html}</span></li>`;
      }).join('') + `</${tag}>`);
      continue;
    }
    para.push(line);
    i++;
    if (i < lines.length && (isBlockStart(lines[i]) || LIST_ITEM.test(lines[i]))) flush();
  }
  flush();
  return out.join('\n');
}

function resolvePath(from, href) {
  const parts = from.split('/').slice(0, -1);
  for (const seg of href.split('/')) {
    if (seg === '..') { if (!parts.length) return null; parts.pop(); } else if (seg && seg !== '.') parts.push(seg);
  }
  return parts.join('/');
}

function renderLink(url, html, ctx) {
  if (/^(https?:|mailto:)/i.test(url)) return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${html}</a>`;
  if (/^[a-z][a-z0-9+.-]*:/i.test(url) || url.startsWith('#') || url.startsWith('//')) return html;
  let target = url.replace(/[#?].*$/, '');
  try { target = decodeURIComponent(target); } catch (e) { /* keep as written */ }
  const path = target.startsWith('/') ? target.slice(1) : resolvePath(ctx.path, target);
  if (path && ctx.model.byPath.has(path)) return `<a href="${docHref(path)}" data-doc="${esc(path)}">${html}</a>`;
  return `<span class="dead" title="${esc(ui('md.dead-link', { url }))}">${html}</span>`;
}

function emphasis(s) {
  return s
    .replace(/\*\*(?=\S)([\s\S]+?)(?<=\S)\*\*/g, '<strong>$1</strong>')
    .replace(/(?<![\w\\])__(?=\S)([\s\S]+?)(?<=\S)__(?!\w)/g, '<strong>$1</strong>')
    .replace(/\*(?=[^\s*])([^*\n]+?)(?<=\S)\*/g, '<em>$1</em>')
    .replace(/(?<![\w\\])_(?=[^\s_])([^_\n]+?)(?<=\S)_(?!\w)/g, '<em>$1</em>')
    .replace(/~~(?=\S)([^~\n]+?)(?<=\S)~~/g, '<del>$1</del>');
}

function ticketRefs(s, ctx) {
  const m = ctx.model;
  s = s.replace(/(^|[^\w&/#])#(\d{1,6})(?![\w#])/g, (all, pre, num) => {
    const t = m.resolveIssue(+num);
    return t && t.path !== ctx.path ? pre + ticketLink(t) : all;
  });
  if (m.areaRef) s = s.replace(m.areaRef, (all, pre, whole, areaName, num) => {
    const t = m.resolveLocal(areaName, +num);
    return t && t.path !== ctx.path ? pre + ticketLink(t, whole) : all;
  });
  return s;
}

function renderInline(src, ctx, noLinks) {
  const stash = [];
  const keep = (html) => '\u0001' + (stash.push(html) - 1) + '\u0002';
  let s = src;
  s = s.replace(/(`+)([\s\S]*?[^`])\1(?!`)/g, (m, ticks, code) => keep('<code>' + esc(code.trim() || code) + '</code>'));
  s = s.replace(/\\([\\`*_{}[\]()#+\-.!|>~])/g, (m, ch) => keep(esc(ch)));
  s = s.replace(/!\[([^\]]*)\]\([^)]*\)/g, (m, alt) => keep('<span class="dead">' + esc(ui('md.image', { alt: alt || ui('md.image-unnamed') })) + '</span>'));
  if (!noLinks) {
    s = s.replace(/\[([^\]\n]+)\]\(\s*<?((?:[^()\s<>]|\([^()\s]*\))+)>?(?:\s+"[^"]*")?\s*\)/g, (m, label, url) => keep(renderLink(url, renderInline(label, ctx, true), ctx)));
    s = s.replace(/<(https?:\/\/[^>\s]+)>/g, (m, url) => keep(renderLink(url, esc(url), ctx)));
    s = s.replace(/\bhttps?:\/\/[^\s<>()\u0001]*[^\s<>().,;:!?"'\u0001„”]/g, (url) => keep(renderLink(url, esc(url), ctx)));
  }
  s = emphasis(esc(s));
  if (!noLinks) s = ticketRefs(s, ctx);
  for (let guard = 0; guard < 6 && s.includes('\u0001'); guard++) s = s.replace(/\u0001(\d+)\u0002/g, (m, k) => stash[+k] ?? '');
  return s;
}

// ───────────────────────── State ─────────────────────────

const STORE_KEY = 'development-status:' + location.pathname;
const state = { view: 'waiting', doc: null, q: '', status: '', area: '', showClosed: false, activityDays: 14 };
const openDetails = new Set();
let source = null;       // { adapter, root, name, live, roots }; from the launcher's server also { server, launcher, reload }
let cache = new Map();   // path → { size, mtime, text }
let model = null;
let changeLog = [];      // newest first: { at, items: [{ path, label, text }] }
let recent = new Map();  // path → time of the last change seen in this session
let lastChecked = null;
let busy = false;
let timer = null;
let lostAccess = false;
let serverDown = false;
let lastOpener = null;
// The git history from the launcher: { data, error, limit, open: Set of hashes, hit }.
let gitState = { data: null, error: '', limit: GIT_PAGE, open: new Set(), hit: '' };

try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
  for (const k of ['status', 'area', 'showClosed']) if (k in saved) state[k] = saved[k];
} catch (e) { /* storage is optional */ }
const saveState = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify({ status: state.status, area: state.area, showClosed: state.showClosed })); } catch (e) { /* optional */ } };

// The folder handle survives a reload in IndexedDB (the permission does not).
function idb(mode, run) {
  return new Promise((resolve) => {
    try {
      const open = indexedDB.open('development-status', 1);
      open.onupgradeneeded = () => open.result.createObjectStore('handles');
      open.onerror = () => resolve(null);
      open.onsuccess = () => {
        try {
          const tx = open.result.transaction('handles', mode);
          const req = run(tx.objectStore('handles'));
          tx.oncomplete = () => resolve(req ? req.result : null);
          tx.onerror = tx.onabort = () => resolve(null);
        } catch (e) { resolve(null); }
      };
    } catch (e) { resolve(null); }
  });
}
const rememberHandle = (h) => idb('readwrite', (s) => s.put(h, STORE_KEY));
const forgetHandle = () => idb('readwrite', (s) => s.delete(STORE_KEY));
const recallHandle = () => idb('readonly', (s) => s.get(STORE_KEY));

// ───────────────────────── Refresh loop ─────────────────────────

function describeChange(path, before, after) {
  if (after && after.kind === 'ticket') {
    if (!before) return { label: after.label, text: () => ui('change.new-ticket', { title: after.title, status: statusName(after.status) }) };
    const parts = [];
    if (before.status !== after.status) parts.push(() => ui('change.status', { from: statusName(before.status), to: statusName(after.status) }));
    if (before.checks.done !== after.checks.done || before.checks.total !== after.checks.total) parts.push(() => ui('change.checks', { from: `${before.checks.done}/${before.checks.total}`, to: `${after.checks.done}/${after.checks.total}` }));
    if (after.comments.length > before.comments.length) { const c = after.comments[after.comments.length - 1]; parts.push(() => ui('change.comment', { title: c.title || ui('activity.untitled') })); }
    if (before.title !== after.title) parts.push(() => ui('change.title', { title: after.title }));
    if (before.fields['blocked by'] !== after.fields['blocked by']) parts.push(() => 'Blocked by: ' + (after.fields['blocked by'] || ui('change.none')));
    return { label: after.label, text: () => parts.map((f) => f()).join('; ') || ui('change.text') };
  }
  const name = path.split('/').slice(-2).join('/');
  if (!after) return { label: before && before.label ? before.label : name, text: () => ui('change.deleted') };
  return { label: name, text: () => ui(before ? 'change.modified' : 'change.new-file') };
}

async function refresh() {
  if (busy || !source) return;
  busy = true;
  try {
    const listing = await scan(source);
    const seen = new Set();
    const touched = [];
    for (const e of listing.entries) {
      seen.add(e.path);
      const old = cache.get(e.path);
      if (old && old.size === e.size && old.mtime === e.mtime) continue;
      // A file caught mid-write is read again in the next round.
      try { cache.set(e.path, { size: e.size, mtime: e.mtime, text: await e.file.text() }); touched.push(e.path); } catch (err) { if (err.name === 'NotAllowedError' || err.name === 'ServerDownError') throw err; }
    }
    for (const path of [...cache.keys()]) if (!seen.has(path)) { cache.delete(path); touched.push(path); }
    const shape = listing.trackerPath + '|' + listing.adrPath + '|' + listing.others.length;
    const first = !model;
    if (first || touched.length || shape !== source.shape) {
      source.shape = shape;
      const next = buildModel(source.name, cache, listing.others, listing.trackerPath, listing.adrPath);
      if (!first && touched.length) {
